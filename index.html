<style>
/* Layout: sidebar (desktop) / top bar + bottom nav (mobile), soft lavender ground, white rounded cards,
   periwinkle-blue primary, night-blue hero surfaces, orange reserved for progress, streaks and brand accents. */
:root {
  --bg: #EEF0F6;
  --surface: #FFFFFF;
  --surface-2: #F5F6FB;
  --surface-3: #E8EBF5;
  --ink: #141B3D;
  --ink-2: #434C72;
  --muted: #6E779A;
  --line: #E0E4EF;
  --primary: #4B55E8;
  --primary-2: #6E76F4;
  --primary-soft: #E7E9FD;
  --primary-ink: #2E36B5;
  --on-primary: #FFFFFF;
  --navy: #0E1A48;
  --navy-2: #22389E;
  --on-navy: #FFFFFF;
  --orange: #F26A12;
  --orange-soft: #FFEBDC;
  --orange-ink: #A94700;
  --good: #16895A;
  --good-soft: #DCF3E8;
  --warn: #A96400;
  --warn-soft: #FFF0D3;
  --bad: #CF3636;
  --bad-soft: #FCE3E3;
  --focus: #F26A12;
  --shadow: 0 1px 2px rgba(20, 27, 61, .05), 0 10px 28px rgba(20, 27, 61, .06);
  --shadow-lg: 0 24px 60px rgba(14, 26, 72, .18);
  --overlay: rgba(14, 20, 45, .45);
  --radius: 22px;
  --radius-sm: 14px;
  --f-display: 'Cabin', 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
  --f-body: 'Nunito Sans', 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;
  --f-mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --scale: 1;
  --side: 256px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A0E22; --surface: #121835; --surface-2: #171F42; --surface-3: #1F2852; --ink: #E9ECFB; --ink-2: #BAC1DF; --muted: #8C95B9; --line: #262F59;
    --primary: #7F89FF; --primary-2: #9BA3FF; --primary-soft: #222A62; --primary-ink: #C9CDFF; --on-primary: #0A0E22;
    --navy: #17225E; --navy-2: #2B41AE; --on-navy: #FFFFFF;
    --orange: #FF8B3E; --orange-soft: #3A2415; --orange-ink: #FFB888;
    --good: #43CC8F; --good-soft: #11362A; --warn: #F1B24E; --warn-soft: #3A2C11; --bad: #FF6E6E; --bad-soft: #3E1A20; --focus: #FF8B3E;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 28px rgba(0, 0, 0, .25); --shadow-lg: 0 24px 60px rgba(0, 0, 0, .5); --overlay: rgba(2, 4, 14, .66);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A0E22; --surface: #121835; --surface-2: #171F42; --surface-3: #1F2852; --ink: #E9ECFB; --ink-2: #BAC1DF; --muted: #8C95B9; --line: #262F59;
  --primary: #7F89FF; --primary-2: #9BA3FF; --primary-soft: #222A62; --primary-ink: #C9CDFF; --on-primary: #0A0E22;
  --navy: #17225E; --navy-2: #2B41AE; --on-navy: #FFFFFF;
  --orange: #FF8B3E; --orange-soft: #3A2415; --orange-ink: #FFB888;
  --good: #43CC8F; --good-soft: #11362A; --warn: #F1B24E; --warn-soft: #3A2C11; --bad: #FF6E6E; --bad-soft: #3E1A20; --focus: #FF8B3E;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 28px rgba(0, 0, 0, .25); --shadow-lg: 0 24px 60px rgba(0, 0, 0, .5); --overlay: rgba(2, 4, 14, .66);
  color-scheme: dark;
}

/* ---------- Base ---------- */
[hidden] { display: none !important; }
html { font-size: calc(16px * var(--scale)); -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 1rem; line-height: 1.55; margin: 0; overflow-x: hidden; }
*, *::before, *::after { box-sizing: border-box; }
h1, h2, h3, h4 { font-family: var(--f-display); color: var(--ink); line-height: 1.2; margin: 0 0 .4em; text-wrap: balance; letter-spacing: -.01em; }
h1 { font-size: clamp(1.6rem, 1.2rem + 1.6vw, 2.2rem); font-weight: 700; }
h2 { font-size: 1.3rem; font-weight: 700; }
h3 { font-size: 1.08rem; font-weight: 700; }
h4 { font-size: 1rem; font-weight: 700; }
p { margin: 0 0 .75em; }
a { color: var(--primary-ink); }
button, input, select, textarea { font: inherit; color: inherit; }
input, select, textarea { font-size: max(16px, 1rem); }
code { font-family: var(--f-mono); font-size: .9em; background: var(--surface-3); padding: .1em .35em; border-radius: 6px; }
mark { background: var(--orange-soft); color: var(--orange-ink); border-radius: 4px; padding: 0 .1em; }
.ic { flex: none; display: inline-block; vertical-align: middle; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 10px; }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: -999px; top: 8px; z-index: 100; background: var(--primary); color: var(--on-primary); padding: .5rem 1rem; border-radius: 10px; }
.skip:focus { left: 12px; }
.muted { color: var(--muted); }
.sm { font-size: .88rem; }
.xs { font-size: .78rem; }
.tnum { font-variant-numeric: tabular-nums; }
.lead { font-size: 1.12rem; color: var(--ink-2); max-width: 36rem; }
.lead-sm { color: var(--ink-2); }
.center { text-align: center; justify-content: center; }
.row { display: flex; align-items: center; gap: .6rem; }
.row.wrap { flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.gap-s { gap: .4rem; }
.eyebrow { display: inline-flex; align-items: center; gap: .35rem; font-size: .76rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--primary-ink); }
.eyebrow.light { color: rgba(255, 255, 255, .8); }
.mobile-only { display: none; }
ul.plain { padding-left: 1.1rem; margin: 0; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

/* ---------- Boot screen ---------- */
.boot { min-height: 70vh; display: grid; place-items: center; gap: 1rem; text-align: center; color: var(--muted); }
.boot .logo-svg { filter: drop-shadow(0 12px 24px rgba(31, 70, 184, .35)); }

/* ---------- Shell ---------- */
.sidebar { position: fixed; inset: 0 auto 0 0; width: var(--side); background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: .25rem; padding: calc(1.2rem + env(safe-area-inset-top, 0px)) .9rem 1rem; z-index: 20; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: .6rem; font-family: var(--f-display); font-weight: 700; font-size: 1.3rem; color: var(--ink); letter-spacing: -.01em; }
.sidebar .brand { padding: .2rem .5rem 1.1rem; }
.nav { display: flex; flex-direction: column; gap: .15rem; }
.nav-item { display: flex; align-items: center; gap: .75rem; width: 100%; padding: .62rem .8rem; border: 0; background: none; border-radius: 12px; color: var(--ink-2); font-weight: 700; font-size: .95rem; cursor: pointer; text-align: left; }
.nav-item:hover { background: var(--surface-2); color: var(--ink); }
.nav-item.active { background: var(--primary-soft); color: var(--primary-ink); }
.nav-item .count { margin-left: auto; font-style: normal; font-size: .72rem; background: var(--orange); color: #fff; border-radius: 999px; padding: .05rem .45rem; font-weight: 800; }
.nav-sep { height: 1px; background: var(--line); margin: .6rem .5rem; }
.side-foot { margin-top: auto; padding-top: .8rem; }
.topbar { display: none; }
#main { margin-left: var(--side); min-height: 100vh; outline: none; }
#main.bare { margin-left: 0; }
.page { max-width: 1120px; margin: 0 auto; padding-inline: 32px; padding-block: 28px 64px; display: flex; flex-direction: column; gap: 1.25rem; }
.bottom-nav { display: none; }

.status { display: inline-flex; align-items: center; gap: .45rem; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink-2); border-radius: 999px; padding: .32rem .7rem; font-size: .78rem; font-weight: 700; cursor: pointer; white-space: nowrap; }
.dot { width: .55rem; height: .55rem; border-radius: 50%; background: var(--muted); display: inline-block; flex: none; }
.st-ai .dot, .dot-ai { background: var(--good); box-shadow: 0 0 0 3px var(--good-soft); }
.st-local .dot, .dot-local { background: var(--warn); box-shadow: 0 0 0 3px var(--warn-soft); }
.st-off .dot, .dot-off { background: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
.offline-banner, .warn-banner { display: flex; align-items: center; gap: .6rem; margin: 0 auto; max-width: 1120px; padding: .6rem 1rem; font-size: .86rem; border-radius: 0 0 14px 14px; }
.offline-banner { background: var(--primary-soft); color: var(--primary-ink); }
.warn-banner { background: var(--warn-soft); color: var(--warn); }

@media (max-width: 959px) {
  .sidebar { display: none; }
  #main { margin-left: 0; padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
  #main.bare { padding-bottom: 0; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: .75rem; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 15; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); padding: .7rem 16px; border-bottom: 1px solid var(--line); }
  .topbar .brand { font-size: 1.15rem; }
  .bottom-nav { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line); padding: .35rem .25rem calc(.35rem + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -8px 24px rgba(14, 26, 72, .06); }
  .bn-item { position: relative; display: flex; flex-direction: column; align-items: center; gap: .15rem; border: 0; background: none; color: var(--muted); font-size: .7rem; font-weight: 700; padding: .35rem 0; min-height: 52px; cursor: pointer; border-radius: 12px; }
  .bn-item.active { color: var(--primary-ink); }
  .bn-item.active .ic { background: var(--primary-soft); border-radius: 10px; padding: 2px 10px; width: 44px; height: 28px; box-sizing: content-box; margin: -2px 0; }
  .bn-dot { position: absolute; top: 6px; right: calc(50% - 16px); width: 8px; height: 8px; border-radius: 50%; background: var(--orange); border: 2px solid var(--surface); }
  .page { padding-inline: 16px; padding-block: 18px 32px; gap: 1rem; }
  .mobile-only { display: block; }
}

/* ---------- Buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .45rem; min-height: 44px; padding: .55rem 1.05rem; border-radius: 14px; border: 1.5px solid transparent; font-weight: 800; font-size: .95rem; cursor: pointer; text-decoration: none; white-space: nowrap; transition: transform .12s ease, background .15s ease, box-shadow .15s ease; }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled, .btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn.sm { min-height: 36px; padding: .35rem .75rem; font-size: .85rem; border-radius: 11px; }
.btn.lg { min-height: 52px; padding: .7rem 1.35rem; font-size: 1rem; border-radius: 16px; }
.btn-primary { background: var(--primary); color: var(--on-primary); box-shadow: 0 6px 16px color-mix(in srgb, var(--primary) 30%, transparent); }
.btn-primary:hover:not(:disabled) { background: var(--primary-2); }
.btn-outline { background: var(--surface); color: var(--ink); border-color: var(--ink); }
.btn-outline:hover:not(:disabled) { background: var(--surface-2); }
.btn-ghost { background: transparent; color: var(--ink-2); }
.btn-ghost:hover:not(:disabled) { background: var(--surface-3); color: var(--ink); }
.btn-ghost-danger { background: transparent; color: var(--bad); }
.btn-ghost-danger:hover { background: var(--bad-soft); }
.btn-light { background: #fff; color: #0E1A48; }
.btn-light:hover { background: #F1F3FF; }
.btn-danger { background: var(--bad); color: #fff; }
.icon-btn { display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 12px; border: 0; background: transparent; color: var(--ink-2); cursor: pointer; flex: none; }
.icon-btn:hover { background: var(--surface-3); }
.icon-btn.sm { width: 34px; height: 34px; }
.icon-btn:disabled { opacity: .35; cursor: default; }
.link-btn { border: 0; background: none; color: var(--muted); text-decoration: underline; cursor: pointer; padding: .2rem 0; }

/* ---------- Cards, badges, bars ---------- */
.card { background: var(--surface); border-radius: var(--radius); padding: 1.25rem; box-shadow: var(--shadow); min-width: 0; }
.card > :last-child { margin-bottom: 0; }
.sec-head { display: flex; align-items: center; justify-content: space-between; gap: .75rem; margin-bottom: .75rem; flex-wrap: wrap; }
.sec-head h2 { font-size: 1.12rem; margin: 0; }
.badge { display: inline-flex; align-items: center; gap: .3rem; padding: .18rem .55rem; border-radius: 999px; font-size: .74rem; font-weight: 800; line-height: 1.4; white-space: nowrap; }
.badge-neutral { background: var(--surface-3); color: var(--ink-2); }
.badge-blue { background: var(--primary-soft); color: var(--primary-ink); }
.badge-orange { background: var(--orange-soft); color: var(--orange-ink); }
.badge-good { background: var(--good-soft); color: var(--good); }
.badge-warn { background: var(--warn-soft); color: var(--warn); }
.badge-bad { background: var(--bad-soft); color: var(--bad); }
.bar { height: 8px; min-height: 8px; max-height: 8px; border-radius: 999px; background: var(--surface-3); overflow: hidden; flex: 1 1 auto; min-width: 40px; }
.focus-page > .bar, .today-goal > .bar, .bdg > .bar { flex: none; width: 100%; }
.bar > span { display: block; height: 100%; border-radius: inherit; background: var(--primary); transition: width .4s ease; }
.bar-orange > span { background: var(--orange); }
.bar-good > span { background: var(--good); }
.bar-bad > span { background: var(--bad); }
.bar-muted > span { background: var(--muted); }
.note { display: flex; align-items: flex-start; gap: .55rem; padding: .7rem .9rem; border-radius: 14px; background: var(--surface-2); color: var(--ink-2); font-size: .88rem; }
.note .ic { margin-top: .12rem; }
.note.warn { background: var(--warn-soft); color: var(--warn); }
.note.good { background: var(--good-soft); color: var(--good); }
.note.info { background: var(--primary-soft); color: var(--primary-ink); }
.note .btn { margin-left: auto; }
.empty { text-align: center; padding: 2.5rem 1rem; display: flex; flex-direction: column; align-items: center; gap: .4rem; }
.empty-ic { width: 64px; height: 64px; border-radius: 20px; display: grid; place-items: center; background: var(--primary-soft); color: var(--primary-ink); margin-bottom: .5rem; }
.empty p { color: var(--muted); max-width: 30rem; }
.loading { display: flex; align-items: center; justify-content: center; gap: .6rem; padding: 1.2rem; color: var(--muted); font-size: .92rem; }
.spinner { width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--primary-soft); border-top-color: var(--primary); animation: spin .8s linear infinite; display: inline-block; flex: none; }
.spinner.sm { width: 14px; height: 14px; border-width: 2px; vertical-align: -2px; }
@keyframes spin { to { transform: rotate(360deg); } }
.error-state { display: flex; gap: .6rem; align-items: flex-start; padding: .9rem 1rem; border-radius: 14px; background: var(--bad-soft); color: var(--bad); }
.error-state p { margin: 0 0 .4rem; }

.source { border-top: 1px dashed var(--line); padding-top: .6rem; margin-top: .6rem; font-size: .85rem; }
.source-label { color: var(--ink-2); display: flex; align-items: center; gap: .35rem; flex-wrap: wrap; }
blockquote { margin: .45rem 0 0; padding: .5rem .8rem; border-left: 3px solid var(--primary); background: var(--surface-2); border-radius: 0 10px 10px 0; color: var(--ink-2); font-size: .88rem; overflow-wrap: anywhere; }

/* ---------- Thumbnails ---------- */
.thumb { position: relative; flex: none; border-radius: 16px; display: grid; place-items: center; overflow: hidden; background: linear-gradient(160deg, var(--navy), var(--navy-2)); color: #fff; }
.thumb-sm { width: 44px; height: 44px; border-radius: 12px; }
.thumb-md { width: 100%; height: 100%; }
.thumb-lg { width: 72px; height: 72px; border-radius: 20px; }
.thumb.t2 { background: linear-gradient(160deg, #3E2A8C, #6D5BEA); }
.thumb.t3 { background: linear-gradient(160deg, #0D4A63, #1B8DB0); }
.thumb.t4 { background: linear-gradient(160deg, #6B2C0B, #F26A12); }
.thumb.t5 { background: linear-gradient(160deg, #173B2E, #2F9E73); }
.thumb b { position: relative; z-index: 2; font-family: Georgia, 'Times New Roman', serif; font-size: 1.6em; color: #16225C; }
.thumb-sm b { font-size: 1rem; }
.thumb-lg b { font-size: 1.7rem; }
.thumb-md b { font-size: 2.2rem; }
.thumb-sheet { position: absolute; width: 46%; height: 60%; background: #fff; border-radius: 8%; transform: rotate(-7deg); z-index: 1; box-shadow: 0 6px 14px rgba(0, 0, 0, .18); }
.thumb-sheet.s2 { background: #DCE4F7; transform: translate(18%, -8%) rotate(9deg); z-index: 0; }

/* ---------- Forms ---------- */
.field { display: flex; flex-direction: column; gap: .35rem; min-width: 0; border: 0; padding: 0; margin: 0; }
.field > span, .field legend { font-weight: 800; font-size: .86rem; color: var(--ink-2); padding: 0; }
.field.inline { flex-direction: row; align-items: center; gap: .6rem; }
input[type=text], input[type=search], input[type=date], input:not([type]), select, textarea { width: 100%; min-height: 46px; padding: .6rem .85rem; border: 1.5px solid var(--line); border-radius: 13px; background: var(--surface); color: var(--ink); }
textarea { resize: vertical; line-height: 1.5; }
input:focus, select:focus, textarea:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 4px var(--primary-soft); }
select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 18px) 55%, calc(100% - 13px) 55%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 2.2rem; }
.select-wrap { display: block; min-width: 0; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; }
.form-grid .span2, .form-grid .types, .form-actions { grid-column: 1 / -1; }
@media (max-width: 640px) { .form-grid { grid-template-columns: 1fr; } }
.check-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: .4rem .8rem; }
.types { display: flex; flex-wrap: wrap; gap: .4rem .9rem; }
.types legend { width: 100%; margin-bottom: .35rem; }
.check { display: flex; align-items: flex-start; gap: .5rem; cursor: pointer; font-size: .92rem; padding: .25rem 0; min-width: 0; }
.check input { width: 18px; height: 18px; margin-top: .15rem; accent-color: var(--primary); flex: none; }
.check em { font-style: normal; }
.check.strong { font-weight: 700; }
.search { position: relative; display: flex; align-items: center; flex: 1; min-width: 0; }
.search .ic { position: absolute; left: .85rem; color: var(--muted); pointer-events: none; }
.search input { padding-left: 2.6rem; }
.toolbar { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; }
.toolbar .select-wrap { min-width: 180px; }
.switch-row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: .8rem 0; border-top: 1px solid var(--line); cursor: pointer; }
.switch-row > span { display: flex; flex-direction: column; gap: .15rem; min-width: 0; }
.switch { appearance: none; width: 48px; height: 28px; border-radius: 999px; background: var(--surface-3); position: relative; cursor: pointer; flex: none; transition: background .2s; border: 1.5px solid var(--line); }
.switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 19px; height: 19px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 3px rgba(0, 0, 0, .25); transition: transform .2s; }
.switch:checked { background: var(--primary); border-color: var(--primary); }
.switch:checked::after { transform: translateX(20px); }

/* ---------- Chips & tabs ---------- */
.chips { display: flex; gap: .45rem; flex-wrap: wrap; align-items: center; }
.tabs-scroll { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; margin-inline: -4px; padding-inline: 4px; }
.tabs-scroll::-webkit-scrollbar { display: none; }
.chip { display: inline-flex; align-items: center; gap: .4rem; min-height: 40px; padding: .4rem .9rem; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink-2); font-weight: 700; font-size: .88rem; cursor: pointer; white-space: nowrap; }
.chip:hover { border-color: var(--primary-2); color: var(--ink); }
.chip.active { background: var(--primary-soft); border-color: transparent; color: var(--primary-ink); }
.chip.lg { min-height: 46px; padding: .5rem 1.1rem; }
.chip .lock { font-style: normal; color: var(--orange-ink); display: inline-flex; }
.tabs { display: flex; gap: .3rem; background: var(--surface-2); padding: .3rem; border-radius: 14px; margin-bottom: 1rem; }
.tab { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: .4rem; min-height: 40px; border: 0; border-radius: 11px; background: none; font-weight: 800; color: var(--muted); cursor: pointer; }
.tab.active { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

/* ---------- Toasts & modals ---------- */
#toasts { position: fixed; z-index: 90; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: .5rem; width: min(440px, calc(100vw - 32px)); pointer-events: none; }
@media (min-width: 960px) { #toasts { bottom: 24px; left: auto; right: 24px; transform: none; } }
.toast { display: flex; align-items: flex-start; gap: .6rem; padding: .8rem 1rem; border-radius: 14px; background: var(--ink); color: var(--bg); box-shadow: var(--shadow-lg); font-size: .9rem; font-weight: 600; animation: toastIn .25s ease; pointer-events: auto; }
.toast .ic { margin-top: .1rem; }
.toast-good .ic { color: #4ADE9A; }
.toast-bad .ic, .toast-warn .ic { color: #FFB06B; }
.toast.out { opacity: 0; transform: translateY(6px); transition: .3s; }
@keyframes toastIn { from { opacity: 0; transform: translateY(10px); } }
.modal-open { overflow: hidden; }
.modal-wrap { position: fixed; inset: 0; z-index: 80; background: var(--overlay); display: flex; align-items: center; justify-content: center; padding: 16px; animation: fade .2s ease; }
@keyframes fade { from { opacity: 0; } }
.modal { background: var(--surface); color: var(--ink); width: min(520px, 100%); max-height: calc(100vh - 32px); max-height: calc(100dvh - 32px); display: flex; flex-direction: column; border-radius: 24px; box-shadow: var(--shadow-lg); animation: pop .22s ease; }
.modal.lg { width: min(760px, 100%); }
@keyframes pop { from { transform: translateY(12px) scale(.98); opacity: 0; } }
.modal-head { display: flex; align-items: center; justify-content: space-between; gap: .75rem; padding: 1.1rem 1.2rem .4rem 1.4rem; }
.modal-head h3 { margin: 0; font-size: 1.15rem; }
.modal-body { padding: .6rem 1.4rem 1.2rem; overflow-y: auto; display: flex; flex-direction: column; gap: .85rem; min-height: 0; }
.modal-foot { display: flex; gap: .5rem; justify-content: flex-end; flex-wrap: wrap; padding: .9rem 1.4rem calc(1.1rem + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); }
@media (max-width: 640px) {
  .modal-wrap { align-items: flex-end; padding: 0; }
  .modal, .modal.lg { width: 100%; border-radius: 24px 24px 0 0; max-height: 92vh; max-height: 92dvh; }
  .modal-foot .btn { flex: 1 1 auto; }
}
.menu-list { display: flex; flex-direction: column; gap: .2rem; }
.menu-list .btn { justify-content: flex-start; }

/* ---------- Landing ---------- */
.landing, .ob { max-width: 1120px; margin: 0 auto; padding-inline: 24px; padding-block: 16px 64px; }
.land-top { display: flex; align-items: center; justify-content: space-between; padding-block: .5rem 1.5rem; }
.hero { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); gap: 2.5rem; align-items: center; padding-block: 1.5rem 3rem; }
.hero h1 { font-size: clamp(2.1rem, 1.3rem + 3vw, 3.6rem); line-height: 1.08; margin: .9rem 0 1rem; color: var(--ink); }
.hl { display: inline-block; position: relative; background: var(--primary); color: #fff; padding: 0 .22em .04em; border-radius: 6px; transform: rotate(-1.6deg); margin-inline: .04em; }
.hl::after { content: ''; position: absolute; inset: -5px -6px -4px -4px; border: 2px solid var(--primary); border-radius: 8px; transform: rotate(2.4deg); pointer-events: none; }
.hero .eyebrow { background: var(--surface); padding: .4rem .75rem; border-radius: 999px; box-shadow: var(--shadow); text-transform: none; letter-spacing: 0; font-size: .82rem; }
.hero .row { margin-top: 1.5rem; }
.hero-visual { position: relative; min-height: 400px; display: grid; place-items: center; }
.hero-visual::before { content: ''; position: absolute; width: 78%; aspect-ratio: 1; max-width: 100%; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--orange) 30%, transparent), transparent 65%); }
.demo-phone { position: relative; width: min(330px, 100%); background: var(--surface); border-radius: 30px; padding: 1.2rem 1.1rem 1.1rem; box-shadow: var(--shadow-lg); border: 8px solid var(--ink); display: flex; flex-direction: column; gap: .6rem; }
.demo-head { display: flex; justify-content: space-between; gap: .5rem; font-size: .72rem; color: var(--muted); font-weight: 700; white-space: nowrap; }
.demo-q { font-family: var(--f-display); font-weight: 700; font-size: 1.05rem; margin: .4rem 0; }
.demo-opt { border: 1.5px solid var(--line); border-radius: 14px; padding: .6rem .8rem; font-size: .86rem; display: flex; gap: .4rem; align-items: center; }
.demo-opt.ok { border-color: var(--good); background: var(--good-soft); color: var(--good); font-weight: 700; }
.demo-src { font-size: .72rem; color: var(--muted); display: flex; gap: .3rem; align-items: center; }
.demo-chip { position: absolute; display: inline-flex; align-items: center; gap: .35rem; background: var(--surface); padding: .5rem .8rem; border-radius: 999px; box-shadow: var(--shadow-lg); font-weight: 800; font-size: .82rem; }
.demo-chip.c1 { top: 46%; left: -6px; color: var(--orange-ink); }
.demo-chip.c2 { bottom: 6%; right: 0; color: var(--primary-ink); }
.pipeline, .how { padding-block: 2rem; }
.pipeline h2, .how h2 { font-size: 1.6rem; margin-bottom: 1.2rem; }
.flow { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1rem; counter-reset: f; }
.flow li { background: var(--surface); border-radius: var(--radius); padding: 1.1rem; box-shadow: var(--shadow); display: flex; gap: .8rem; align-items: flex-start; position: relative; }
.flow li div { display: flex; flex-direction: column; gap: .15rem; min-width: 0; }
.flow li span:not(.flow-ic) { color: var(--muted); font-size: .88rem; }
.flow-ic { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; background: var(--primary-soft); color: var(--primary-ink); flex: none; }
.flow li:nth-child(4) .flow-ic, .flow li:nth-child(6) .flow-ic { background: var(--orange-soft); color: var(--orange-ink); }
.how-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1rem; }
.how-card { background: var(--surface); border-radius: var(--radius); padding: 1.2rem; box-shadow: var(--shadow); }
.how-card p { color: var(--muted); margin: 0; font-size: .92rem; }
.how-n { display: inline-grid; place-items: center; width: 36px; height: 36px; border-radius: 12px; background: var(--navy); color: #fff; font-family: var(--f-display); font-weight: 700; margin-bottom: .7rem; }
.trust { margin-top: 2rem; display: flex; align-items: center; justify-content: space-between; gap: 1.5rem; flex-wrap: wrap; background: linear-gradient(135deg, var(--navy), var(--navy-2)); color: var(--on-navy); border-radius: 28px; padding: 1.6rem 1.8rem; }
.trust > div { display: flex; gap: .9rem; align-items: flex-start; max-width: 40rem; }
.trust > div > div { display: flex; flex-direction: column; gap: .2rem; }
.trust > div span { color: rgba(255, 255, 255, .8); font-size: .92rem; }
.trust .btn-primary { background: #fff; color: #0E1A48; box-shadow: none; }
@media (max-width: 900px) {
  .hero { grid-template-columns: 1fr; gap: 1rem; padding-block: .5rem 2rem; }
  .hero-visual { min-height: 340px; }
  .flow { grid-template-columns: 1fr 1fr; }
  .how-grid { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 560px) {
  .landing, .ob { padding-inline: 16px; }
  .flow, .how-grid { grid-template-columns: 1fr; }
  .hero .row .btn { flex: 1 1 100%; }
  .demo-chip { display: none; }
}

/* ---------- Onboarding ---------- */
.ob-card { max-width: 620px; margin: 1rem auto 0; background: var(--surface); border-radius: 28px; box-shadow: var(--shadow); padding: 1.8rem; display: flex; flex-direction: column; gap: .8rem; }
.ob-card h2 { font-size: 1.55rem; margin: .4rem 0 0; }
.ob-dots { display: flex; gap: .4rem; }
.ob-dots span { height: 6px; flex: 1; border-radius: 999px; background: var(--surface-3); }
.ob-dots span.on { background: var(--primary); }
.ob-count { align-self: flex-end; margin-top: -.4rem; }
.ob-actions { margin-top: .8rem; }
.choice-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .6rem; }
.choice-grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.choice-grid.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.choice { display: flex; align-items: center; gap: .6rem; min-height: 60px; padding: .8rem 1rem; border-radius: 16px; border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 700; color: var(--ink); text-align: left; }
.choice-grid.four .choice { flex-direction: column; justify-content: center; gap: 0; text-align: center; }
.choice-grid.four .choice strong { font-family: var(--f-display); font-size: 1.5rem; }
.choice-grid.three .choice { justify-content: center; }
.choice:hover { border-color: var(--primary-2); }
.choice.sel { border-color: var(--primary); background: var(--primary-soft); color: var(--primary-ink); box-shadow: 0 0 0 3px var(--primary-soft); }
.choice .ic { color: var(--primary); }
@media (max-width: 560px) {
  .ob-card { padding: 1.3rem; border-radius: 24px; }
  .choice-grid, .choice-grid.three { grid-template-columns: 1fr; }
  .choice-grid.four { grid-template-columns: 1fr 1fr; }
}

/* ---------- Home ---------- */
.greet h1 { margin-bottom: .1rem; }
.first-run { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 1.5rem; align-items: center; padding: 1.8rem; }
.first-run h2 { font-size: 1.45rem; }
.mini-steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .5rem; }
.mini-steps li { display: flex; align-items: center; gap: .7rem; background: var(--surface-2); padding: .7rem .9rem; border-radius: 14px; font-weight: 700; }
.mini-steps b { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 9px; background: var(--primary); color: var(--on-primary); font-size: .85rem; }
.grid-home { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 1.25rem; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.25rem; align-items: start; }
.hero-card { position: relative; overflow: hidden; border-radius: 26px; padding: 1.6rem; color: var(--on-navy); background: radial-gradient(120% 140% at 100% 0%, color-mix(in srgb, var(--orange) 45%, transparent), transparent 45%), linear-gradient(140deg, var(--navy) 0%, var(--navy-2) 100%); min-height: 190px; display: flex; align-items: center; }
.hero-card h2 { color: #fff; font-size: 1.6rem; margin: .3rem 0 .4rem; }
.hero-card p { color: rgba(255, 255, 255, .82); max-width: 26rem; }
.hero-card-copy { position: relative; z-index: 2; }
.hero-card.slim { min-height: 0; }
.hero-art { position: absolute; right: 1.4rem; top: 50%; transform: translateY(-50%); width: 150px; height: 150px; z-index: 1; opacity: .95; }
.ha-card { position: absolute; width: 74px; height: 96px; border-radius: 14px; background: #fff; box-shadow: 0 12px 26px rgba(0, 0, 0, .25); }
.ha-card.a { left: 26px; top: 26px; transform: rotate(-9deg); }
.ha-card.a::before { content: 'R'; position: absolute; inset: 0; display: grid; place-items: center; font-family: Georgia, serif; font-weight: 700; font-size: 2.4rem; color: #1F3A9E; }
.ha-card.b { left: 58px; top: 14px; background: #DCE4F7; transform: rotate(8deg); z-index: -1; }
.ha-ring { position: absolute; left: 6px; top: 70px; width: 138px; height: 70px; border: 7px solid #FF8A2A; border-color: transparent transparent #FF8A2A #FF8A2A; border-radius: 0 0 90px 90px; transform: rotate(-8deg); }
@media (max-width: 700px) { .hero-art { opacity: .28; right: -20px; } }
.time-chips { display: flex; gap: .45rem; flex-wrap: wrap; margin: .6rem 0 1rem; }
.today-goal { display: flex; flex-direction: column; gap: .4rem; border-top: 1px solid var(--line); padding-top: .9rem; }
.resume { border: 1.5px solid var(--primary-soft); }
.resume h3 { margin: .2rem 0; }
.task-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .3rem; }
.task-list li { display: flex; align-items: center; gap: .7rem; padding: .55rem .2rem; border-bottom: 1px solid var(--line); min-width: 0; }
.task-list li:last-child { border-bottom: 0; }
.task-list li > span:not(.tick) { min-width: 0; }
.task-list .task-l { flex: 1; }
.task-list li.done .task-l, .task-list li.done > span:nth-child(2) { text-decoration: line-through; color: var(--muted); }
.tick { width: 26px; height: 26px; border-radius: 9px; border: 2px solid var(--line); display: grid; place-items: center; background: var(--surface); color: var(--on-primary); flex: none; cursor: pointer; padding: 0; }
li.done .tick { background: var(--good); border-color: var(--good); color: #fff; }
.course-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1rem; }
.course-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1rem; }
.cg-item { position: relative; min-width: 0; }
.cg-menu { position: absolute; top: .5rem; right: .5rem; background: color-mix(in srgb, var(--surface) 85%, transparent); }
.course-card { display: flex; flex-direction: column; width: 100%; text-align: left; border: 0; background: var(--surface); border-radius: var(--radius); padding: .7rem; box-shadow: var(--shadow); cursor: pointer; color: var(--ink); transition: transform .15s ease, box-shadow .15s ease; min-width: 0; height: 100%; }
.course-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
.cc-thumb { position: relative; height: 128px; border-radius: 16px; overflow: hidden; }
.cc-thumb .thumb { border-radius: 16px; }

<script>

   ============================================================ */
let __logoSeq = 0;
function logoSVG(size = 40, opts = {}) {

  const title = opts.title === false ? '' : '<title>Revora</title>';
  return `<svg class="logo-svg" width="${size}" height="${size}" viewBox="0 0 512 512" role="img" aria-label="Revora" xmlns="http://www.w3.org/2000/svg">${title}

    <linearGradient id="${k}pen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F1F4FB"/><stop offset="1" stop-color="#9AA8C7"/></linearGradient>
  </defs>
  <rect x="10" y="10" width="492" height="492" rx="116" fill="url(#${k}rim)"/>
  <rect x="20" y="20" width="472" height="472" rx="108" fill="url(#${k}bg)"/>
  <ellipse cx="256" cy="250" rx="200" ry="175" fill="url(#${k}glow)"/>

/* ---- 01-util.js ---- */
/* ============================================================
   core/util — small helpers shared by every module
   ============================================================ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const DAY = 864e5;
const now = () => Date.now();
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const uid = (p = 'id') => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function attr(s) { return esc(s); }

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

function norm(s) {
  return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/['’`]/g, ' ').replace(/[^a-z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim();
}
function trunc(s, n) { s = String(s || ''); return s.length > n ? s.slice(0, n - 1).trimEnd() + '…' : s; }
function cap(s) { s = String(s || '').trim(); return s ? s[0].toUpperCase() + s.slice(1) : s; }

function levenshtein(a, b) {
  if (a === b) return 0;
  if (!a.length) return b.length; if (!b.length) return a.length;
  let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    const cur = [i];
    for (let j = 1; j <= b.length; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    }
    prev = cur;
  }
  return prev[b.length];
}

function dayKey(ts = now()) {
  const d = new Date(ts);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function startOfDay(ts = now()) { const d = new Date(ts); d.setHours(0, 0, 0, 0); return d.getTime(); }
function fmtDate(ts, withYear = false) {
  if (!ts) return '';

}
function fmtRelative(ts) {
  if (!ts) return 'jamais';
  const diff = now() - ts;
  if (diff < 60e3) return "à l'instant";
  if (diff < 3600e3) return 'il y a ' + Math.round(diff / 60e3) + ' min';
  if (diff < DAY) return 'il y a ' + Math.round(diff / 3600e3) + ' h';
  const d = Math.round(diff / DAY);
  if (d === 1) return 'hier';
  if (d < 30) return 'il y a ' + d + ' jours';
  return fmtDate(ts, true);
}
function fmtDuration(ms) {
  const s = Math.max(0, Math.round(ms / 1000));
  if (s < 60) return s + ' s';
  const m = Math.floor(s / 60);
  if (m < 60) return m + ' min' + (s % 60 && m < 10 ? ' ' + (s % 60) + ' s' : '');
  return Math.floor(m / 60) + ' h ' + String(m % 60).padStart(2, '0');
}
function fmtClock(ms) {
  const s = Math.max(0, Math.ceil(ms / 1000));
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}
function pct(x) { return x == null || isNaN(x) ? '—' : Math.round(x * 100) + ' %'; }
function plural(n, one, many) { return n + ' ' + (n > 1 ? (many || one + 's') : one); }
function fmtSize(b) { return b < 1024 ? b + ' o' : b < 1048576 ? Math.round(b / 1024) + ' Ko' : (b / 1048576).toFixed(1) + ' Mo'; }
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

/* Safe, tiny markdown → HTML (escape first, then format). Used for AI text. */
function md(src) {
  const text = String(src || '');
  const blocks = [];
  let out = text.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => {
    blocks.push('<pre class="code"><code>' + esc(code.replace(/\n$/, '')) + '</code></pre>');
    return '\u0000' + (blocks.length - 1) + '\u0000';
  });
  out = esc(out);
  const lines = out.split('\n');
  const html = [];
  let list = null;
  const inline = s => s
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,;:!?]|$)/g, '$1<em>$2</em>');
  const closeList = () => { if (list) { html.push('</' + list + '>'); list = null; } };
  for (const raw of lines) {
    const line = raw.trimEnd();
    let m;
    if (/^\u0000\d+\u0000$/.test(line.trim())) { closeList(); html.push(line.trim()); continue; }
    if ((m = line.match(/^\s*[-•*]\s+(.*)/))) { if (list !== 'ul') { closeList(); html.push('<ul>'); list = 'ul'; } html.push('<li>' + inline(m[1]) + '</li>'); continue; }
    if ((m = line.match(/^\s*\d+[.)]\s+(.*)/))) { if (list !== 'ol') { closeList(); html.push('<ol>'); list = 'ol'; } html.push('<li>' + inline(m[1]) + '</li>'); continue; }
    closeList();
    if ((m = line.match(/^(#{1,4})\s+(.*)/))) { html.push('<h4 class="md-h">' + inline(m[2]) + '</h4>'); continue; }
    if (/^\|.*\|$/.test(line.trim())) {
      const cells = line.trim().slice(1, -1).split('|').map(c => c.trim());
      if (cells.every(c => /^:?-{2,}:?$/.test(c))) continue;
      const last = html[html.length - 1] || '';
      const row = '<tr>' + cells.map(c => '<td>' + inline(c) + '</td>').join('') + '</tr>';
      if (last.endsWith('</table></div>')) html[html.length - 1] = last.replace('</table></div>', row + '</table></div>');
      else html.push('<div class="table-wrap"><table class="md-table">' + row.replace(/<td>/g, '<th>').replace(/<\/td>/g, '</th>') + '</table></div>');
      continue;
    }
    if (!line.trim()) { html.push(''); continue; }
    html.push('<p>' + inline(line) + '</p>');
  }
  closeList();
  return html.join('\n').replace(/\u0000(\d+)\u0000/g, (_, i) => blocks[+i]);
}

/* Render a question prompt: supports fenced code blocks and inline code only. */
function richText(s) { return md(s); }

/* ---- 02-store.js ---- */
/* ============================================================
   core/store — local-first persistence
   IndexedDB (preferred) → localStorage → memory (with warning).
   All collections are loaded into memory at start so reads are
   synchronous; every write is persisted immediately.
   Entities are kept in separate collections (no giant object).
   ============================================================ */
const COLLECTIONS = ['prefs', 'folders', 'documents', 'sections', 'concepts', 'questions', 'flashcards',
  'attempts', 'sessions', 'plans', 'generated', 'chats', 'meta'];

const Store = {
  data: {},
  mode: 'memory',
  db: null,
  failed: false,
  listeners: new Set(),

  async init() {
    for (const c of COLLECTIONS) this.data[c] = new Map();
    try {
      await this._openIDB();
      this.mode = 'idb';
      for (const c of COLLECTIONS) {
        const rows = await this._idbAll(c);
        for (const r of rows) this.data[c].set(r.id, r);
      }
      return;
    } catch (e) { this.db = null; }
    try {
      const k = '__revora_probe';
      localStorage.setItem(k, '1'); localStorage.removeItem(k);
      this.mode = 'local';
      for (const c of COLLECTIONS) {
        const raw = localStorage.getItem('revora:' + c);
        if (raw) for (const r of JSON.parse(raw)) this.data[c].set(r.id, r);
      }
    } catch (e) { this.mode = 'memory'; }
  },

  _openIDB() {
    return new Promise((resolve, reject) => {
      if (!('indexedDB' in window)) return reject(new Error('no idb'));
      let req;
      try { req = indexedDB.open('revora', 2); } catch (e) { return reject(e); }
      const timer = setTimeout(() => reject(new Error('idb timeout')), 4000);
      req.onupgradeneeded = () => {
        const db = req.result;
        for (const c of COLLECTIONS) if (!db.objectStoreNames.contains(c)) db.createObjectStore(c, { keyPath: 'id' });
      };
      req.onsuccess = () => { clearTimeout(timer); this.db = req.result; resolve(); };
      req.onerror = () => { clearTimeout(timer); reject(req.error); };
      req.onblocked = () => { clearTimeout(timer); reject(new Error('blocked')); };
    });
  },
  _idbAll(c) {
    return new Promise((resolve, reject) => {
      const tx = this.db.transaction(c, 'readonly');
      const r = tx.objectStore(c).getAll();
      r.onsuccess = () => resolve(r.result || []);
      r.onerror = () => reject(r.error);
    });
  },
  _idbWrite(c, ops) {
    try {
      const tx = this.db.transaction(c, 'readwrite');
      const os = tx.objectStore(c);
      for (const [op, v] of ops) op === 'put' ? os.put(v) : os.delete(v);
      tx.onerror = () => this._fail(tx.error);
    } catch (e) { this._fail(e); }
  },
  _localTimers: {},
  _localWrite(c) {
    clearTimeout(this._localTimers[c]);
    this._localTimers[c] = setTimeout(() => {
      try { localStorage.setItem('revora:' + c, JSON.stringify([...this.data[c].values()])); }
      catch (e) { this._fail(e); }
    }, 120);
  },
  _fail(e) {
    if (this.failed) return;
    this.failed = true;
    if (typeof toast === 'function') toast("L'enregistrement local a échoué (espace de stockage plein ?). Exporte une sauvegarde depuis Paramètres.", 'bad', 8000);
  },
  _persist(c, ops) {
    if (c !== 'meta' && !this.silent) {
      const m = { id: 'sync', updatedAt: now() };
      this.data.meta.set('sync', m);
      if (this.mode === 'idb') this._idbWrite('meta', [['put', m]]); else if (this.mode === 'local') this._localWrite('meta');
    }
    if (this.mode === 'idb') this._idbWrite(c, ops);
    else if (this.mode === 'local') this._localWrite(c);
    this.listeners.forEach(fn => { try { fn(c); } catch (e) { } });
  },

  all(c) { return [...this.data[c].values()]; },
  get(c, id) { return this.data[c].get(id) || null; },
  where(c, fn) { const out = []; for (const v of this.data[c].values()) if (fn(v)) out.push(v); return out; },
  count(c, fn) { let n = 0; for (const v of this.data[c].values()) if (!fn || fn(v)) n++; return n; },
  put(c, obj) {
    if (!obj || !obj.id) throw new Error('Store.put: missing id');
    this.data[c].set(obj.id, obj);
    this._persist(c, [['put', this._clean(obj)]]);
    return obj;
  },
  putMany(c, arr) {
    if (!arr.length) return;
    for (const o of arr) this.data[c].set(o.id, o);
    this._persist(c, arr.map(o => ['put', this._clean(o)]));
  },
  del(c, id) { this.data[c].delete(id); this._persist(c, [['del', id]]); },
  delWhere(c, fn) {
    const ids = [];
    for (const [id, v] of this.data[c]) if (fn(v)) ids.push(id);
    ids.forEach(id => this.data[c].delete(id));
    if (ids.length) this._persist(c, ids.map(id => ['del', id]));
    return ids.length;
  },
  // strip transient fields (prefixed with _) before persisting
  _clean(o) {
    let dirty = false;
    for (const k in o) if (k[0] === '_') { dirty = true; break; }
    if (!dirty) return o;
    const c = {};
    for (const k in o) if (k[0] !== '_') c[k] = o[k];
    return c;
  },
  async clearAll() {
    for (const c of COLLECTIONS) this.data[c].clear();
    if (this.mode === 'idb') {
      for (const c of COLLECTIONS) {
        await new Promise(res => {
          try { const tx = this.db.transaction(c, 'readwrite'); tx.objectStore(c).clear(); tx.oncomplete = res; tx.onerror = res; }
          catch (e) { res(); }
        });
      }
    } else if (this.mode === 'local') {
      for (const c of COLLECTIONS) { try { localStorage.removeItem('revora:' + c); } catch (e) { } }
    }
  },
  exportAll() {
    const out = { app: 'Revora', version: 1, exportedAt: new Date().toISOString(), data: {} };
    for (const c of COLLECTIONS) out.data[c] = this.all(c).map(o => this._clean(o));
    return out;
  },
  importAll(json) {
    if (!json || json.app !== 'Revora' || !json.data) throw new Error('format');
    for (const c of COLLECTIONS) {
      const rows = Array.isArray(json.data[c]) ? json.data[c].filter(r => r && typeof r.id === 'string') : [];
      this.putMany(c, rows);
    }
  },
  onChange(fn) { this.listeners.add(fn); return () => this.listeners.delete(fn); },
  stamp() { const m = this.data.meta.get('sync'); return m ? m.updatedAt : 0; },
  isEmpty() { return !this.data.documents.size && !this.data.attempts.size && !(this.data.prefs.get('prefs') || {}).onboarded; },
  /* Replace one whole collection (used when restoring the private backup) */
  async replaceCollection(c, rows) {
    this.silent = true;
    try {
      const old = [...this.data[c].keys()];
      this.data[c].clear();
      if (old.length) this._persist(c, old.map(id => ['del', id]));
      if (rows.length) this.putMany(c, rows.filter(r => r && typeof r.id === 'string'));
    } finally { this.silent = false; }
  }
};

/* ---- 03-net.js ---- */
/* ============================================================
   core/net — hybrid local + internet mode
   🔵 offline  : navigator.onLine false, or a remote call failed
   🟡 local    : online but no AI available (or AI disabled)
   🟢 ai       : online + Claude AI available in this view
   ============================================================ */
const Net = {
  online: navigator.onLine !== false,
  failUntil: 0,
  listeners: new Set(),
  init() {
    window.addEventListener('online', () => { this.online = true; this.failUntil = 0; this.emit(); });
    window.addEventListener('offline', () => { this.online = false; this.emit(); });
  },
  markFailure() { this.failUntil = now() + 60e3; this.emit(); setTimeout(() => this.emit(), 61e3); },
  isOnline() { return this.online && now() > this.failUntil; },
  status() {
    if (!this.isOnline()) return 'offline';
    if (Caps.aiUsable()) return 'ai';
    return 'local';
  },
  emit() { this.listeners.forEach(fn => { try { fn(); } catch (e) { } }); },
  onChange(fn) { this.listeners.add(fn); }
};

/* Runtime capabilities offered by the Claude viewer (absent when index.html
   is opened directly from disk — the app then runs fully locally). */
const Caps = {
  sample: null, downloads: null, denied: false, checked: false, limits: null, via: null,
  init() {
    const c = window.claude;
    if (!c || typeof c.use !== 'function') {
      // Hors de Claude (Netlify…) : IA via la fonction serveur /api/ai si elle est configurée
      ServerAI.detect().then(ok => {
        if (ok) { this.sample = ServerAI.sample; this.limits = ServerAI.limitsValue(); this.via = 'server'; }
        this.checked = true; Net.emit();
      });
      return;
    }
    this.via = 'claude';
    c.use('sample').then(s => {
      this.sample = s || null; this.checked = true;
      if (s && s.limits) s.limits().then(l => { this.limits = l; }).catch(() => { });
      Net.emit();
    }).catch(() => { this.checked = true; Net.emit(); });
    c.use('downloads').then(d => { this.downloads = d || null; }).catch(() => { });
  },
  aiUsable() { return !!this.sample && !this.denied && prefs().useAI !== false; },
  canImages() { return this.aiUsable() && !!(this.limits && this.limits.images); }
};

const AI_ERRORS = {

/* Low-level remote calls. Every failure becomes {code}. */
const Remote = {
  ensure() {
    if (prefs().useAI === false) throw { code: 'disabled' };
    if (!Net.isOnline()) throw { code: 'offline' };
    if (!Caps.sample || Caps.denied) throw { code: 'unavailable' };
  },
  handleErr(e) {
    const code = (e && e.code) || 'upstream_error';
    if (['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'].includes(code)) { Caps.denied = true; Net.emit(); }
    if (code === 'upstream_error' && (Caps.via !== 'server' || (e && e.message === 'network'))) Net.markFailure();
    return { code, text: e && e.text };
  },
  async text(input, opts = {}) {
    this.ensure();
    try { const r = await Caps.sample(input, opts); return r.text; }
    catch (e) { throw this.handleErr(e); }
  },
  async json(input, opts = {}) {

/* ============================================================
   ServerAI — même interface que la capability « sample » de Claude,
   mais les appels passent par la fonction serveur /api/ai
   (la clé API reste sur le serveur).
   ============================================================ */
const ServerAI = {
  endpoint() {
    const m = document.querySelector('meta[name="revora-ai-endpoint"]');
    if (m && m.content) return m.content;
    return location.protocol.startsWith('http') ? '/api/ai' : null;
  },
  info: null,
  async detect() {
    const url = this.endpoint();
    if (!url) return false;
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 5000);
    try {
      const r = await fetch(url, { method: 'GET', signal: ctl.signal, headers: { accept: 'application/json' } });
      if (!r.ok) return false;
      const j = await r.json();
      this.info = j;
      return !!(j && j.ok);
    } catch (e) { return false; }
    finally { clearTimeout(timer); }
  },
  limitsValue() {
    const n = (this.info && this.info.maxImages) || 4;
    return { maxPromptBytes: 200000, images: this.info && this.info.images ? { maxCount: n, maxInputBytes: 20 * 1024 * 1024, mediaTypes: ['image/jpeg', 'image/png', 'image/webp', 'image/gif'] } : undefined };
  },
  /* Réduit une image (≤ 1600 px, JPEG) et la convertit en base64 */
  async prepImage(blob) {
    if (!blob || !/^image\//.test(blob.type || 'image/')) throw { code: 'image_rejected' };
    if (blob.size > 20 * 1024 * 1024) throw { code: 'image_rejected' };
    let bmp;
    try { bmp = await createImageBitmap(blob); } catch (e) { throw { code: 'image_rejected' }; }
    const scale = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(bmp.width * scale)); c.height = Math.max(1, Math.round(bmp.height * scale));
    const g = c.getContext('2d');
    g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
    g.drawImage(bmp, 0, 0, c.width, c.height);
    const url = c.toDataURL('image/jpeg', 0.82);
    return { media_type: 'image/jpeg', data: url.slice(url.indexOf(',') + 1) };
  },
  async call(input, opts = {}, asJson = false) {
    const url = this.endpoint();
    if (!url) throw { code: 'sampling_disabled', message: 'no endpoint' };
    if (opts.signal && opts.signal.aborted) throw { code: 'cancelled' };
    let images = [];
    if (opts.images) {
      const list = opts.images instanceof Blob ? [opts.images] : Array.from(opts.images);
      images = await Promise.all(list.slice(0, 4).map(b => this.prepImage(b)));
    }
    let res;
    try {
      res = await fetch(url, {
        method: 'POST', signal: opts.signal,
        headers: { 'content-type': 'application/json', accept: 'application/x-ndjson' },
        body: JSON.stringify({ input, json: asJson, modelTier: opts.modelTier || 'default', images })
      });
    } catch (e) {
      if (opts.signal && opts.signal.aborted) throw { code: 'cancelled' };
      throw { code: 'upstream_error', message: 'network' };
    }
    if (!res.ok) {
      let j = {};
      try { j = await res.json(); } catch (e) { /* ignore */ }
      const code = j.error || (res.status === 429 ? 'rate_limited' : res.status === 413 ? 'prompt_too_large' : res.status === 503 ? 'sampling_disabled' : 'upstream_error');
      throw { code, message: j.message || String(res.status) };
    }
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '', text = '', done = null, error = null;
    try {
      for (;;) {
        const r = await reader.read();
        if (r.done) break;
        buf += dec.decode(r.value, { stream: true });
        let i;
        while ((i = buf.indexOf('\n')) >= 0) {
          const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
          if (!line) continue;
          let ev; try { ev = JSON.parse(line); } catch (e) { continue; }
          if (typeof ev.t === 'string') {
            text += ev.t;
            if (opts.onText && text.trim()) { try { opts.onText({ text, delta: ev.t }); } catch (e) { console.error(e); } }
          } else if (ev.done) done = ev;
          else if (ev.error) error = ev.error;
        }
      }
    } catch (e) {
      if (opts.signal && opts.signal.aborted) throw { code: 'cancelled', text: text || undefined };
      throw { code: 'upstream_error', text: text || undefined };
    }
    if (error) throw { code: error, text: text || undefined };
    if (!done) throw { code: 'upstream_error', text: text || undefined };
    if (!text.trim()) throw { code: 'empty_completion' };
    return { text, truncated: !!done.truncated, modelTierApplied: opts.modelTier || 'default' };
  },
  parseJSON(text) {
    const t = String(text || '').trim();
    try { return JSON.parse(t); } catch (e) { /* suite */ }
    const f = t.match(/```(?:json)?\s*([\s\S]*?)```/i);
    if (f) { try { return JSON.parse(f[1]); } catch (e) { /* suite */ } }
    const a = t.search(/[\[{]/), b = Math.max(t.lastIndexOf('}'), t.lastIndexOf(']'));
    if (a >= 0 && b > a) { try { return JSON.parse(t.slice(a, b + 1)); } catch (e) { /* suite */ } }
    return undefined;
  }
};
ServerAI.sample = (input, opts) => ServerAI.call(input, opts || {}, false);
ServerAI.sample.json = async (input, opts) => {
  const r = await ServerAI.call(input, opts || {}, true);
  const v = ServerAI.parseJSON(r.text);
  if (v === undefined || r.truncated) throw { code: 'invalid_json', text: r.text };
  return v;
};
ServerAI.sample.limits = async () => ServerAI.limitsValue();

const STOP_EN = 'a an the and or but if then of to in on at by for with from as is are was were be been being it its this that these those they them their there here he she we you i his her our your not no yes can could would should will shall may might must do does did done have has had having so such than too very also into over under about after before between during through while which who whom whose what when where why how all any both each few more most other some own same only just'.split(' ');
const STOP = new Set([...STOP_FR, ...STOP_EN]);

const TextKit = {
  lang(text) {
    const words = norm(text.slice(0, 20000)).split(' ');
    let fr = 0, en = 0;
    const F = new Set(['le', 'la', 'les', 'des', 'est', 'une', 'dans', 'pour', 'qui', 'que', 'du', 'sont', 'avec', 'sur', 'au']);
    const E = new Set(['the', 'and', 'is', 'are', 'of', 'to', 'in', 'that', 'with', 'for', 'this', 'on', 'be', 'by']);
    for (const w of words) { if (F.has(w)) fr++; else if (E.has(w)) en++; }
    return en > fr * 1.2 ? 'en' : 'fr';
  },

  DOMAINS: {
    'Économie': 'marche prix offre demande inflation pib croissance monnaie economie economique consommateur producteur elasticite chomage banque taux budget investissement market price supply demand',
    'Gestion & finance': 'comptabilite bilan actif passif chiffre affaires marge tresorerie entreprise gestion management strategie marketing client finance capital amortissement resultat',
    'Mathématiques': 'theoreme equation fonction derivee integrale matrice vecteur demonstration lemme ensemble nombre limite probabilite suite polynome calcul formule geometrie',
    'Programmation': 'fonction variable code programme algorithme python javascript java classe objet boucle tableau return print compilateur syntaxe api function class loop array string',
    'Médecine': 'patient symptome diagnostic traitement cellule maladie clinique anatomie organe medicament pharmacologie pathologie infection sang coeur tissu',
    'Droit': 'article loi contrat juridique tribunal juge droit code civil penal obligation responsabilite jurisprudence constitution partie litige',
    'Histoire': 'siecle guerre roi empire revolution republique traite bataille dynastie colonisation independance moyen age antiquite regne',
    'Géographie': 'territoire population climat region relief urbanisation continent fleuve frontiere espace geographique carte',
    'Sciences': 'energie atome molecule reaction force masse vitesse cellule organisme physique chimie biologie experience electron gene',
    'Langues': 'grammaire conjugaison verbe vocabulaire phrase traduction prononciation temps present passe adjectif nom pronom tense vocabulary'
  },
  domain(text) {
    const t = ' ' + norm(text.slice(0, 60000)) + ' ';
    let best = 'Général', score = 0;
    for (const [name, list] of Object.entries(this.DOMAINS)) {
      let s = 0;
      for (const w of list.split(' ')) { let i = -1, n = 0; while ((i = t.indexOf(' ' + w, i + 1)) !== -1 && n < 30) n++; s += n; }
      if (s > score) { score = s; best = name; }
    }
    return score >= 6 ? best : 'Général';
  },

  sentences(text) {
    return String(text || '')
      .replace(/\s+/g, ' ')
      .replace(/([.!?…])\s+(?=[A-ZÀ-ÖØ-Þ0-9«"(“])/g, '$1\n')
      .split('\n').map(s => s.trim()).filter(s => s.length >= 25 && s.length <= 600);
  },
  tokens(s) { return norm(s).split(' ').filter(w => w.length > 2 && !STOP.has(w)); },
  /* content words with their original spelling (for display) */
  surfaceWords(s) {
    const out = new Map();
    for (const w of String(s || '').split(/[^A-Za-zÀ-ÿ0-9-]+/)) {
      const n = norm(w);
      if (n.length > 2 && !STOP.has(n) && !this.VERBISH.has(n) && !/^\d+$/.test(n) && !out.has(this.stem(n))) out.set(this.stem(n), w.toLowerCase());
    }
    return out;
  },
  stem(w) { return w.length > 6 ? w.slice(0, 6) : w; },

  /* Heading detection. Returns 1 (chapter), 2 (sub-heading) or 0. */
  headingLevel(line) {
    const l = line.trim();
    if (l.length < 3 || l.length > 90) return 0;
    const words = l.split(/\s+/).length;
    if (/^#{1}\s+\S/.test(l)) return 1;
    if (/^#{2,4}\s+\S/.test(l)) return 2;
    if (/^(chapitre|chapter|partie|part|leçon|lecon|lesson|module|unit[ée]?|unit|th[èe]me|titre|section)\s+([\dIVXLC]+|[a-z]+)\b/i.test(l) && words <= 14) return 1;
    if (/^([IVX]{1,5})\s*[.)–—-]\s+\S/.test(l) && words <= 12 && !/[;,]$/.test(l)) return 1;
    if (/^\d{1,2}\s*[.)–—-]\s+[A-ZÀ-Þa-zà-ÿ]/.test(l) && words <= 10 && !/[.;,:]$/.test(l)) return 1;
    if (/^\d{1,2}\.\d{1,2}(\.\d{1,2})?\.?\s+\S/.test(l) && words <= 12) return 2;
    if (/^[A-D]\s*[.)]\s+\S/.test(l) && words <= 10 && !/[.;,]$/.test(l)) return 2;
    const letters = l.replace(/[^A-Za-zÀ-ÿ]/g, '');
    if (letters.length >= 5 && letters === letters.toUpperCase() && words <= 9 && !/[.;,]$/.test(l)) return 1;
    return 0;
  },
  cleanHeading(l) { return l.trim().replace(/^#{1,4}\s+/, '').replace(/\s+/g, ' ').replace(/[:.]$/, ''); },

  /* pages: [{page, text}] → sections [{title, text, pageMap, pageFrom, pageTo}] */
  buildSections(pages, docTitle) {
    const raw = [];
    let cur = null;
    const start = (title, page) => { cur = { title, parts: [], pageMap: [], len: 0, pageFrom: page, pageTo: page }; raw.push(cur); };
    for (const pg of pages) {
      const lines = String(pg.text || '').split(/\r?\n/);
      for (let line of lines) {
        line = line.replace(/\s+$/, '');
        if (!line.trim()) { if (cur) { cur.parts.push(''); cur.len += 1; } continue; }
        const lvl = this.headingLevel(line);
        if (lvl === 1) { start(this.cleanHeading(line), pg.page); continue; }
        if (!cur) start('Introduction', pg.page);
        if (cur.pageMap.length === 0 || cur.pageMap[cur.pageMap.length - 1].page !== pg.page) cur.pageMap.push({ page: pg.page, at: cur.len });
        if (pg.page != null) cur.pageTo = pg.page;
        const txt = lvl === 2 ? '## ' + this.cleanHeading(line) : line.trim();
        cur.parts.push(txt); cur.len += txt.length + 1;
      }
    }
    let secs = raw.map(s => ({ title: s.title, text: s.parts.join('\n').replace(/\n{3,}/g, '\n\n').trim(), pageMap: s.pageMap, pageFrom: s.pageFrom, pageTo: s.pageTo }))
      .filter(s => s.text.length > 0);
    // merge tiny sections into the previous one (noise from headings)
    const merged = [];
    for (const s of secs) {
      const prev = merged[merged.length - 1];
      if (prev && (s.text.length < 250 || merged.length >= 60)) {
        const base = prev.text.length + 1;
        prev.text += '\n## ' + s.title + '\n' + s.text;
        for (const m of s.pageMap) prev.pageMap.push({ page: m.page, at: base + s.title.length + 4 + m.at });
        if (s.pageTo != null) prev.pageTo = s.pageTo;
      } else merged.push(s);
    }
    secs = merged;
    // no real structure and long text → split into parts
    if (secs.length <= 1) {
      const whole = secs[0] || { text: pages.map(p => p.text).join('\n'), pageMap: [], pageFrom: null, pageTo: null };
      if (whole.text.length > 7000) secs = this.chunkIntoParts(whole);
      else if (secs.length === 1 && secs[0].title === 'Introduction') secs[0].title = docTitle || 'Contenu';
    }
    // split oversized sections (keeps analysis within model limits)
    const out = [];
    for (const s of secs) {
      if (s.text.length > 24000) this.chunkIntoParts(s, s.title).forEach(p => out.push(p));
      else out.push(s);
    }
    return out;
  },
  chunkIntoParts(sec, baseTitle) {
    const paras = sec.text.split(/\n/);
    const parts = [];
    let buf = [], len = 0, startAt = 0, offset = 0;
    const flush = () => {
      if (!buf.length) return;
      const text = buf.join('\n').trim();
      const firstSentence = (this.sentences(text)[0] || text).split(/\s+/).slice(0, 7).join(' ');
      const pageMap = [];
      for (const m of sec.pageMap) if (m.at >= startAt && m.at < startAt + len) pageMap.push({ page: m.page, at: m.at - startAt });
      const pBefore = sec.pageMap.filter(m => m.at <= startAt).pop();
      if (pBefore && (!pageMap.length || pageMap[0].at > 0)) pageMap.unshift({ page: pBefore.page, at: 0 });
      const n = parts.length + 1;
      parts.push({
        title: baseTitle ? `${baseTitle} (partie ${n})` : `Partie ${n} — ${trunc(firstSentence, 48)}`,
        text, pageMap, pageFrom: pageMap[0] ? pageMap[0].page : null, pageTo: pageMap.length ? pageMap[pageMap.length - 1].page : null
      });
      buf = []; startAt = offset; len = 0;
    };
    for (const p of paras) {
      buf.push(p); len += p.length + 1; offset += p.length + 1;
      if (len > 5000) flush();
    }
    flush();
    return parts;
  },
  pageAt(section, offset) {
    if (!section || !section.pageMap || !section.pageMap.length) return null;
    let page = section.pageMap[0].page;
    for (const m of section.pageMap) { if (m.at <= offset) page = m.page; else break; }
    return page;
  },

  /* ---- Definitions ---- */
  BAD_TERM: /^(il|elle|ils|elles|ce|cet|cette|ces|cela|ceci|c|qui|que|on|nous|vous|je|tu|it|this|that|these|those|they|there|he|she|we|which|son|sa|ses|leur|leurs|lui|celui|celle|ceux|tout|tous|chaque|lorsqu|quand|si|mais|ou|donc|or|car|ainsi|alors|enfin|en effet|par exemple|l objectif|le but|the aim|the goal|le probleme|le resultat)\b/,
  DEF_FR: /^(?:(?:les|le|la|un|une|des)\s+|l['’]\s*)?([^,;:.()]{2,60}?)\s+(est|sont|désigne|désignent|correspond(?:ent)? à|se définit comme|se définissent comme|signifie|signifient|représente|représentent|consiste à|consistent à|renvoie à|mesure|mesurent|caractérise|qualifie)\s+(.{12,320})$/i,
  DEF_EN: /^(?:(?:the|a|an)\s+)?([^,;:.()]{2,60}?)\s+(is defined as|is|are|refers to|refer to|means|mean|represents|represent|describes|measures|consists of)\s+(.{12,320})$/i,
  DEF_CALL: /^(?:on (?:appelle|nomme|désigne par)|we call|is called)\s+([^,]{2,50}?),?\s+(.{12,320})$/i,
  DEF_COLON: /^([^:]{2,55})\s*[:–—]\s+(.{15,320})$/,

  validTerm(t) {
    const n = norm(t);
    if (!n || n.length < 2 || n.length > 60) return false;
    const words = n.split(' ');
    if (words.length > 6) return false;
    if (this.BAD_TERM.test(n)) return false;
    if (!words.some(w => w.length > 2 && !STOP.has(w))) return false;
    if (/^\d+$/.test(n)) return false;
    return true;
  },
  cleanTerm(t) {
    return cap(t.replace(/^[«"“'‘\s]+|[»"”'’\s]+$/g, '').replace(/^(?:(?:les|le|la|un|une|des|the|an|a)\s+|l['’]\s*)/i, '').replace(/\s+/g, ' ').trim());
  },
  definitions(text) {
    const out = [];
    const seen = new Set();
    const push = (term, def, sentence) => {
      term = this.cleanTerm(term);
      if (!this.validTerm(term)) return;
      const k = norm(term);
      if (seen.has(k)) return;
      def = def.trim().replace(/\s+/g, ' ');
      if (def.length < 12) return;
      seen.add(k);
      out.push({ term, body: cap(def.replace(/[.;]\s*$/, '')), sentence });
    };
    for (const line of String(text).split('\n')) {
      const l = line.trim().replace(/^[-•*]\s*/, '');
      const m = l.match(this.DEF_COLON);
      if (m && m[1].split(/\s+/).length <= 6 && !/^(##|http)/.test(l) && !/\d{1,2}:\d{2}/.test(l)) push(m[1], m[2], cap(m[1].trim()) + ' : ' + m[2].trim());
    }
    for (const s of this.sentences(text)) {
      let m = s.match(this.DEF_CALL);
      if (m) { push(m[1], m[2], s); continue; }
      m = s.match(this.DEF_FR) || s.match(this.DEF_EN);
      if (m && m[1].split(/\s+/).length <= 6) push(m[1], m[3], s);
    }
    return out;
  },

  /* ---- Key terms (n-grams scored by frequency) ---- */
  VERBISH: new Set('augmente augmentent diminue diminuent permet permettent devient deviennent varie varient reste restent depend dependent provoque provoquent atteint pousse poussent change changent reagit reagissent apparait apparaissent publie publient decrit decrivent calcule calculent mesure mesurent consiste consistent correspond correspondent designe designent represente representent signifie signifient existe existent sert servent souhaitent souhaite donne donnee donnes donnees semble semblent parait implique impliquent entraine entrainent favorise favorisent freine freinent conduit conduisent'.split(' ')),
  keyTerms(text, max = 30) {
    const counts = new Map(), surface = new Map();
    const words = String(text).replace(/\n/g, ' . ').split(/[^A-Za-zÀ-ÿ0-9'’-]+/);
    const flag = w => { const n = norm(w); return n.length > 2 && !STOP.has(n) && !/^\d+$/.test(n) && !this.VERBISH.has(n); };
    for (let i = 0; i < words.length; i++) {
      for (let n = 1; n <= 3; n++) {
        const gram = words.slice(i, i + n);
        if (gram.length < n || !gram.every(Boolean)) break;
        if (!flag(gram[0]) || !flag(gram[n - 1])) continue;
        if (n > 1 && /(ée|ées|ant|ants)$/i.test(gram[0])) continue;
        if (n === 3 && !flag(gram[1]) && !['de', 'du', 'des', 'of', 'd'].includes(norm(gram[1]))) continue;
        const key = norm(gram.join(' '));
        if (n === 1 && key.length < 5) continue;
        counts.set(key, (counts.get(key) || 0) + 1);
        if (!surface.has(key)) surface.set(key, gram.join(' '));
      }
    }
    const scored = [];
    for (const [k, c] of counts) {
      const n = k.split(' ').length;
      if (c < (n === 1 ? 3 : 2)) continue;
      scored.push({ key: k, term: surface.get(k), count: c, score: c * (n === 1 ? 1 : n === 2 ? 2.2 : 2.6) });
    }
    scored.sort((a, b) => b.score - a.score);
    const out = [];
    for (const s of scored) {
      if (out.some(o => o.key.includes(s.key) && o.count >= s.count * 0.7)) continue;
      out.push(s);
      if (out.length >= max) break;
    }
    return out;
  },

  dates(text) {
    const out = [];
    for (const s of this.sentences(text)) {
      const m = s.match(/\b(1[0-9]{3}|20[0-4][0-9])\b/);
      if (m && s.split(/\s+/).length >= 7 && s.length < 260) out.push({ year: +m[1], sentence: s });
    }
    return out;
  },
  formulas(text) {
    const out = [];
    for (const line of String(text).split('\n')) {
      const l = line.trim();
      if (l.length > 4 && l.length < 140 && /[=≈≤≥]/.test(l) && /[A-Za-zα-ω]/.test(l) && !/^https?:/.test(l)) out.push(l);
    }
    return out.slice(0, 20);
  },

  /* Count occurrences of a term (normalized) in a normalized text */
  occurrences(nText, term) {
    const t = norm(term); if (!t) return 0;
    let i = -1, n = 0;
    while ((i = nText.indexOf(t, i + 1)) !== -1 && n < 500) n++;
    return n;
  },

  /* Locate a quote inside a section; returns {page, excerpt} or null (never invents) */
  locate(quote, section) {
    if (!quote || !section) return null;
    const nq = norm(quote);
    if (nq.length < 10) return null;
    const ns = section._norm || (section._norm = norm(section.text));
    let idx = ns.indexOf(nq);
    if (idx < 0 && nq.length > 50) {
      const a = nq.slice(0, 45), b = nq.slice(-45);
      idx = ns.indexOf(a);
      if (idx < 0) { const j = ns.indexOf(b); if (j >= 0) idx = Math.max(0, j - (nq.length - 45)); }
    }
    if (idx < 0) return null;
    const offset = Math.round(idx / Math.max(1, ns.length) * section.text.length);
    return { page: this.pageAt(section, offset), offset };
  }
};

/* ---------- Retrieval index (BM25-lite over ~700-char chunks) ---------- */
const SearchIndex = {
  cache: new Map(),
  invalidate(docId) { if (docId) this.cache.delete(docId); else this.cache.clear(); },
  build(docId) {
    if (this.cache.has(docId)) return this.cache.get(docId);
    const secs = Store.where('sections', s => s.docId === docId).sort((a, b) => a.order - b.order);
    const chunks = [];
    for (const s of secs) {
      const paras = s.text.split(/\n+/);
      let buf = '', at = 0, off = 0;
      const flush = () => { if (buf.trim()) chunks.push({ docId, sectionId: s.id, text: buf.trim(), page: TextKit.pageAt(s, at), title: s.title }); buf = ''; at = off; };
      for (const p of paras) { if (buf.length + p.length > 750 && buf) flush(); buf += (buf ? '\n' : '') + p; off += p.length + 1; }
      flush();
    }
    const df = new Map();
    for (const c of chunks) {
      c.tf = new Map();
      for (const t of TextKit.tokens(c.text)) { const k = TextKit.stem(t); c.tf.set(k, (c.tf.get(k) || 0) + 1); }
      c.len = [...c.tf.values()].reduce((a, b) => a + b, 0) || 1;
      for (const k of c.tf.keys()) df.set(k, (df.get(k) || 0) + 1);
    }
    const avg = chunks.reduce((a, c) => a + c.len, 0) / Math.max(1, chunks.length);
    const idx = { chunks, df, avg, N: chunks.length };
    this.cache.set(docId, idx);
    return idx;
  },
  search(docIds, query, k = 6) {
    const q = [...new Set(TextKit.tokens(query).map(t => TextKit.stem(t)))];
    if (!q.length) return [];
    const phrase = norm(query);
    const res = [];
    for (const id of docIds) {
      const idx = this.build(id);
      for (const c of idx.chunks) {
        let s = 0;
        for (const t of q) {
          const f = c.tf.get(t); if (!f) continue;
          const idf = Math.log(1 + (idx.N - idx.df.get(t) + 0.5) / (idx.df.get(t) + 0.5));
          s += idf * (f * 2.2) / (f + 1.2 * (0.25 + 0.75 * c.len / idx.avg));
        }
        if (s > 0 && phrase.length > 6 && norm(c.text).includes(phrase)) s *= 1.6;
        if (s > 0) res.push({ ...c, score: s });
      }
    }
    return res.sort((a, b) => b.score - a.score).slice(0, k);
  }
};

function highlight(text, query) {
  let h = esc(text);
  const terms = [...new Set(TextKit.tokens(query))].filter(t => t.length > 3).slice(0, 8);
  for (const t of terms) {
    const A = { a: '[aàâä]', e: '[eéèêë]', i: '[iîï]', o: '[oôö]', u: '[uùûü]', c: '[cç]' };
    const re = new RegExp('(' + t.split('').map(ch => A[ch] || ch.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('') + '[\\wÀ-ÿ]*)', 'gi');
    h = h.replace(re, '<mark>$1</mark>');
  }
  return h;
}

/* ============================================================
   ai/local — offline generation engine (no network, no model)
   Everything produced here is extracted from the document text,
   so it is always labelled "source" with its passage and page.
   ============================================================ */
const L10N_Q = {

  },
  en: {
