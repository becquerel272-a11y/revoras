    rev: b => `Which term matches this definition: “${b}”?`,
    cloze: s => `Complete the sentence from the course: “${s}”`,
    tf: s => `True or false? “${s}”`,
    free: t => `Explain in your own words what “${t}” is.`,
    year: s => `Which year? “${s}”`,
    order: 'Put these events in chronological order (oldest first).',
    formula: l => `Complete the formula: ${l} = ?`,
    hintChap: t => `Think of the chapter “${t}”.`,
    hintLetters: (w, n) => `The answer starts with “${w}” (${n}).`,
    hintWords: n => n > 1 ? `The answer has ${n} words.` : 'The answer is a single word.',
    hintFifty: 'Two wrong answers have been removed.',
    hintTf: 'Spot the key term of the sentence: is it really the one being described?',
    hintFree: k => `Think about these keywords: ${k}.`,
    trueExp: s => `True. The course says: “${s}”`,
    falseExp: (s, a, b) => `False. This definition belongs to “${a}”, not “${b}”. The course says: “${s}”`,
    defExp: (t, b) => `“${t}”: ${b}.`,
    letters: n => n + ' letters', yearExp: (y, s) => `Answer: ${y}. The course says: “${s}”`
  }
};

function termRegex(term) {
  const A = { a: '[aàâäAÀÂÄ]', e: '[eéèêëEÉÈÊË]', i: '[iîïIÎÏ]', o: '[oôöOÔÖ]', u: '[uùûüUÙÛÜ]', c: '[cçCÇ]' };
  const body = term.trim().split('').map(ch => {
    const l = ch.toLowerCase();
    if (A[l]) return A[l];
    if (/\s/.test(ch)) return '\\s+';
    if (/[a-z]/i.test(ch)) return '[' + l + l.toUpperCase() + ']';
    return ch.replace(/[.*+?^${}()|[\]\\\-]/g, '\\$&');
  }).join('');
  return new RegExp('(^|[^A-Za-zÀ-ÿ])(' + body + ')(?=$|[^A-Za-zÀ-ÿ])');
}

const LocalAI = {
  name: 'local',

  /* ---------- Concepts ---------- */
  extractConcepts(doc, sections) {
    const all = sections.map(s => s.text).join('\n');
    const nAll = norm(all);
    const concepts = [];
    const byKey = new Map();
    for (const s of sections) {
      let n = 0;
      for (const d of TextKit.definitions(s.text)) {
        const k = norm(d.term);
        if (byKey.has(k)) continue;
        const loc = TextKit.locate(d.sentence, s);
        const c = {
          id: uid('c'), docId: doc.id, sectionId: s.id, name: d.term, body: d.body, definition: d.sentence,
          excerpt: d.sentence, page: loc ? loc.page : null, kind: 'definition', origin: 'source', createdAt: now()
        };
        byKey.set(k, c); concepts.push(c);
        if (++n >= 14) break;
      }
    }
    const terms = TextKit.keyTerms(all, 40);
    let kw = 0;
    for (const t of terms) {
      if (kw >= 20 || concepts.length >= 90) break;
      if (byKey.has(t.key) || [...byKey.keys()].some(k => k.includes(t.key) || t.key.includes(k))) continue;
      let found = null, best = -1;
      for (const s of sections) {
        for (const x of TextKit.sentences(s.text)) {
          if (x.length <= 50 || x.length >= 280) continue;
          const nx = norm(x), at = nx.indexOf(t.key);
          if (at < 0) continue;
          const sc = (at < 30 ? 2 : 0) + (/\b(est|sont|designe|designent|correspond|represente|permet|mesure|is|are|means)\b/.test(nx) ? 1.5 : 0)
            + (x.length >= 60 && x.length <= 220 ? 1 : 0) - (/^(a l inverse|cependant|mais|en revanche|toutefois|pourtant|however|but)\b/.test(nx) ? 2 : 0);
          if (sc > best) { best = sc; found = { s, sent: x }; }
        }
      }
      if (!found) continue;
      const loc = TextKit.locate(found.sent, found.s);
      const c = {
        id: uid('c'), docId: doc.id, sectionId: found.s.id, name: TextKit.cleanTerm(t.term), body: '', definition: found.sent,
        excerpt: found.sent, page: loc ? loc.page : null, kind: 'keyword', origin: 'source', createdAt: now()
      };
      byKey.set(t.key, c); concepts.push(c); kw++;
    }
    // importance (computed from the text — explained to the user)
    const occ = concepts.map(c => TextKit.occurrences(nAll, c.name));
    const maxOcc = Math.max(1, ...occ);
    concepts.forEach((c, i) => {
      const secCount = sections.filter(s => (s._norm || (s._norm = norm(s.text))).includes(norm(c.name))).length;
      c.occurrences = occ[i];
      c.sectionCount = secCount;
      c.importance = clamp((0.2 + 0.5 * Math.log(1 + occ[i]) / Math.log(1 + maxOcc) + (c.kind === 'definition' ? 0.15 : 0) + (secCount > 1 ? 0.12 : 0)) * (c.kind === 'keyword' ? 0.8 : 1), 0, 1);
      c.why = secCount > 1 ? `Revient dans ${secCount} chapitres du cours` : occ[i] >= 4 ? `Cité ${occ[i]} fois dans le document` : c.kind === 'definition' ? 'Définition donnée dans le cours' : 'Terme récurrent du cours';
      c.whySource = 'computed';
    });
    return concepts;
  },

  /* ---------- Questions ---------- */
  generateQuestions(doc, sections, concepts, opts = {}) {
    const lang = opts.lang || doc.lang || 'fr';
    const T = L10N_Q[lang] || L10N_Q.fr;
    const secById = new Map(sections.map(s => [s.id, s]));
    const defs = concepts.filter(c => c.kind === 'definition' && c.body && c.body.length > 12);
    const out = [];
    const base = (c, extra) => ({
      id: uid('q'), docId: doc.id, sectionId: c ? c.sectionId : extra.sectionId, conceptId: c ? c.id : null,
      origin: 'source', generator: 'local', createdAt: now(), seen: 0, ...extra
    });
    const src = (s, sentence) => { const loc = TextKit.locate(sentence, s); return { excerpt: sentence, page: loc ? loc.page : null }; };
    const opt = s => trunc(s, 150);

    for (const c of concepts) {
      const s = secById.get(c.sectionId);
      if (!s) continue;
      const hint1 = T.hintChap(s.title);
      // 1) definition MCQ
      if (c.kind === 'definition' && defs.length >= 4) {
        const others = shuffle(defs.filter(d => d.id !== c.id && norm(d.body) !== norm(c.body)))
          .sort((a, b) => (b.sectionId === c.sectionId) - (a.sectionId === c.sectionId)).slice(0, 3);
        if (others.length === 3) {
          const options = shuffle([{ t: opt(c.body), ok: true, cid: c.id }, ...others.map(o => ({ t: opt(o.body), ok: false, cid: o.id }))]);
          out.push(base(c, {
            type: 'mcq', prompt: T.def(c.name), options: options.map(o => o.t), optionConcepts: options.map(o => o.cid),
            answer: options.findIndex(o => o.ok), explanation: T.defExp(c.name, c.body), source: src(s, c.excerpt),
            skill: 'memorisation', difficulty: 1, hints: [hint1, T.hintFifty]
          }));
        }
        // 2) reverse MCQ
        const otherTerms = shuffle(concepts.filter(d => d.id !== c.id && norm(d.name) !== norm(c.name))).slice(0, 3);
        if (otherTerms.length === 3) {
          const masked = c.body.replace(termRegex(c.name), '$1…');
          const options = shuffle([{ t: c.name, cid: c.id }, ...otherTerms.map(o => ({ t: o.name, cid: o.id }))]);
          out.push(base(c, {
            type: 'mcq', prompt: T.rev(trunc(masked, 220)), options: options.map(o => o.t), optionConcepts: options.map(o => o.cid),
            answer: options.findIndex(o => o.cid === c.id), explanation: T.defExp(c.name, c.body), source: src(s, c.excerpt),
            skill: 'memorisation', difficulty: 2, hints: [hint1, T.hintLetters(c.name.slice(0, 2), T.letters(c.name.replace(/\s/g, '').length)), T.hintFifty]
          }));
        }
      }
      // 3) cloze (active recall)
      const sents = TextKit.sentences(s.text).filter(x => x.length >= 50 && x.length <= 300 && termRegex(c.name).test(x));
      const clozeSent = sents.find(x => x !== c.excerpt) || sents[0];
      if (clozeSent) {
        const masked = clozeSent.replace(termRegex(c.name), '$1_____');
        if (masked !== clozeSent) {
          const words = c.name.split(/\s+/).length;
          out.push(base(c, {
            type: 'short', prompt: T.cloze(masked), answer: c.name,
            accept: [c.name, TextKit.cleanTerm(c.name)], explanation: T.trueExp(clozeSent).replace(/^(Vrai|True)\.\s*/, ''),
            source: src(s, clozeSent), skill: 'memorisation', difficulty: c.kind === 'definition' ? 2 : 3,
            hints: [hint1, T.hintWords(words), T.hintLetters(c.name.slice(0, Math.min(3, Math.ceil(c.name.length / 3))), T.letters(c.name.replace(/\s/g, '').length))]
          }));
        }
      }
      // 4) true / false — "Terme : définition" avoids broken grammar when terms are swapped
      const isDef = c.kind === 'definition' && c.body && c.body.length < 240;
      const lower = b => /^[A-ZÀ-Þ]{2}/.test(b) ? b : b.charAt(0).toLowerCase() + b.slice(1);
      const stmt = isDef ? `${c.name} : ${lower(c.body)}` : (c.excerpt && c.excerpt.length < 260 ? c.excerpt : (sents[0] || null));
      if (stmt && (isDef || termRegex(c.name).test(stmt))) {
        const makeFalse = isDef && Math.random() < 0.5;
        const swap = shuffle(defs.filter(d => d.id !== c.id && d.name.length > 3 && !norm(c.body).includes(norm(d.name)) && !norm(d.name).includes(norm(c.name)) && !norm(c.name).includes(norm(d.name))))[0];
        if (makeFalse && swap) {
          const falseStmt = `${swap.name} : ${lower(c.body)}`;
          if (falseStmt !== stmt) out.push(base(c, {
            type: 'tf', prompt: T.tf(falseStmt), answer: false, explanation: T.falseExp(c.excerpt || stmt, c.name, swap.name),
            source: src(s, c.excerpt || stmt), skill: 'comprehension', difficulty: 2, hints: [hint1, T.hintTf], distractorConcept: swap.id
          }));
        } else {
          out.push(base(c, {
            type: 'tf', prompt: T.tf(stmt), answer: true, explanation: T.trueExp(c.excerpt || stmt),
            source: src(s, c.excerpt || stmt), skill: 'comprehension', difficulty: 1, hints: [hint1, T.hintTf]
          }));
        }
      }
      // 5) free explanation for important definitions
      if (c.kind === 'definition' && c.importance >= 0.45) {
        const nameStems = new Set(TextKit.tokens(c.name).map(w => TextKit.stem(w)));
        const kws = [...TextKit.surfaceWords(c.body).entries()].filter(([k]) => !nameStems.has(k)).map(([, w]) => w).sort((a, b) => b.length - a.length).slice(0, 6);
        if (kws.length >= 2) out.push(base(c, {
          type: 'free', prompt: T.free(c.name), answer: c.body, keywords: kws, explanation: T.defExp(c.name, c.body),
          source: src(s, c.excerpt), skill: 'comprehension', difficulty: 3, hints: [hint1, T.hintFree(kws.slice(0, 3).join(', '))]
        }));
      }
    }

    // dates → year MCQ + chronology
    const dates = [];
    for (const s of sections) for (const d of TextKit.dates(s.text)) dates.push({ ...d, s });
    const uniqYears = [...new Set(dates.map(d => d.year))];
    for (const d of dates.slice(0, 12)) {
      const pool = shuffle(uniqYears.filter(y => y !== d.year)).slice(0, 3);
      while (pool.length < 3) { const y = d.year + pick([-1, 1]) * (3 + Math.floor(Math.random() * 40)); if (y !== d.year && !pool.includes(y) && y < 2100) pool.push(y); }
      const opts = shuffle([d.year, ...pool]);
      out.push(base(null, {
        sectionId: d.s.id, type: 'mcq', prompt: T.year(d.sentence.replace(String(d.year), '_____')), options: opts.map(String),
        answer: opts.indexOf(d.year), explanation: T.yearExp(d.year, d.sentence), source: src(d.s, d.sentence),
        skill: 'memorisation', difficulty: 2, hints: [T.hintChap(d.s.title), T.hintFifty]
      }));
    }
    if (uniqYears.length >= 4) {
      const chosen = [];
      for (const d of shuffle(dates)) { if (!chosen.some(x => x.year === d.year)) chosen.push(d); if (chosen.length === 4) break; }
      chosen.sort((a, b) => a.year - b.year);
      out.push(base(null, {
        sectionId: chosen[0].s.id, type: 'order', prompt: T.order,
        items: chosen.map(d => trunc(d.sentence.replace(new RegExp('\\b(en|in)?\\s*' + d.year + '\\b,?\\s*', 'i'), ' ').replace(/\s+/g, ' ').trim(), 120)),
        explanation: chosen.map(d => `${d.year} — ${trunc(d.sentence, 90)}`).join('\n'),
        source: src(chosen[0].s, chosen[0].sentence), skill: 'raisonnement', difficulty: 3, hints: [T.hintChap(chosen[0].s.title)]
      }));
    }
    return this.validate(out, opts.existing || []);
  },

  /* Reject malformed / duplicate questions before they reach the user */
  validate(qs, existing) {
    const seen = new Set(existing.map(q => norm(q.prompt)));
    const ok = [];
    for (const q of qs) {
      const k = norm(q.prompt);
      if (!k || k.length < 8 || seen.has(k)) continue;
      if (q.type === 'mcq') {
        if (!Array.isArray(q.options) || q.options.length < 3) continue;
        const u = new Set(q.options.map(norm));
        if (u.size !== q.options.length || u.has('')) continue;
        if (!(q.answer >= 0 && q.answer < q.options.length)) continue;
      }
      if (q.type === 'tf' && typeof q.answer !== 'boolean') continue;
      if (q.type === 'short' && !String(q.answer || '').trim()) continue;
      if (q.type === 'order' && (!Array.isArray(q.items) || q.items.length < 3 || new Set(q.items.map(norm)).size !== q.items.length)) continue;
      seen.add(k); ok.push(q);
    }
    return ok;
  },

  /* ---------- Flashcards ---------- */
  generateFlashcards(doc, sections, concepts, lang = 'fr') {
    const secById = new Map(sections.map(s => [s.id, s]));
    const out = [];
    const mk = (c, sectionId, front, back, excerpt) => {
      const s = secById.get(sectionId);
      const loc = s ? TextKit.locate(excerpt, s) : null;
      out.push({ id: uid('f'), docId: doc.id, sectionId, conceptId: c ? c.id : null, front, back, source: { excerpt, page: loc ? loc.page : null }, origin: 'source', generator: 'local', createdAt: now() });
    };
    for (const c of concepts) {
      if (c.kind === 'definition' && c.body) mk(c, c.sectionId, lang === 'en' ? `What is “${c.name}”?` : `Que signifie « ${c.name} » ?`, c.body, c.excerpt);
      else if (c.excerpt && termRegex(c.name).test(c.excerpt)) mk(c, c.sectionId, c.excerpt.replace(termRegex(c.name), '$1_____'), c.name, c.excerpt);
    }
    for (const s of sections) {
      for (const f of TextKit.formulas(s.text).slice(0, 4)) {
        const i = f.search(/[=≈]/);
        const left = f.slice(0, i).trim(), right = f.slice(i + 1).trim();
        if (left.length >= 1 && right.length >= 1 && left.length < 60) mk(null, s.id, (lang === 'en' ? 'Complete: ' : 'Complète : ') + left + ' = ?', right, f);
      }
      for (const d of TextKit.dates(s.text).slice(0, 3)) mk(null, s.id, d.sentence.replace(String(d.year), '_____'), String(d.year), d.sentence);
    }
    const seen = new Set();
    return out.filter(f => { const k = norm(f.front); if (seen.has(k)) return false; seen.add(k); return true; });
  },

  /* ---------- Answer evaluation ---------- */
  evaluate(q, answer) {
    if (q.type === 'mcq') return { score: answer === q.answer ? 1 : 0 };
    if (q.type === 'tf') return { score: answer === q.answer ? 1 : 0 };
    if (q.type === 'order') {
      const ok = Array.isArray(answer) && answer.every((it, i) => it === q.items[i]);
      return { score: ok ? 1 : 0 };
    }
    const a = norm(answer);
    if (!a) return { score: 0, feedback: 'Aucune réponse.' };
    if (q.type === 'short') {
      const acc = [q.answer, ...(q.accept || [])].map(norm).filter(Boolean);
      for (const x of acc) {
        if (a === x) return { score: 1 };
        const tol = Math.max(1, Math.floor(x.length * 0.18));
        if (levenshtein(a, x) <= tol) return { score: 1, feedback: 'Orthographe approximative acceptée.' };
      }
      for (const x of acc) {
        if (a.length >= 4 && (x.includes(a) || a.includes(x)) && Math.min(a.length, x.length) / Math.max(a.length, x.length) >= 0.55)
          return { score: 0.5, feedback: 'Réponse proche mais incomplète.' };
      }
      return { score: 0 };
    }
    // free answer: concept coverage
    const expected = (q.keywords && q.keywords.length ? q.keywords : TextKit.tokens(q.answer).slice(0, 8)).map(w => TextKit.stem(norm(w)));
    const got = new Set(TextKit.tokens(answer).map(w => TextKit.stem(w)));
    const matched = [], missing = [];
    (q.keywords || expected).forEach((w, i) => (got.has(expected[i]) ? matched : missing).push(w));
    const cov = matched.length / Math.max(1, expected.length);
    const words = answer.trim().split(/\s+/).length;
    let score = cov >= 0.6 ? 1 : cov >= 0.3 ? 0.5 : 0;
    if (words < 4 && score > 0.5) score = 0.5;
    return {
      score, matched, missing, approx: true,
      feedback: score === 1 ? 'Les idées principales sont présentes.' : score === 0.5 ? 'Idée en partie correcte, mais il manque des éléments.' : "Les éléments essentiels du cours n'apparaissent pas."
    };
  },

  checkUnderstanding(concept, text) {
    const s = Store.get('sections', concept.sectionId);
    const pool = [concept.body || '', concept.definition || ''];
    if (s) pool.push(...TextKit.sentences(s.text).filter(x => termRegex(concept.name).test(x)).slice(0, 4));
    const freq = new Map();
    const nameStems = new Set(TextKit.tokens(concept.name).map(w => TextKit.stem(w)));
    for (const p of pool) for (const [k, w] of TextKit.surfaceWords(p)) { if (!nameStems.has(k)) freq.set(k, { w, n: ((freq.get(k) || {}).n || 0) + 1 }); }
    const expected = [...freq.entries()].sort((a, b) => b[1].n - a[1].n || b[1].w.length - a[1].w.length).slice(0, 8);
    const got = new Set(TextKit.tokens(text).map(w => TextKit.stem(w)));
    const understood = expected.filter(([k]) => got.has(k)).map(([, v]) => v.w);
    const missing = expected.filter(([k]) => !got.has(k)).map(([, v]) => v.w);
    const cov = understood.length / Math.max(1, expected.length);
    return {
      level: cov >= 0.55 ? 'bonne' : cov >= 0.3 ? 'partielle' : 'à revoir',
      understood: understood.map(w => `Tu mentionnes « ${w} »`),
      improve: text.trim().split(/\s+/).length < 15 ? ['Développe davantage ton explication (au moins 2 phrases).'] : [],
      missing: missing.slice(0, 5).map(w => `Élément du cours absent : « ${w} »`),
      reference: concept.body || concept.definition, approx: true
    };
  },

  /* ---------- Fiches & summaries (extractive) ---------- */
  scoreSentences(text) {
    const sents = TextKit.sentences(text);
    const freq = new Map();
    for (const t of TextKit.tokens(text)) freq.set(t, (freq.get(t) || 0) + 1);
    return sents.map((s, i) => {
      const toks = TextKit.tokens(s);
      const sc = toks.reduce((a, t) => a + (freq.get(t) || 0), 0) / Math.sqrt(toks.length + 1);
      return { s, i, sc };
    });
  },
  topSentences(text, n) {
    return this.scoreSentences(text).sort((a, b) => b.sc - a.sc).slice(0, n).sort((a, b) => a.i - b.i).map(x => x.s);
  },
  fiche(type, doc, sections, concepts) {
    const byImp = concepts.slice().sort((a, b) => b.importance - a.importance);
    const line = c => `- **${c.name}** — ${trunc(c.body || c.definition, 170)}`;
    const L = [];
    if (type === 'express') {
      L.push(`## Fiche express — ${doc.title}`);
      byImp.slice(0, 10).forEach(c => L.push(line(c)));
    } else if (type === 'complete') {
      L.push(`## Fiche complète — ${doc.title}`);
      for (const s of sections) {
        L.push('', `### ${s.title}`);
        const cs = concepts.filter(c => c.sectionId === s.id).sort((a, b) => b.importance - a.importance).slice(0, 8);
        cs.forEach(c => L.push(line(c)));
        const key = this.topSentences(s.text, 3).filter(x => !cs.some(c => c.excerpt === x));
        if (key.length) { L.push('', '**Points importants**'); key.forEach(k => L.push('- ' + k)); }
      }
    } else if (type === 'exam') {
      L.push(`## Fiche examen — ${doc.title}`, '', '**Notions essentielles**');
      byImp.filter(c => c.importance >= 0.5).slice(0, 15).forEach(c => L.push(line(c)));
      const dates = sections.flatMap(s => TextKit.dates(s.text)).sort((a, b) => a.year - b.year).slice(0, 10);
      if (dates.length) { L.push('', '**Dates**'); dates.forEach(d => L.push(`- **${d.year}** — ${trunc(d.sentence, 140)}`)); }
      const f = sections.flatMap(s => TextKit.formulas(s.text)).slice(0, 8);
      if (f.length) { L.push('', '**Formules**'); f.forEach(x => L.push('- `' + x + '`')); }
    } else if (type === 'lastminute') {
      L.push(`## Dernière minute — ${doc.title}`);
      byImp.slice(0, 12).forEach(c => L.push(`- **${c.name}** : ${trunc(c.body || c.definition, 80)}`));
    } else if (type === 'sum5') {
      L.push(`## Résumé en 5 lignes`);
      this.topSentences(sections.map(s => s.text).join('\n'), 5).forEach(s => L.push('- ' + s));
    } else if (type === 'sumpoints') {
      L.push(`## Résumé en points`);
      for (const s of sections) { L.push('', `**${s.title}**`); this.topSentences(s.text, 2).forEach(x => L.push('- ' + x)); }
    } else return null;
    return L.join('\n');
  },

  /* ---------- Local "chat": retrieval only, clearly labelled ---------- */
  answer(query, docIds) {
    const hits = SearchIndex.search(docIds, query, 4);
    if (!hits.length) return { text: "Je n'ai trouvé aucun passage de ton cours qui corresponde à cette question. Essaie avec d'autres mots-clés.", sources: [], basis: 'none' };
    const docs = new Map(docIds.map(id => [id, Store.get('documents', id)]));
    const L = ['**Mode local, sans IA.** Voici les passages de ton cours les plus proches de ta question :', ''];
    const sources = [];
    for (const h of hits) {
      const d = docs.get(h.docId);
      L.push(`**${h.title}**${h.page ? ` · p. ${h.page}` : ''}`, '', trunc(h.text, 520).split('\n').map(x => '> ' + x).join('\n').replace(/^> /gm, ''), '');
      sources.push({ docId: h.docId, title: d ? d.title : '', page: h.page, section: h.title });
    }
    return { text: L.join('\n'), sources, basis: 'source' };
  }
};

/* ---- 06-ai.js ---- */
/* ============================================================
   ai/provider — one interface, interchangeable providers
   AIProvider: analyze · generateQuiz · evaluateAnswer · explain ·
               chat · checkUnderstanding · fiche · ocr · createStudyPlan
   Remote = Claude through the viewer's own account (no API key in
   the page). Local = LocalAI (offline). Every remote output is
   validated; quotes are verified against the document text.
   ============================================================ */
const LANG_NAME = { fr: 'français', en: 'anglais' };
function genLang(doc) {
  const p = prefs().genLang;
  return p === 'fr' || p === 'en' ? p : (doc && doc.lang) || 'fr';
}

const PERSONAS = {
  prof: { label: 'Le professeur', desc: 'Tu es un professeur clair et rigoureux : explications structurées, questions sérieuses.' },
  exam: { label: "L'examinateur", desc: 'Tu es un examinateur exigeant : questions difficiles, tu relèves chaque imprécision.' },
  coach: { label: 'Le coach', desc: 'Tu es un coach bienveillant : tu encourages, tu corriges avec douceur et tu proposes la prochaine étape.' },
  socrate: { label: 'Le Socrate', desc: 'Tu procèdes par questions successives pour faire trouver la réponse.' },
  debutant: { label: 'Le débutant', desc: "Tu joues un élève débutant et curieux qui demande des explications simples et des exemples." }
};
const MODES = {
  ask: { label: 'Question libre', desc: "Réponds à la question de l'utilisateur." },
  teach: { label: 'Apprends-moi', desc: "Enseigne progressivement : 1) explication simple, 2) exemple, 3) UNE question rapide puis ATTENDS la réponse. Ensuite corrige, approfondis, pose une question plus difficile, puis propose une mini-évaluation. Ne donne jamais tout d'un coup." },
  socratic: { label: 'Fais-moi réfléchir', desc: "Ne donne PAS la solution. Pose une question à la fois : ce que l'utilisateur sait déjà, la première étape, pourquoi. Donne un indice seulement s'il bloque ou le demande. Donne la réponse complète seulement en dernier recours." },
  eli: { label: 'Explique-moi comme si…', desc: "Explique au niveau demandé, en restant fidèle au document." },
  teachback: { label: 'Apprends en expliquant', desc: "Inverse les rôles : tu es un élève. L'utilisateur t'explique une notion. Pose des questions naïves mais pertinentes, signale gentiment ce qui manque ou est inexact par rapport au cours, une question à la fois." },
  oral: { label: "Entraînement à l'oral", desc: "Simule une interrogation orale : demande de présenter la notion sans notes, puis enchaîne une question à la fois (pourquoi ? un exemple ? quelle limite ?). Après chaque réponse, donne un retour bref et honnête." }
};

const AI = {
  canRemote() { return Net.isOnline() && Caps.aiUsable(); },
  whyNot() {
    if (prefs().useAI === false) return AI_ERRORS.disabled;
    if (!Net.isOnline()) return AI_ERRORS.offline;
    if (Caps.denied) return Caps.via === 'server' ? AI_ERRORS.server : AI_ERRORS.not_granted;
    return AI_ERRORS.unavailable;
  },

  /* ---------- Analysis of one section (concepts + questions + flashcards) ---------- */
  async analyzeSection(doc, section, { signal } = {}) {
    const lang = genLang(doc);
    const text = section.text.slice(0, 14000);
    const prompt = `Tu es le moteur pédagogique de l'application Revora. Analyse cet extrait de cours (chapitre « ${section.title} » du document « ${doc.title} »).
Langue de sortie : ${LANG_NAME[lang]}.
Règles strictes :
- N'invente rien qui soit présenté comme venant du document.
- "quote" = copie EXACTE, mot pour mot, d'un court passage du texte (40 à 180 caractères) qui justifie l'élément.
- "origin" : "source" si l'information est explicitement dans le texte, "inference" si c'est une déduction raisonnable, "external" si elle vient de connaissances générales.
- Questions variées : au plus 2 questions de définition ; ajoute application, comparaison, raisonnement, cas pratique, erreur fréquente, question inversée.
- Adapte au domaine : maths = exercices de raisonnement ; programmation = prédire un résultat, corriger du code, compléter du code (code entre \`\`\`) ; langues = traduction, grammaire, conjugaison ; droit = cas pratiques ; histoire = chronologie, causes/conséquences ; médecine = cas cliniques pédagogiques.
- QCM : une seule bonne réponse, distracteurs plausibles, pas de « toutes les réponses ».
- Indices progressifs : petit indice, rappel de notion, méthode. Ne révèle pas la réponse.
Réponds uniquement avec un objet JSON de cette forme :
{"domain":"...","concepts":[{"name":"...","definition":"1 à 2 phrases","importance":1,"why":"pourquoi c'est important, court","quote":"..."}],
"questions":[{"type":"mcq","prompt":"...","options":["...","...","...","..."],"answer":0,"explanation":"...","quote":"...","origin":"source","skill":"memorisation","difficulty":2,"concept":"nom de la notion","hints":["...","...","..."]}],
"flashcards":[{"front":"...","back":"...","concept":"...","quote":"..."}]}
Types : "mcq" (4 options, answer = index de la bonne) ; "tf" (answer = true ou false) ; "short" (answer = réponse courte, "accept" = variantes) ; "free" (answer = éléments attendus) ; "order" ("items" dans le BON ordre, 3 à 6 éléments).
skill ∈ memorisation, comprehension, application, raisonnement. difficulty de 1 (facile) à 4 (expert). importance de 1 à 3.
Produis 4 à 8 notions, 8 questions de difficultés mélangées et 6 flashcards.
TEXTE :
"""
${text}
"""`;
    const res = await Remote.json(prompt, { signal, cache: false });
    return this.normalizeAnalysis(res, doc, section);
  },

  normalizeAnalysis(res, doc, section) {
    const out = { domain: null, concepts: [], questions: [], flashcards: [] };
    if (!res || typeof res !== 'object') return out;
    if (typeof res.domain === 'string') out.domain = trunc(res.domain, 40);
    for (const c of Array.isArray(res.concepts) ? res.concepts : []) {
      if (!c || typeof c.name !== 'string' || !c.name.trim() || typeof c.definition !== 'string') continue;
      const loc = TextKit.locate(c.quote, section);
      out.concepts.push({
        name: trunc(cap(c.name.trim()), 80), body: trunc(c.definition.trim(), 400),
        importance: clamp((+c.importance || 2) / 3, 0.2, 1), why: typeof c.why === 'string' ? trunc(c.why, 160) : '',
        excerpt: loc ? c.quote : null, page: loc ? loc.page : null, origin: loc ? 'source' : 'inference'
      });
    }
    for (const q of Array.isArray(res.questions) ? res.questions : []) {
      const n = this.normalizeQuestion(q, section);
      if (n) out.questions.push(n);
    }
    for (const f of Array.isArray(res.flashcards) ? res.flashcards : []) {
      if (!f || typeof f.front !== 'string' || typeof f.back !== 'string' || !f.front.trim() || !f.back.trim()) continue;
      const loc = TextKit.locate(f.quote, section);
      out.flashcards.push({ front: trunc(f.front.trim(), 400), back: trunc(f.back.trim(), 600), conceptName: f.concept, source: { excerpt: loc ? f.quote : null, page: loc ? loc.page : null }, origin: loc ? 'source' : 'inference' });
    }
    return out;
  },

  normalizeQuestion(q, section) {
    if (!q || typeof q.prompt !== 'string' || q.prompt.trim().length < 8) return null;
    const tmap = { mcq: 'mcq', qcm: 'mcq', tf: 'tf', truefalse: 'tf', vrai_faux: 'tf', short: 'short', cloze: 'short', free: 'free', open: 'free', order: 'order', chronology: 'order', case: 'mcq' };
    let type = tmap[String(q.type || '').toLowerCase()];
    if (!type) return null;
    if (type === 'mcq' && !Array.isArray(q.options) && q.type === 'case') type = 'free';
    const n = {
      type, prompt: q.prompt.trim(), explanation: typeof q.explanation === 'string' ? q.explanation.trim() : '',
      skill: ['memorisation', 'comprehension', 'application', 'raisonnement'].includes(q.skill) ? q.skill : 'comprehension',
      difficulty: clamp(Math.round(+q.difficulty || 2), 1, 4),
      hints: (Array.isArray(q.hints) ? q.hints : []).filter(h => typeof h === 'string' && h.trim()).slice(0, 3).map(h => trunc(h.trim(), 240)),
      conceptName: typeof q.concept === 'string' ? q.concept : '', origin: ['source', 'inference', 'external'].includes(q.origin) ? q.origin : 'inference',
      generator: 'ia'
    };
    if (type === 'mcq') {
      if (!Array.isArray(q.options)) return null;
      const opts = q.options.filter(o => typeof o === 'string' || typeof o === 'number').map(o => String(o).trim()).filter(Boolean);
      if (opts.length < 3 || opts.length > 6 || new Set(opts.map(norm)).size !== opts.length) return null;
      let a = typeof q.answer === 'number' ? q.answer : opts.findIndex(o => norm(o) === norm(q.answer));
      if (!(a >= 0 && a < opts.length)) return null;
      const perm = shuffle(opts.map((_, i) => i));
      n.options = perm.map(i => opts[i]); n.answer = perm.indexOf(a);
    } else if (type === 'tf') {
      const v = q.answer;
      n.answer = v === true || /^(true|vrai|yes|oui)$/i.test(String(v));
      if (!(v === true || v === false || /^(true|false|vrai|faux)$/i.test(String(v)))) return null;
    } else if (type === 'short') {
      if (!String(q.answer ?? '').trim()) return null;
      n.answer = String(q.answer).trim();
      n.accept = (Array.isArray(q.accept) ? q.accept : []).map(String).filter(Boolean).slice(0, 6);
    } else if (type === 'free') {
      n.answer = String(q.answer ?? q.explanation ?? '').trim();
      if (!n.answer) return null;
      n.keywords = [...new Set(TextKit.tokens(n.answer))].sort((a, b) => b.length - a.length).slice(0, 6);
    } else if (type === 'order') {
      const items = (Array.isArray(q.items) ? q.items : []).map(String).map(s => s.trim()).filter(Boolean);
      if (items.length < 3 || items.length > 7 || new Set(items.map(norm)).size !== items.length) return null;
      n.items = items.map(s => trunc(s, 160));
    }
    const loc = TextKit.locate(q.quote, section);
    n.source = { excerpt: loc ? String(q.quote).trim() : null, page: loc ? loc.page : null };
    if (!loc && n.origin === 'source') { n.origin = 'inference'; n.unverified = true; }
    return n;
  },

  /* Link normalized AI items to stored concepts, return store-ready records */
  materialize(doc, section, analysis, existingQuestions) {
    const concepts = Store.where('concepts', c => c.docId === doc.id);
    const byName = new Map(concepts.map(c => [norm(c.name), c]));
    const newConcepts = [];
    for (const c of analysis.concepts) {
      const k = norm(c.name);
      const ex = byName.get(k);
      if (ex) {
        ex.aiBody = c.body; ex.importance = Math.max(ex.importance || 0, c.importance);
        if (c.why) { ex.why = c.why; ex.whySource = 'ai'; }
        if (!ex.body) ex.body = c.body;
        Store.put('concepts', ex);
      } else {
        const rec = {
          id: uid('c'), docId: doc.id, sectionId: section.id, name: c.name, body: c.body, definition: c.excerpt || c.body,
          excerpt: c.excerpt, page: c.page, kind: 'definition', origin: c.origin, importance: c.importance, why: c.why || 'Notion identifiée par l\'IA', whySource: 'ai', generator: 'ia', createdAt: now()
        };
        byName.set(k, rec); newConcepts.push(rec);
      }
    }
    const find = name => {
      const k = norm(name); if (!k) return null;
      if (byName.has(k)) return byName.get(k);
      for (const [kk, c] of byName) if (kk.includes(k) || k.includes(kk)) return c;
      return null;
    };
    const qs = LocalAI.validate(analysis.questions.map(q => {
      const c = find(q.conceptName);
      const { conceptName, ...rest } = q;
      return { id: uid('q'), docId: doc.id, sectionId: section.id, conceptId: c ? c.id : null, createdAt: now(), seen: 0, ...rest };
    }), existingQuestions);
    const fcs = analysis.flashcards.map(f => {
      const c = find(f.conceptName);
      const { conceptName, ...rest } = f;
      return { id: uid('f'), docId: doc.id, sectionId: section.id, conceptId: c ? c.id : null, generator: 'ia', createdAt: now(), ...rest };
    });
    return { newConcepts, questions: qs, flashcards: fcs };
  },

  /* ---------- Custom question generation ---------- */
  async generateQuestions({ doc, sections, count = 10, types, difficulty, focus, instruction, signal }) {
    const lang = genLang(doc);
    const existing = Store.where('questions', q => q.docId === doc.id);
    if (!this.canRemote()) {
      const concepts = Store.where('concepts', c => c.docId === doc.id && sections.some(s => s.id === c.sectionId));
      let qs = LocalAI.generateQuestions(doc, sections, concepts, { existing, lang });
      if (types && types.length) qs = qs.filter(q => types.includes(q.type));
      return { questions: qs.slice(0, count), mode: 'local' };
    }
    const text = this.compressSections(sections, 26000);
    const avoid = existing.slice(-40).map(q => '- ' + trunc(q.prompt, 110)).join('\n');
    const diffTxt = { 1: 'faciles', 2: 'intermédiaires', 3: 'difficiles', 4: 'de niveau expert' }[difficulty] || 'de difficultés mélangées';
    const prompt = `Tu es le moteur pédagogique de Revora. Génère exactement ${count} NOUVELLES questions ${diffTxt} sur le cours ci-dessous (« ${doc.title} »).
Langue : ${LANG_NAME[lang]}.
${types && types.length ? 'Types autorisés : ' + types.join(', ') + '.' : 'Varie les types : mcq, tf, short, free, order.'}
${focus ? 'Focalise-toi sur : ' + focus + '.' : ''}
${instruction ? "Consigne de l'utilisateur : " + instruction.slice(0, 400) : ''}
Teste des compétences différentes (rappel, compréhension, application, raisonnement, cas pratique). Évite de reformuler ces questions déjà posées :
${avoid || '(aucune)'}
Règles : "quote" = copie EXACTE d'un court passage du texte ; origin = source | inference | external ; une seule bonne réponse pour les QCM ; indices progressifs sans révéler la réponse.
Réponds uniquement avec un tableau JSON d'objets : {"type":"mcq|tf|short|free|order","prompt":"...","options":[...],"answer":...,"accept":[...],"items":[...],"explanation":"...","quote":"...","origin":"source","skill":"memorisation|comprehension|application|raisonnement","difficulty":1,"concept":"...","hints":["...","...","..."]}
COURS :
"""
${text}
"""`;
    const arr = await Remote.json(prompt, { signal, cache: false });
    const list = Array.isArray(arr) ? arr : (arr && Array.isArray(arr.questions) ? arr.questions : []);
    const out = [];
    for (const raw of list) {
      const sec = sections.find(s => TextKit.locate(raw && raw.quote, s)) || sections[0];
      const n = this.normalizeQuestion(raw, sec);
      if (!n) continue;
      const m = this.materialize(doc, sec, { concepts: [], questions: [n], flashcards: [] }, existing.concat(out));
      out.push(...m.questions);
    }
    return { questions: out, mode: 'ia' };
  },

  compressSections(sections, max) {
    const total = sections.reduce((a, s) => a + s.text.length + s.title.length + 8, 0);
    if (total <= max) return sections.map(s => `## ${s.title}\n${s.text}`).join('\n\n');
    // Document too large: keep the most informative sentences of every section
    const per = Math.floor(max / sections.length);
    return sections.map(s => {
      const sents = LocalAI.topSentences(s.text, 60);
      let buf = '';
      for (const x of sents) { if (buf.length + x.length > per) break; buf += x + ' '; }
      return `## ${s.title}\n${buf.trim()}`;
    }).join('\n\n');
  },

  /* ---------- Evaluation ---------- */
  async evaluate(q, answer, { signal } = {}) {
    const local = LocalAI.evaluate(q, answer);
    if (!['short', 'free'].includes(q.type)) return { ...local, by: 'local' };
    if (q.type === 'short' && local.score === 1) return { ...local, by: 'local' };
    if (!this.canRemote() || !String(answer || '').trim()) return { ...local, by: 'local' };
    const doc = Store.get('documents', q.docId);
    const prompt = `Évalue la réponse d'un élève. Juge le SENS, pas l'orthographe ni la formulation exacte.
Question : ${q.prompt}
Réponse attendue (d'après le cours) : ${q.answer}
${q.source && q.source.excerpt ? 'Passage du cours : ' + q.source.excerpt : ''}
Réponse de l'élève : ${String(answer).slice(0, 2000)}
Réponds uniquement en JSON : {"score":1 ou 0.5 ou 0,"feedback":"une ou deux phrases en ${LANG_NAME[genLang(doc)]}","matched":["idées correctes"],"missing":["éléments manquants"]}
score 1 = correct et suffisant ; 0.5 = idée principale correcte mais incomplète ; 0 = incorrect.`;
    try {
      const r = await Remote.json(prompt, { signal, modelTier: 'quick' });
      const score = [0, 0.5, 1].includes(+r.score) ? +r.score : local.score;
      return {
        score, feedback: typeof r.feedback === 'string' ? r.feedback : local.feedback,
        matched: Array.isArray(r.matched) ? r.matched.map(String).slice(0, 5) : [], missing: Array.isArray(r.missing) ? r.missing.map(String).slice(0, 5) : [], by: 'ia'
      };
    } catch (e) {
      return { ...local, by: 'local', aiError: aiErrorMessage(e) };
    }
  },

  async checkUnderstanding(concept, text, { signal } = {}) {
    if (!this.canRemote()) return { ...LocalAI.checkUnderstanding(concept, text), by: 'local' };
    const s = Store.get('sections', concept.sectionId);
    const ctx = s ? LocalAI.topSentences(s.text, 12).join(' ') : '';
    const doc = Store.get('documents', concept.docId);
    const prompt = `Un élève explique avec ses propres mots la notion « ${concept.name} ». Analyse son explication par rapport au cours : exactitude, éléments oubliés, confusions, précision, compréhension.
Définition du cours : ${concept.aiBody || concept.body || concept.definition}
Contexte du cours : ${ctx.slice(0, 4000)}
Explication de l'élève : ${text.slice(0, 3000)}
Réponds uniquement en JSON (en ${LANG_NAME[genLang(doc)]}) : {"level":"bonne|partielle|à revoir","understood":["ce qui est correctement compris"],"improve":["ce qui est à préciser"],"missing":["éléments oubliés"],"confusions":["confusions éventuelles"],"reference":"rappel correct en 2 phrases"}`;
    try {
      const r = await Remote.json(prompt, { signal, cache: false });
      const arr = x => (Array.isArray(x) ? x.map(String).filter(Boolean).slice(0, 6) : []);
      return { level: ['bonne', 'partielle', 'à revoir'].includes(r.level) ? r.level : 'partielle', understood: arr(r.understood), improve: arr(r.improve), missing: arr(r.missing), confusions: arr(r.confusions), reference: String(r.reference || concept.body || ''), by: 'ia' };
    } catch (e) {
      return { ...LocalAI.checkUnderstanding(concept, text), by: 'local', aiError: aiErrorMessage(e) };
    }
  },

  /* ---------- Fiches / summaries ---------- */
  FICHES: {
    express: { label: 'Fiche express', local: true, ask: 'une fiche express très courte (8 à 10 lignes) avec les notions clés' },
    complete: { label: 'Fiche complète', local: true, ask: 'une fiche complète et structurée par chapitre (définitions, points importants, exemples du cours)' },
    exam: { label: 'Fiche examen', local: true, ask: "une fiche d'examen avec uniquement les éléments importants à connaître (notions, dates, formules, pièges fréquents)" },
    lastminute: { label: 'Dernière minute', local: true, ask: 'une fiche de dernière minute extrêmement condensée (12 puces maximum)' },
    sum5: { label: 'Résumé en 5 lignes', local: true, ask: 'un résumé en exactement 5 lignes' },
    sumpoints: { label: 'Résumé en points', local: true, ask: 'un résumé en points, organisé par chapitre' },
    sumdetail: { label: 'Résumé détaillé', local: false, ask: 'un résumé détaillé et rédigé' },
    beginner: { label: 'Niveau débutant', local: false, ask: 'une explication pour un débutant complet, avec des analogies simples' },
    expert: { label: 'Niveau expert', local: false, ask: 'une explication de niveau expert, précise et dense' },
    mindtext: { label: 'Carte mentale (texte)', local: false, ask: 'une carte mentale textuelle en liste imbriquée (concept central → sous-concepts → exemples/causes)' },
    table: { label: 'Tableau comparatif', local: false, ask: 'un tableau comparatif Markdown des notions qui peuvent être comparées (colonnes pertinentes)' },
    prof: { label: 'Contrôle (mode prof)', local: false, ask: "un contrôle complet : sujet, questions numérotées, barème par question, compétences évaluées, puis une section « Correction » séparée à la fin" }
  },
  async fiche(type, doc, sections, { signal, onText, forceAI } = {}) {
    const def = this.FICHES[type];
    const concepts = Store.where('concepts', c => c.docId === doc.id && sections.some(s => s.id === c.sectionId));
    if (def.local && !forceAI) return { text: LocalAI.fiche(type, doc, sections, concepts), by: 'local' };
    if (!this.canRemote()) throw { code: !Net.isOnline() ? 'offline' : prefs().useAI === false ? 'disabled' : Caps.denied ? 'not_granted' : 'unavailable' };
    const lang = genLang(doc);
    const prompt = `À partir du cours ci-dessous (« ${doc.title} »), rédige ${def.ask}. Langue : ${LANG_NAME[lang]}. Format : Markdown simple (titres ##, puces, **gras**, tableaux Markdown si utile).
Reste fidèle au document. Si tu ajoutes une information absente du cours, signale-la par « (connaissance générale) ». N'invente ni citation ni numéro de page.
COURS :
"""
${this.compressSections(sections, 30000)}
"""`;
    const text = await Remote.text(prompt, { signal, onText: onText ? ({ text }) => onText(text) : undefined, cache: false });
    return { text, by: 'ia' };
  },

  /* ---------- Chat with the document(s) ---------- */
  async chat({ docIds, mode = 'ask', persona = 'prof', level, focusSection, messages, signal, onText }) {
    const lastUser = [...messages].reverse().find(m => m.role === 'user');
    if (!this.canRemote()) {
      if (mode !== 'ask') throw { code: !Net.isOnline() ? 'offline' : prefs().useAI === false ? 'disabled' : Caps.denied ? 'not_granted' : 'unavailable' };
      return { ...LocalAI.answer(lastUser ? lastUser.content : '', docIds), by: 'local' };
    }
    let extracts = [], sources = [];
    if (focusSection && ['teach', 'oral', 'teachback', 'eli'].includes(mode)) {
      const s = Store.get('sections', focusSection);
      if (s) { extracts.push(`[Chapitre « ${s.title} »${s.pageFrom ? ', p. ' + s.pageFrom + (s.pageTo && s.pageTo !== s.pageFrom ? '–' + s.pageTo : '') : ''}]\n${s.text.slice(0, 12000)}`); sources.push({ docId: s.docId, section: s.title, page: s.pageFrom }); }
    }
    const q = messages.filter(m => m.role === 'user').slice(-2).map(m => m.content).join(' ');
    for (const h of SearchIndex.search(docIds, q, extracts.length ? 3 : 6)) {
      const d = Store.get('documents', h.docId);
      extracts.push(`[${extracts.length + 1}] ${d ? d.title : ''} — ${h.title}${h.page ? ' — p. ' + h.page : ''}\n${h.text}`);
      sources.push({ docId: h.docId, title: d ? d.title : '', section: h.title, page: h.page });
    }
    const docTitles = docIds.map(id => (Store.get('documents', id) || {}).title).filter(Boolean).join(', ');
    const lang = genLang(Store.get('documents', docIds[0]));
    const rules = `Tu es le tuteur IA de l'application Revora. ${PERSONAS[persona] ? PERSONAS[persona].desc : ''}
Mode : ${MODES[mode].label}. ${MODES[mode].desc}${mode === 'eli' && level ? ' Niveau demandé : ' + level + '.' : ''}
Cours de l'utilisateur : ${docTitles}.
Règles :
- Appuie-toi d'abord sur les EXTRAITS ci-dessous. Quand tu utilises un extrait, cite sa référence entre crochets, par ex. [p. 12] ou [Chapitre : titre].
- Si l'information n'est pas dans les extraits, écris : « Cette information n'est pas clairement indiquée dans le document. » Tu peux ensuite compléter en le signalant par « (connaissance générale) ».
- N'invente jamais de citation, de page ou de référence. La personnalité change le style, jamais les faits.
- Réponds en ${LANG_NAME[lang]}, de façon concise et pédagogique, en Markdown simple.
- Termine par une ligne seule : « Base : document », « Base : document + connaissances générales » ou « Base : connaissances générales ».
EXTRAITS :
${extracts.join('\n\n') || '(aucun extrait pertinent trouvé)'}`;
    const turns = [{ role: 'user', content: rules }];
    for (const m of messages.slice(-10)) turns.push({ role: m.role, content: String(m.content).slice(0, 4000) });
    if (turns[turns.length - 1].role !== 'user') turns.push({ role: 'user', content: 'Continue.' });
    const text = await Remote.text(turns, { signal, cache: false, onText: onText ? ({ text }) => onText(text) : undefined });
    const m = text.match(/Base\s*:\s*(document \+ connaissances générales|document|connaissances générales)/i);
    const basis = m ? (/\+/.test(m[1]) ? 'mixed' : /document/i.test(m[1]) ? 'source' : 'external') : 'unknown';
    return { text, sources, basis, by: 'ia' };
  },

  /* ---------- Confusion explanation ---------- */
  async explainConfusion(a, b, { signal } = {}) {
    if (!this.canRemote()) return null;
    const prompt = `Un élève confond régulièrement « ${a.name} » et « ${b.name} ». Explique la différence en 4 à 6 lignes, en t'appuyant sur ces définitions du cours, puis donne un moyen simple de ne plus les confondre. Markdown simple.
« ${a.name} » : ${a.aiBody || a.body || a.definition}
« ${b.name} » : ${b.aiBody || b.body || b.definition}`;
    return Remote.text(prompt, { signal });
  },

  /* ---------- OCR (images → text) ---------- */
  async ocr(blobs, { signal } = {}) {
    if (!this.canRemote()) throw { code: !Net.isOnline() ? 'offline' : 'unavailable' };
    if (!Caps.canImages()) throw { code: 'images_unavailable' };
    const max = (Caps.limits.images.maxCount || 1);
    const pages = [];
    for (let i = 0; i < blobs.length; i += max) {
      const batch = blobs.slice(i, i + max);
      const r = await Remote.json(`Voici ${batch.length} image(s) de pages de cours (dans l'ordre). Transcris fidèlement TOUT le texte lisible de chaque image, sans rien inventer ni résumer. Conserve les titres sur leur propre ligne et les listes. Décris brièvement entre crochets les schémas ou tableaux non textuels. Réponds uniquement en JSON : {"pages":[{"text":"..."}]} avec un élément par image, dans le même ordre.`, { signal, images: batch });
      const arr = r && Array.isArray(r.pages) ? r.pages : [];
      batch.forEach((_, j) => pages.push(String((arr[j] && arr[j].text) || '')));
    }
    return pages;
  },

  createStudyPlan(opts) { return Planner.build(opts); }
};

/* ============================================================
   features/import — robust multi-format import pipeline
   IMPORT → TYPE → EXTRACTION → OCR (if needed) → STRUCTURE →
   CHAPTERS → CONCEPTS → QUESTIONS/FLASHCARDS → (AI enrichment)
   ============================================================ */
const MAX_FILE = 30 * 1024 * 1024;
const FILE_KINDS = {
  pdf: ['pdf'], docx: ['docx'], pptx: ['pptx'], text: ['txt', 'md', 'markdown', 'csv', 'tsv', 'json', 'html', 'htm', 'rtf'],
  image: ['png', 'jpg', 'jpeg', 'webp', 'gif']
};
function fileKind(name) {
  const ext = String(name).split('.').pop().toLowerCase();
  for (const [k, list] of Object.entries(FILE_KINDS)) if (list.includes(ext)) return { kind: k, ext };
  if (['doc', 'ppt', 'xls', 'odt', 'odp'].includes(ext)) return { kind: 'legacy', ext };
  return { kind: null, ext };
}

/* Lazy loading of parsing libraries from the allowed CDNs (with fallbacks) */
const Libs = {
  loaded: {},
  script(urls) {
    const list = Array.isArray(urls) ? urls : [urls];
    return new Promise((resolve, reject) => {
      const tryAt = i => {
        if (i >= list.length) return reject(new Error('load'));
        const s = document.createElement('script');
        s.src = list[i]; s.async = true;
        s.onload = () => resolve();
        s.onerror = () => { s.remove(); tryAt(i + 1); };
        document.head.appendChild(s);
      };
      tryAt(0);
    });
  },
  async pdf() {
    if (window.pdfjsLib) return window.pdfjsLib;
    if (!this.loaded.pdf) this.loaded.pdf = (async () => {
      await this.script(['https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js', 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js']);
      await this.script(['https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js', 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js']);
      return window.pdfjsLib;
    })();
    return this.loaded.pdf;
  },
  async mammoth() {
    if (window.mammoth) return window.mammoth;
    if (!this.loaded.mammoth) this.loaded.mammoth = this.script(['https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js', 'https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js', 'https://unpkg.com/mammoth@1.6.0/mammoth.browser.min.js']).then(() => window.mammoth);
    return this.loaded.mammoth;
  },
  async jszip() {
    if (window.JSZip) return window.JSZip;
    if (!this.loaded.jszip) this.loaded.jszip = this.script(['https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js', 'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js']).then(() => window.JSZip);
    return this.loaded.jszip;
  }
};

class ImportError extends Error { constructor(msg) { super(msg); this.userMessage = msg; } }
const LIB_FAIL = "Le lecteur de ce format n'a pas pu être chargé (connexion nécessaire la première fois). Vérifie ta connexion, ou colle le texte du document.";

/** Reconstitue les lignes à partir des fragments, gère les mises en page à deux colonnes. */
function pdfItemsToText(items, pageWidth) {
  const frags = items.filter(it => it.str && it.str.trim() !== '' || it.hasEOL).map(it => ({
    x: it.transform[4], y: it.transform[5], w: it.width || 0, h: Math.abs(it.transform[3]) || 10, s: it.str || ''
  })).filter(f => f.s !== '');
  if (!frags.length) return '';
  const mid = pageWidth / 2;
  const left = frags.filter(f => f.x + f.w <= mid + 4).length;
  const right = frags.filter(f => f.x >= mid - 4).length;
  const spanning = frags.filter(f => f.x < mid - 20 && f.x + f.w > mid + 20).length;
  const twoCols = frags.length > 30 && left > frags.length * 0.3 && right > frags.length * 0.3 && spanning < frags.length * 0.08;
  const groups = twoCols ? [frags.filter(f => f.x < mid - 4 || f.x + f.w <= mid + 4), frags.filter(f => !(f.x < mid - 4 || f.x + f.w <= mid + 4))] : [frags];
  const out = [];
  for (const g of groups) {
    g.sort((a, b) => (b.y - a.y) || (a.x - b.x));
    const lines = [];
    for (const f of g) {
      const last = lines[lines.length - 1];
      if (last && Math.abs(last.y - f.y) <= Math.max(2.5, f.h * 0.45)) last.items.push(f);
      else lines.push({ y: f.y, h: f.h, items: [f] });
    }
    let prevY = null, prevH = 10;
    for (const ln of lines) {
      ln.items.sort((a, b) => a.x - b.x);
      let s = '';
      let prevEnd = null;
      for (const it of ln.items) {
        if (prevEnd !== null && it.x - prevEnd > 1.5 && !s.endsWith(' ') && !it.s.startsWith(' ')) s += ' ';
        s += it.s;
        prevEnd = it.x + it.w;
      }
      s = s.replace(/\s+/g, ' ').trim();
      if (prevY !== null && prevY - ln.y > prevH * 1.9) out.push('');
      out.push(s);
      prevY = ln.y; prevH = ln.h || prevH;
    }
    out.push('');
  }
  // Recolle les mots coupés en fin de ligne (« écono-\nmie »)
  return out.join('\n').replace(/([a-zà-ÿ])-\n([a-zà-ÿ])/g, '$1$2').replace(/\n{3,}/g, '\n\n').trim();
}


const Extract = {
  async text(file, ext) {
    let t = await file.text();
    if (ext === 'html' || ext === 'htm') {
      const dom = new DOMParser().parseFromString(t, 'text/html');
      dom.querySelectorAll('script,style,noscript').forEach(n => n.remove());
      dom.querySelectorAll('h1,h2').forEach(h => h.textContent = '\n# ' + h.textContent.trim() + '\n');
      dom.querySelectorAll('p,li,br,div,tr,h3,h4').forEach(n => n.append('\n'));
      t = dom.body ? dom.body.textContent : '';
    } else if (ext === 'csv' || ext === 'tsv') {
      const sep = ext === 'tsv' ? '\t' : (t.split('\n')[0].split(';').length > t.split('\n')[0].split(',').length ? ';' : ',');
      t = t.split(/\r?\n/).map(r => r.split(sep).map(c => c.replace(/^"|"$/g, '').trim()).join(' | ')).join('\n');
    } else if (ext === 'json') {
      try { t = JSON.stringify(JSON.parse(t), null, 1).replace(/[{}\[\]",]/g, ' ').replace(/ +/g, ' '); } catch (e) { }
    } else if (ext === 'rtf') {
      t = t.replace(/\\par[d]?/g, '\n').replace(/\{\*?\\[^{}]+}|[{}]|\\\n?[A-Za-z]+\n?(?:-?\d+)?[ ]?/g, '');
    }
    return { pages: [{ page: null, text: t }], pageCount: null };
  },
  async pdf(file, onStep) {
    let lib;
    try { lib = await Libs.pdf(); } catch (e) { throw new ImportError(LIB_FAIL); }
    if (!lib) throw new ImportError(LIB_FAIL);
    const buf = await file.arrayBuffer();
    let pdf;
    try { pdf = await lib.getDocument({ data: new Uint8Array(buf), isEvalSupported: false }).promise; }
    catch (e) { throw new ImportError(e && e.name === 'PasswordException' ? 'Ce PDF est protégé par un mot de passe. Retire la protection puis réessaie.' : "Ce PDF semble endommagé ou illisible."); }
    const pages = [];
    for (let i = 1; i <= pdf.numPages; i++) {
      let text = '';
      try {
        const page = await pdf.getPage(i);
        const vp = page.getViewport({ scale: 1 });
        const tc = await page.getTextContent();
        text = pdfItemsToText(tc.items, vp.width);
      } catch (e) { text = ''; }
      pages.push({ page: i, text });
      if (i % 10 === 0) await sleep(0);
      if (i % 5 === 0) onStep && onStep(`Extraction… page ${i}/${pdf.numPages}`);
    }
    const chars = pages.reduce((a, p) => a + p.text.trim().length, 0);
    return { pages, pageCount: pdf.numPages, scanned: chars / pdf.numPages < 40, pdf };
  },
  async pdfOcr(pdf, onStep) {
    const n = Math.min(pdf.numPages, 30);
    const blobs = [];
    for (let i = 1; i <= n; i++) {
      const page = await pdf.getPage(i);
      const vp = page.getViewport({ scale: 1.6 });
      const canvas = document.createElement('canvas');
      canvas.width = vp.width; canvas.height = vp.height;
      await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
      blobs.push(await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.85)));
      onStep && onStep(`Préparation OCR… page ${i}/${n}`);
    }
    onStep && onStep('Lecture du texte par l\'IA (OCR)…');
    const texts = await AI.ocr(blobs);
    return { pages: texts.map((t, i) => ({ page: i + 1, text: t })), pageCount: pdf.numPages, truncatedOcr: pdf.numPages > n };
  },
  async docx(file) {
    let m;
    try { m = await Libs.mammoth(); } catch (e) { throw new ImportError(LIB_FAIL); }
    const res = await m.convertToHtml({ arrayBuffer: await file.arrayBuffer() });
    const dom = new DOMParser().parseFromString(res.value, 'text/html');
    const lines = [];
    for (const el of dom.body.children) {
      const tag = el.tagName.toLowerCase();
      if (tag === 'h1') lines.push('# ' + el.textContent.trim());
      else if (/^h[2-6]$/.test(tag)) lines.push('## ' + el.textContent.trim());
      else if (tag === 'ul' || tag === 'ol') el.querySelectorAll('li').forEach(li => lines.push('• ' + li.textContent.trim()));
      else if (tag === 'table') el.querySelectorAll('tr').forEach(tr => lines.push([...tr.children].map(td => td.textContent.trim()).join(' | ')));
      else lines.push(el.textContent.trim());
      lines.push('');
    }
    return { pages: [{ page: null, text: lines.join('\n') }], pageCount: null };
  },
  async pptx(file) {
    let Z;
    try { Z = await Libs.jszip(); } catch (e) { throw new ImportError(LIB_FAIL); }
    const zip = await Z.loadAsync(await file.arrayBuffer());
    const slides = Object.keys(zip.files).filter(n => /^ppt\/slides\/slide\d+\.xml$/.test(n))
      .sort((a, b) => +a.match(/(\d+)\.xml/)[1] - +b.match(/(\d+)\.xml/)[1]);
    if (!slides.length) throw new ImportError('Aucune diapositive trouvée dans ce fichier.');
    const pages = [];
    for (let i = 0; i < slides.length; i++) {
      const xml = await zip.file(slides[i]).async('string');
      const doc = new DOMParser().parseFromString(xml, 'application/xml');
      const paras = [...doc.getElementsByTagName('a:p')].map(p => [...p.getElementsByTagName('a:t')].map(t => t.textContent).join('')).filter(s => s.trim());
      pages.push({ page: i + 1, text: paras.length ? '# ' + paras[0] + '\n' + paras.slice(1).join('\n') : '' });
    }
    return { pages, pageCount: slides.length, unit: 'diapo' };
  },
  async image(files, onStep) {
    onStep && onStep('Lecture du texte de l\'image par l\'IA (OCR)…');
    const texts = await AI.ocr(files);
    return { pages: texts.map((t, i) => ({ page: files.length > 1 ? i + 1 : null, text: t })), pageCount: files.length > 1 ? files.length : null };
  }
};

const Importer = {
  STEPS: ['Détection du type', 'Extraction du texte', 'Structuration en chapitres', 'Détection des notions', 'Création des questions et flashcards'],

  validate(file) {
    const { kind, ext } = fileKind(file.name);
    if (!kind) return `Format « .${ext} » non pris en charge. Formats acceptés : PDF, DOCX, PPTX, TXT, MD, CSV, HTML, images.`;
    if (kind === 'legacy') return `Les anciens fichiers « .${ext} » ne sont pas lisibles. Enregistre-le en ${ext === 'ppt' ? '.pptx' : ext === 'xls' ? '.csv' : '.docx'} ou en PDF.`;
    if (file.size > MAX_FILE) return `Fichier trop volumineux (${fmtSize(file.size)}). Limite : 30 Mo.`;
    if (file.size === 0) return 'Ce fichier est vide.';
    if (kind === 'image' && !Caps.canImages()) return "Lire le texte d'une image nécessite l'IA (connexion). Colle plutôt le texte, ou importe un PDF avec du texte.";
    return null;
  },

  /* Main pipeline. progress(stepIndex, label) */
  async importFile(file, { folderId = null, progress = () => { } } = {}) {
    const err = this.validate(file);
    if (err) throw new ImportError(err);
    const { kind, ext } = fileKind(file.name);
    progress(0, this.STEPS[0] + ' : ' + ext.toUpperCase());
    progress(1, this.STEPS[1]);
    let ex;
    const onStep = l => progress(1, l);
    if (kind === 'pdf') {
      ex = await Extract.pdf(file, onStep);
      if (ex.scanned) {
        if (Caps.canImages() && AI.canRemote()) ex = await Extract.pdfOcr(ex.pdf, onStep);
        else throw new ImportError("Ce PDF est scanné (images sans texte). La lecture du texte (OCR) nécessite l'IA et une connexion. Réessaie en ligne, ou colle le texte.");
      }
    } else if (kind === 'docx') ex = await Extract.docx(file);
    else if (kind === 'pptx') ex = await Extract.pptx(file);
    else if (kind === 'image') ex = await Extract.image([file], onStep);
    else ex = await Extract.text(file, ext);
    return this.createFromPages(ex.pages, {
      title: file.name.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' ').trim(), fileName: file.name, kind: ext, size: file.size,
      pageCount: ex.pageCount, unit: ex.unit || (kind === 'pdf' ? 'page' : null), folderId, progress, note: ex.truncatedOcr ? 'OCR limité aux 30 premières pages.' : null
    });
  },

  async importText(title, text, { folderId = null, progress = () => { }, sample = false } = {}) {
    const t = String(text || '').trim();
    if (t.length < 80) throw new ImportError('Le texte est trop court pour créer des révisions (au moins quelques phrases).');
    progress(0, this.STEPS[0] + ' : texte collé');
    progress(1, this.STEPS[1]);
    return this.createFromPages([{ page: null, text: t }], { title: title || 'Notes sans titre', fileName: null, kind: 'texte', size: t.length, pageCount: null, folderId, progress, sample });
  },

  async createFromPages(pages, meta) {
    const all = pages.map(p => p.text).join('\n');
    if (all.replace(/\s/g, '').length < 60) throw new ImportError("Aucun texte exploitable n'a été trouvé dans ce document.");
    await sleep(10);
    const doc = {
      id: uid('d'), title: trunc(meta.title || 'Document', 120), fileName: meta.fileName, kind: meta.kind, size: meta.size,
      pageCount: meta.pageCount, unit: meta.unit, folderId: meta.folderId, favorite: false, archived: false, sample: !!meta.sample,
      createdAt: now(), updatedAt: now(), lastOpenedAt: now(), charCount: all.length,
      lang: TextKit.lang(all), domain: TextKit.domain(all), note: meta.note || null,
      ai: { status: 'idle', done: [], total: 0 }
    };
    meta.progress(2, this.STEPS[2]);
    await sleep(10);
    const secs = TextKit.buildSections(pages, doc.title).map((s, i) => ({ id: uid('s'), docId: doc.id, order: i, ...s }));
    if (!secs.length) throw new ImportError("La structure du document n'a pas pu être créée.");
    meta.progress(3, this.STEPS[3]);
    await sleep(10);
    const concepts = LocalAI.extractConcepts(doc, secs);
    meta.progress(4, this.STEPS[4]);
    await sleep(10);
    const questions = LocalAI.generateQuestions(doc, secs, concepts, { lang: genLang(doc) });
    const flashcards = LocalAI.generateFlashcards(doc, secs, concepts, genLang(doc));
    // persist progressively — nothing is lost if the page closes afterwards
    Store.put('documents', doc);
    Store.putMany('sections', secs);
    Store.putMany('concepts', concepts);
    Store.putMany('questions', questions);
    Store.putMany('flashcards', flashcards);
    SearchIndex.invalidate(doc.id);
    return { doc, sections: secs, concepts, questions, flashcards };
  }
};

/* ---------- Background AI enrichment (resumable, saves per section) ---------- */
const Enrich = {
  running: new Map(), // docId → AbortController
  listeners: new Set(),
  emit(docId) { this.listeners.forEach(fn => { try { fn(docId); } catch (e) { } }); },
  isRunning(docId) { return this.running.has(docId); },
  recover() {
    // a job interrupted by a page close becomes "partial" and can resume
    for (const d of Store.all('documents')) if (d.ai && d.ai.status === 'running') { d.ai.status = 'partial'; Store.put('documents', d); }
  },
  cancel(docId) { this.pending = this.pending.filter(x => x !== docId); const c = this.running.get(docId); if (c) c.abort(); },
  pending: [],
  async run(docId) {
    if (this.running.has(docId) || this.pending.includes(docId)) return;
    // une seule analyse IA à la fois (limite de débit du serveur)
    if (this.running.size) { this.pending.push(docId); return; }
    const doc = Store.get('documents', docId);
    if (!doc) return;
    if (!AI.canRemote()) { toast(AI.whyNot(), 'warn'); return; }
    const ctl = new AbortController();
    this.running.set(docId, ctl);
    const secs = Store.where('sections', s => s.docId === docId).sort((a, b) => a.order - b.order);
    doc.ai = { ...(doc.ai || {}), status: 'running', total: secs.length, done: (doc.ai && doc.ai.done) || [], error: null };
    Store.put('documents', doc); this.emit(docId);
    let added = 0;
    try {
      for (const s of secs) {
        if (doc.ai.done.includes(s.id)) continue;
        if (ctl.signal.aborted) throw { code: 'cancelled' };
        doc.ai.current = s.title; Store.put('documents', doc); this.emit(docId);
        const analysis = await AI.analyzeSection(doc, s, { signal: ctl.signal });
        if (analysis.domain && doc.domain === 'Général') doc.domain = analysis.domain;
        const existing = Store.where('questions', q => q.docId === docId);
        const m = AI.materialize(doc, s, analysis, existing);
        Store.putMany('concepts', m.newConcepts);
        Store.putMany('questions', m.questions);
        Store.putMany('flashcards', m.flashcards);
        added += m.questions.length;
        doc.ai.done.push(s.id); doc.ai.questions = (doc.ai.questions || 0) + m.questions.length;
        Store.put('documents', doc); this.emit(docId);
      }
      doc.ai.status = 'done'; doc.ai.current = null; doc.ai.finishedAt = now();
      Store.put('documents', doc);
      toast(`Analyse IA terminée : ${plural(added, 'nouvelle question')} pour « ${trunc(doc.title, 40)} ».`, 'good');
    } catch (e) {
      doc.ai.status = doc.ai.done.length ? 'partial' : 'idle';
      doc.ai.current = null;
      if (e && e.code !== 'cancelled') { doc.ai.error = aiErrorMessage(e); toast(doc.ai.error, 'bad', 6000); }
      Store.put('documents', doc);
    } finally {
      this.running.delete(docId); this.emit(docId);
      const next = this.pending.shift();
      if (next && Store.get('documents', next)) setTimeout(() => this.run(next), 500);
    }
  }
};

/* ---------- Example course (clearly marked as an example) ---------- */
const SAMPLE_COURSE = `Chapitre 1 — Le marché et ses acteurs
Le marché est le lieu, physique ou virtuel, où se rencontrent l'offre et la demande d'un bien ou d'un service. Sur un marché, les acheteurs et les vendeurs échangent à un prix donné.
Les agents économiques sont les individus ou les groupes qui prennent des décisions économiques. On distingue principalement les ménages, les entreprises et l'État.
Un bien économique est une ressource rare qui répond à un besoin et qui a un prix. À l'inverse, un bien libre est disponible en quantité illimitée, comme l'air.
En 1776, Adam Smith publie « La Richesse des nations », où il décrit la main invisible du marché. Selon lui, la recherche de l'intérêt individuel peut conduire à l'intérêt général.

Chapitre 2 — L'offre et la demande
La demande désigne la quantité d'un bien que les consommateurs souhaitent acheter à un prix donné. En règle générale, la demande diminue lorsque le prix augmente.
L'offre correspond à la quantité d'un bien que les producteurs sont prêts à vendre à un prix donné. L'offre augmente généralement lorsque le prix augmente, car la production devient plus rentable.
Le prix d'équilibre est le prix pour lequel la quantité offerte est égale à la quantité demandée. À ce prix, le marché est dit à l'équilibre.
Une pénurie apparaît lorsque la demande dépasse l'offre au prix pratiqué. Un excédent apparaît lorsque l'offre dépasse la demande.
En 1890, Alfred Marshall popularise la représentation graphique de l'offre et de la demande, avec deux courbes qui se croisent au prix d'équilibre.

Chapitre 3 — L'élasticité
L'élasticité-prix de la demande mesure la sensibilité de la quantité demandée à une variation du prix. Elle se calcule ainsi :
Élasticité = variation de la quantité demandée (%) / variation du prix (%)
Un bien est dit inélastique lorsque sa demande varie peu quand le prix change, comme les carburants ou les médicaments. Un bien est élastique lorsque sa demande réagit fortement au prix, comme les voyages de loisir.
Les biens substituables sont des biens qui peuvent se remplacer l'un l'autre, comme le beurre et la margarine. Les biens complémentaires sont des biens consommés ensemble, comme une imprimante et ses cartouches.

Chapitre 4 — Inflation et pouvoir d'achat
L'inflation est la hausse durable et généralisée du niveau des prix. Elle se mesure en France par l'indice des prix à la consommation, calculé par l'INSEE.
Le pouvoir d'achat désigne la quantité de biens et de services qu'un revenu permet d'acheter. Quand les prix augmentent plus vite que les revenus, le pouvoir d'achat diminue.
La déflation est la baisse durable et généralisée du niveau des prix. Elle peut sembler favorable aux consommateurs, mais elle pousse souvent à reporter les achats et freine l'activité.
En 1973, le premier choc pétrolier provoque une forte inflation dans les pays industrialisés. En 2022, l'inflation atteint en zone euro son plus haut niveau depuis la création de la monnaie unique.
