  },
  mount(s) {
    const input = $('#ans');
    if (input) input.addEventListener('input', () => { Run.selected = input.value; this.saveDraft(Store.get('sessions', s.id), input.value); });
    const q = Store.get('questions', s.items[s.idx]);
    if (q && q.type === 'order' && s.draft[q.id] === undefined) { /* untouched order stays unanswered */ }
    this.stop();
    if (s.deadline) {
      this.timer = setInterval(() => {
        const cur = Store.get('sessions', s.id);
        if (!cur || cur.status !== 'active' || App.page !== 'session') return this.stop();
        const rem = cur.deadline - now();
        const t = $('#timer');
        if (t) { t.innerHTML = `${icon('clock', 15)} ${fmtClock(rem)}`; t.classList.toggle('urgent', rem < 60000); }
        if (rem <= 0) { this.stop(); toast('Temps écoulé : correction de ta copie.', 'warn'); gradeExam(cur); }
      }, 1000);
      App.cleanup = () => this.stop();
    }
    Keys.handler = e => {
      if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
      const cur = Store.get('sessions', s.id);
      const qq = Store.get('questions', cur.items[cur.idx]);
      if (qq && /^[1-6]$/.test(e.key)) {
        const i = +e.key - 1;
        if (qq.type === 'mcq' && i < qq.options.length) { Run.selected = i; this.saveDraft(cur, i); rerunSession(); }
        if (qq.type === 'tf' && i < 2) { Run.selected = i === 0; this.saveDraft(cur, Run.selected); rerunSession(); }
      }
      if (e.key === 'ArrowRight') Actions['exam-next']();
      if (e.key === 'ArrowLeft') Actions['exam-prev']();
    };
  }
};
function examMove(i) {
  const s = Store.get('sessions', App.params.id);
  if (!s || i < 0 || i >= s.items.length) return;
  const q = Store.get('questions', s.items[s.idx]);
  if (q && (q.type === 'short' || q.type === 'free')) { const el = $('#ans'); if (el) s.draft[q.id] = el.value; }
  s.idx = i; Store.put('sessions', s); Run.qid = null; rerunSession(); window.scrollTo(0, 0);
}
on('exam-goto', el => examMove(+el.dataset.i));
on('exam-next', () => { const s = Store.get('sessions', App.params.id); if (s) examMove(s.idx + 1); });
on('exam-prev', () => { const s = Store.get('sessions', App.params.id); if (s) examMove(s.idx - 1); });
on('exam-flag', () => { const s = Store.get('sessions', App.params.id); const id = s.items[s.idx]; s.flags[id] = !s.flags[id]; Store.put('sessions', s); rerunSession(); });
on('exam-finish', async () => {
  const s = Store.get('sessions', App.params.id);
  const q = Store.get('questions', s.items[s.idx]);
  if (q && (q.type === 'short' || q.type === 'free')) { const el = $('#ans'); if (el) s.draft[q.id] = el.value; Store.put('sessions', s); }
  const empty = s.items.filter(id => s.draft[id] === undefined || s.draft[id] === null || s.draft[id] === '').length;
  const flagged = Object.values(s.flags).filter(Boolean).length;
  if (!(await confirmModal({ title: 'Terminer et corriger ?', text: [empty ? `${plural(empty, 'question')} sans réponse.` : 'Toutes les questions ont une réponse.', flagged ? `${plural(flagged, 'question marquée', 'questions marquées')}.` : ''].join(' '), confirmLabel: 'Corriger ma copie' }))) return;
  gradeExam(s);
});
async function gradeExam(s) {
  if (s.grading) return;
  s.grading = true;
  ExamRunner.stop();
  const root = $('#main');
  if (root) root.innerHTML = `<div class="focus-page">${loadingState('Correction de ta copie…')}<p class="muted center sm" id="grade-prog"></p></div>`;
  let i = 0;
  for (const id of s.items) {
    const q = Store.get('questions', id);
    i++;
    if (!q) continue;
    const v = s.draft[id];
    const empty = v === undefined || v === null || v === '';
    const gp = $('#grade-prog'); if (gp) gp.textContent = `Question ${i} / ${s.items.length}`;
    const r = empty ? { score: 0, skipped: true } : await AI.evaluate(q, v);
    s.answers[id] = { score: r.score, value: v, feedback: r.feedback || '', by: r.by, skipped: empty, at: now() };
    recordAttempt({ q, score: r.score, ms: 0, chosen: empty ? null : v, sessionId: s.id, mode: 'exam' });
  }
  delete s.grading;
  s.status = 'active';
  Store.put('sessions', s);
  finishSession(s);
}

on('flash-grade', el => {

  const answered = Object.keys(s.answers);
  let qs = buildQuestionSet({ docIds: s.docIds, conceptIds: wrongConcepts, count: 12, excludeIds: answered });

on('confusion-explain', async el => {

on('confusion-drill', el => {
  const a = Store.get('concepts', el.dataset.a), b = Store.get('concepts', el.dataset.b);
  const qs = [];
  for (const [x, y] of [[a, b], [b, a]]) {
    const others = shuffle(Store.where('concepts', c => c.docId === x.docId && c.id !== x.id && c.id !== y.id && (c.body || c.definition))).slice(0, 2);
    const opts = shuffle([x, y, ...others]);
    const text = c => trunc(c.body || c.definition.replace(termRegex(c.name), '$1…'), 150);
    const uniq = new Set(opts.map(c => norm(text(c))));
    if (uniq.size !== opts.length) continue;
    qs.push({
      id: uid('q'), docId: x.docId, sectionId: x.sectionId, conceptId: x.id, type: 'mcq', kind: 'distinction',
      prompt: `Question de distinction : laquelle de ces descriptions correspond à « ${x.name} » (et non à « ${y.name} ») ?`,
      options: opts.map(text), optionConcepts: opts.map(c => c.id), answer: opts.indexOf(x),
      explanation: `« ${x.name} » : ${x.body || x.definition}\n\n« ${y.name} » : ${y.body || y.definition}`,
      source: { excerpt: x.excerpt, page: x.page }, origin: 'source', skill: 'comprehension', difficulty: 3, hints: [], generator: 'local', createdAt: now(), seen: 0
    });
  }
  if (!qs.length) return toast("Impossible de créer une question de distinction pour ces notions.", 'warn');
  Store.putMany('questions', qs);
  Modal.close();
  startSession({ kind: 'distinction', title: 'Distinction : ' + trunc(a.name, 20) + ' / ' + trunc(b.name, 20), questions: qs, adaptive: false });
});

let examGenCtl = null;
on('exam-start', async () => {
  if (examGenCtl) return;
  const docIds = $$('input[name=ex-doc]:checked').map(i => i.value);
  if (!docIds.length) return toast('Choisis au moins un cours.', 'warn');
  const secBoxes = $$('input[name=ex-sec]');
  const sectionIds = secBoxes.length ? secBoxes.filter(i => i.checked).map(i => i.value) : null;
  if (secBoxes.length && !sectionIds.length) return toast('Choisis au moins un chapitre.', 'warn');
  const types = $$('input[name=ex-type]:checked').map(i => i.value);
  if (!types.length) return toast('Choisis au moins un type de question.', 'warn');
  const n = +$('#ex-n').value, duration = +$('#ex-dur').value, diff = $('#ex-diff').value;
  const mock = $('#ex-mock').value === '1';
  let qs = [];
  if (mock) {
    const st = $('#ex-status'), b = $('#ex-btn');
    if (AI.canRemote()) {
      if (b) b.disabled = true;
      examGenCtl = new AbortController();
      if (st) st.innerHTML = loadingState("L'IA construit ton examen blanc… (jusqu'à une minute par cours)") + btn('Arrêter', 'exam-gen-stop', { kind: 'ghost', size: 'sm' });
      try {
        const per = Math.ceil(n / docIds.length);
        for (const id of docIds) {
          const d = Store.get('documents', id);
          let secs = Store.where('sections', s => s.docId === id).sort((a, b) => a.order - b.order);
          if (sectionIds) secs = secs.filter(s => sectionIds.includes(s.id));
          if (!secs.length) continue;
          const r = await AI.generateQuestions({ doc: d, sections: secs, count: per, types, difficulty: diff === 'mixed' ? null : +diff, instruction: "Examen blanc cohérent : couvre l'ensemble des chapitres, teste les mêmes compétences que le cours avec des formulations nouvelles.", signal: examGenCtl.signal });
          Store.putMany('questions', r.questions);
          qs.push(...r.questions);
        }
        if (st) st.innerHTML = '';
      } catch (e) {
        if (st) st.innerHTML = e && e.code === 'cancelled' ? '' : errorState(aiErrorMessage(e) + ' Revora utilise les questions jamais vues à la place.');
      } finally { examGenCtl = null; if (b) b.disabled = false; }
    }
    if (qs.length < n) {
      const unseen = buildQuestionSet({ docIds, sectionIds, count: n * 3, types, difficulty: diff, mode: 'exam', excludeIds: qs.map(q => q.id) }).filter(q => !q.seen);
      qs = qs.concat(unseen.slice(0, n - qs.length));
    }
  }
  if (qs.length < n) qs = qs.concat(buildQuestionSet({ docIds, sectionIds, count: n - qs.length, types, difficulty: diff, mode: 'exam', excludeIds: qs.map(q => q.id) }));
  if (qs.length < 3) return toast('Pas assez de questions pour ces critères (il en faut au moins 3).', 'warn');
  startExam({ kind: 'exam', title: mock ? 'Examen blanc' : 'Examen', questions: shuffle(qs).slice(0, n), duration, docIds, mock });
});
on('exam-gen-stop', () => { if (examGenCtl) examGenCtl.abort(); });

const MistState = { tab: 'gaps' };
Pages.mistakes = {
  render() {
    const docIds = activeDocIds();
    const concepts = Store.where('concepts', c => docIds.includes(c.docId));
    const evaluated = concepts.map(c => ({ c, info: Mastery.info(c.id) })).filter(x => x.info);
    const tab = MistState.tab;
    const errsByConcept = new Map();
    for (const a of Store.where('attempts', a => a.score === 0 && docIds.includes(a.docId))) {
      const k = a.conceptId || 'none';
      const e = errsByConcept.get(k) || { n: 0, last: 0, qids: new Set() };
      e.n++; e.last = Math.max(e.last, a.at); if (a.qid) e.qids.add(a.qid);
      errsByConcept.set(k, e);
    }
    const conf = Mastery.confusions().filter(p => docIds.includes((Store.get('concepts', p.a) || {}).docId));
    const illusions = evaluated.filter(x => x.info.highConfWrong >= 2);
    let body = '';
    if (tab === 'gaps') {
      const list = evaluated.sort((a, b) => a.info.mastery - b.info.mastery);
      body = list.length ? `<ul class="gap-list">${list.map(({ c, info }) => `<li><button class="gap-item" data-act="concept" data-id="${c.id}">
        <span class="gi-dot lvl-${Mastery.level(info.mastery)}" aria-hidden="true"></span>

        : emptyState({ ic: 'target', title: 'Pas encore de lacunes mesurées', text: 'Réponds à quelques quiz : Revora calcule ta maîtrise notion par notion.', actions: btn('Révision rapide', 'quick', { data: { min: 5 }, ic: 'play' }) });
    } else if (tab === 'errors') {
      const list = [...errsByConcept.entries()].map(([id, e]) => ({ c: Store.get('concepts', id), e })).filter(x => x.c).sort((a, b) => b.e.n - a.e.n);
      body = list.length ? `<ul class="gap-list">${list.map(({ c, e }) => `<li><button class="gap-item" data-act="concept" data-id="${c.id}">
        <span class="gi-dot lvl-low" aria-hidden="true"></span>

    } else {
      body = `${conf.length ? conf.map(p => { const a = Store.get('concepts', p.a), b = Store.get('concepts', p.b); return `<div class="confusion card"><p>Tu confonds régulièrement <strong>${esc(a.name)}</strong> et <strong>${esc(b.name)}</strong> (${plural(p.count, 'fois')}).</p><div class="row wrap">${btn('Voir la différence', 'confusion-explain', { kind: 'ghost', ic: 'eye', data: { a: a.id, b: b.id } })}${btn('Question de distinction', 'confusion-drill', { kind: 'outline', ic: 'target', data: { a: a.id, b: b.id } })}</div></div>`; }).join('') : emptyState({ ic: 'link', title: 'Aucune confusion détectée', text: 'Quand tu choisis plusieurs fois une notion à la place d\'une autre, Revora te le signale ici.' })}
      ${illusions.length ? `<section class="card"><h3>${icon('alert', 16)} Illusion de maîtrise</h3><p class="muted sm">Notions où tu t'es trompé en étant sûr de toi.</p><div class="concept-chips">${illusions.map(({ c }) => `<button class="cchip lvl-low" data-act="concept" data-id="${c.id}">${esc(c.name)}</button>`).join('')}</div></section>` : ''}`;

  }

    const sessions = Store.where('sessions', s => s.status === 'done').sort((a, b) => b.endedAt - a.endedAt);
    const stats = [...Mastery.stats().values()];
    const mastered = stats.filter(s => s.mastery >= 0.8).length, weak = stats.filter(s => s.mastery < 0.5).length;
    const dims = Mastery.dimensions();
    const st = prefs().streak || {};
    // last 14 days

        <div class="tile"><span class="tile-v tnum">${atts.length}</span><span class="tile-l">réponses</span></div>

          <p class="muted xs">Indicateurs pédagogiques par compétence testée (90 derniers jours, 3 réponses minimum). « Confiance » mesure l'accord entre ton assurance et tes résultats.</p>

        </section>

function activityChart(days) {
  const W = 560, H = 190, pl = 30, pb = 26, pt = 12;
  const max = Math.max(4, ...days.map(d => d.n));
  const step = Math.ceil(max / 4);
  const top = step * 4;
  const bw = (W - pl - 8) / days.length;
  const y = v => pt + (H - pt - pb) * (1 - v / top);
  let grid = '';
  for (let v = 0; v <= top; v += step) grid += `<line x1="${pl}" x2="${W - 4}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" class="ch-grid"/><text x="${pl - 6}" y="${(y(v) + 4).toFixed(1)}" text-anchor="end" class="ch-lbl">${v}</text>`;
  const bars = days.map((d, i) => {
    const x = pl + i * bw + bw * 0.18, w = bw * 0.64;
    const h = (H - pt - pb) * d.n / top;
    const lbl = new Date(d.start).toLocaleDateString('fr-FR', { weekday: 'narrow' });
    const today = i === days.length - 1;
    return `${d.n ? `<rect x="${x.toFixed(1)}" y="${(y(d.n)).toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(1, h).toFixed(1)}" rx="4" class="ch-bar${today ? ' today' : ''}"><title>${fmtDate(d.start)} : ${d.n} réponses${d.rate != null ? ', ' + Math.round(d.rate * 100) + ' % de réussite' : ''}</title></rect>` : ''}<text x="${(x + w / 2).toFixed(1)}" y="${H - 8}" text-anchor="middle" class="ch-lbl${today ? ' strong' : ''}">${lbl}</text>`;
  }).join('');
  return `<div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Nombre de réponses par jour sur 14 jours">${grid}${bars}</svg></div>`;
}

Pages.planning = {

    if (!plan) return this.form(docs);
    const today = startOfDay();
    const late = Planner.late(plan);

    const left = Math.round((plan.examDate - today) / DAY);

      <div class="plan-prog">${progressBar(done / Math.max(1, all.length), 'orange', 'Avancement du programme')}<span class="sm tnum">${done} / ${all.length} tâches</span></div>

        const isToday = d.date === today, past = d.date < today;
        return `<li class="pday${isToday ? ' today' : ''}${past ? ' past' : ''}">
          <div class="pday-head"><strong>Jour ${i + 1}</strong><span class="muted sm">${new Date(d.date).toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' })}</span>${isToday ? badge("Aujourd'hui", 'blue') : ''}</div>
          <ul class="task-list">${d.tasks.map(t => `<li class="${t.done ? 'done' : ''}">
            <button class="tick" data-act="plan-toggle" data-id="${t.id}" aria-pressed="${t.done}" aria-label="${t.done ? 'Marquer comme non faite' : 'Marquer comme faite'}">${t.done ? icon('check', 14) : ''}</button>
            <span class="task-l">${esc(t.label)}</span><span class="muted xs">${t.minutes} min</span>
            ${!t.done && !past ? btn('Faire', 'plan-do', { kind: isToday ? 'primary' : 'ghost', size: 'sm', data: { id: t.id } }) : ''}</li>`).join('')}</ul></li>`;
      }).join('')}</ol>
    </div>`;
  },
  form(docs) {
    const minDate = dayKey(now() + DAY);
    return `<div class="page">
      <div class="page-head"><h1>Urgence examen</h1><p class="muted">Indique ta date d'examen et ton temps disponible : Revora répartit compréhension, flashcards, quiz, examen blanc et révision finale.</p></div>
      <section class="card">
        <form class="form-grid" data-submit="plan-create" id="plan-form">
          <label class="field"><span>Date de l'examen</span><input type="date" id="pl-date" min="${minDate}" value="${dayKey(now() + 7 * DAY)}" required></label>
          <label class="field"><span>Temps par jour</span><select id="pl-min">${[15, 20, 30, 45, 60, 90, 120].map(m => `<option value="${m}"${m === (prefs().dailyMinutes || 30) ? ' selected' : ''}>${m} min</option>`).join('')}</select></label>
          <label class="field span2"><span>Nom du programme</span><input id="pl-title" maxlength="80" placeholder="Ex. Partiel de microéconomie"></label>
          <fieldset class="field span2"><legend>Chapitres concernés</legend>
            ${docs.map(d => { const secs = Store.where('sections', s => s.docId === d.id).sort((a, b) => a.order - b.order); return `<div class="pl-doc"><label class="check strong"><input type="checkbox" data-change="pl-doc" data-doc="${d.id}" ${docs.length === 1 ? 'checked' : ''}><span><strong>${esc(trunc(d.title, 60))}</strong> <em class="muted">${plural(secs.length, 'chapitre')}</em></span></label><div class="check-grid">${secs.map(s => `<label class="check"><input type="checkbox" name="pl-sec" value="${s.id}" data-doc="${d.id}" ${docs.length === 1 ? 'checked' : ''}><span>${esc(trunc(s.title, 60))}</span></label>`).join('')}</div></div>`; }).join('')}
          </fieldset>
          <div class="row form-actions span2"><button class="btn btn-primary lg" type="submit">${icon('calendar', 18)}<span>Créer mon programme</span></button></div>
        </form>
      </section>
    </div>`;
  }
};
on('pl-doc', el => { $$(`input[name=pl-sec][data-doc="${el.dataset.doc}"]`).forEach(i => i.checked = el.checked); });
on('plan-create', () => {
  const date = $('#pl-date').value;
  if (!date) return toast("Indique la date de l'examen.", 'warn');
  const [y, m, d] = date.split('-').map(Number);
  const examDate = new Date(y, m - 1, d).getTime();
  if (examDate <= startOfDay()) return toast("La date de l'examen doit être dans le futur.", 'warn');
  const sectionIds = $$('input[name=pl-sec]:checked').map(i => i.value);
  if (!sectionIds.length) return toast('Choisis au moins un chapitre.', 'warn');
  const docIds = [...new Set(sectionIds.map(id => Store.get('sections', id).docId))];
  const plan = AI.createStudyPlan({ examDate, minutes: +$('#pl-min').value, sectionIds, docIds, title: $('#pl-title').value.trim() || 'Programme de révision' });
  Store.delWhere('plans', () => true);
  Store.put('plans', plan);
  toast('Programme créé.', 'good');
  refresh();
});
on('plan-toggle', el => {
  const plan = Store.all('plans')[0];
  for (const d of plan.days) for (const t of d.tasks) if (t.id === el.dataset.id) { t.done = !t.done; t.doneAt = t.done ? now() : null; }
  Store.put('plans', plan); refresh();
});
on('plan-recalc', () => { const plan = Store.all('plans')[0]; if (!plan) return; Store.put('plans', Planner.recalc(plan)); toast('Programme recalculé à partir d\'aujourd\'hui.', 'good'); refresh(); });
on('plan-delete', async () => {
  if (!(await confirmModal({ title: 'Supprimer le programme ?', text: 'Ta progression et tes réponses sont conservées.', confirmLabel: 'Supprimer', danger: true }))) return;
  Store.delWhere('plans', () => true); refresh();
});
on('plan-do', el => {
  const plan = Store.all('plans')[0];
  const t = plan.days.flatMap(d => d.tasks).find(x => x.id === el.dataset.id);
  if (!t) return;
  const secIds = (t.sectionIds || []).filter(id => Store.get('sections', id));
  const docIds = [...new Set(secIds.map(id => Store.get('sections', id).docId))];
  if (!secIds.length) return toast('Les chapitres de cette tâche ont été supprimés.', 'warn');
  const count = countForMinutes(t.minutes);
  if (t.type === 'learn') {
    const s = Store.get('sections', secIds[0]);
    Modal.open({
      title: t.label,
      body: `<p class="lead-sm">Pour bien comprendre ce chapitre :</p><ol class="steps-list"><li>Lis le chapitre (onglet Contenu).</li><li>Fais-toi expliquer les points difficiles par l'assistant (« Apprends-moi »).</li><li>Termine par un quiz d'entraînement adaptatif.</li></ol>`,
      footer: btn('Lire', 'plan-read', { kind: 'ghost', ic: 'text', data: { doc: s.docId, sec: s.id } }) + btn('Apprends-moi', 'plan-teach', { kind: 'ghost', ic: 'bulb', data: { doc: s.docId, sec: s.id } }) + btn('Quiz du chapitre', 'plan-quiz', { ic: 'play', data: { id: t.id } })
    });
    return;
  }
  if (t.type === 'flash') {
    const cards = Store.where('flashcards', f => secIds.includes(f.sectionId));
    if (!cards.length) return toast('Aucune flashcard pour ces chapitres.', 'warn');
    return startFlashSession({ cards: shuffle(cards).slice(0, count), title: t.label, planTask: t.id });
  }
  if (t.type === 'exam') {
    const qs = buildQuestionSet({ docIds, sectionIds: secIds, count: Math.min(30, count), mode: 'exam', types: ['mcq', 'tf', 'short', 'order'] });
    if (qs.length < 3) return toast('Pas assez de questions pour un examen blanc.', 'warn');
    return startExam({ kind: 'exam', title: 'Examen blanc (planning)', questions: qs, duration: t.minutes, docIds, planTask: t.id });
  }
  const qs = buildQuestionSet({ docIds, sectionIds: secIds, count, onlyErrors: t.type === 'errors' });
  const fallback = qs.length ? qs : buildQuestionSet({ docIds, sectionIds: secIds, count });
  if (!fallback.length) return toast('Aucune question disponible.', 'warn');
  startSession({ kind: t.type === 'lastminute' ? 'lastminute' : 'practice', title: t.label, questions: fallback, adaptive: true, docIds, planTask: t.id });
});
on('plan-read', el => { Modal.close(); go('course', { id: el.dataset.doc, tab: 'content', section: el.dataset.sec }); });
on('plan-teach', el => { Modal.close(); go('assistant', { doc: el.dataset.doc, mode: 'teach', section: el.dataset.sec }); });
on('plan-quiz', el => {
  Modal.close();
  const plan = Store.all('plans')[0];
  const t = plan.days.flatMap(d => d.tasks).find(x => x.id === el.dataset.id);
  const qs = buildQuestionSet({ sectionIds: t.sectionIds, count: countForMinutes(Math.max(5, Math.round(t.minutes / 2))) });
  if (!qs.length) return toast('Aucune question pour ce chapitre.', 'warn');
  startSession({ kind: 'practice', title: t.label, questions: qs, adaptive: true, planTask: t.id });
});

/* ---- 27-assistant.js ---- */
/* ============================================================
   pages/assistant — tutor modes, chat with the documents,
   "Vérifie que j'ai compris", connections between courses
   ============================================================ */
const ASSIST_MODES = [
  { id: 'ask', label: 'Question libre', ic: 'chat', local: true, hint: 'Pose une question sur ton cours : « Explique le chapitre 2 », « Où parle-t-on de… ? »' },
  { id: 'teach', label: 'Apprends-moi', ic: 'bulb', hint: 'Le tuteur explique pas à pas, donne un exemple puis te pose une question.' },
  { id: 'socratic', label: 'Fais-moi réfléchir', ic: 'target', hint: 'Pas de réponse toute faite : des questions pour te faire trouver.' },
  { id: 'eli', label: 'Explique-moi comme si…', ic: 'user', hint: 'Choisis le niveau d\'explication, le contenu reste fidèle au cours.' },
  { id: 'check', label: 'Vérifie que j\'ai compris', ic: 'eye', local: true, hint: 'Explique une notion avec tes mots : Revora repère ce qui est juste, oublié ou confus.' },
  { id: 'teachback', label: 'Apprends en expliquant', ic: 'mic', hint: 'Tu expliques, l\'IA joue l\'élève et te pose des questions.' },
  { id: 'oral', label: 'Oral', ic: 'mic', hint: 'Simulation d\'interrogation orale : présente, justifie, donne un exemple.' },
  { id: 'links', label: 'Connexions', ic: 'link', local: true, hint: 'Les liens entre tes différents cours.' }
];
const ELI_LEVELS = [['10 ans', "comme si j'avais 10 ans"], ['Simplement', 'simplement'], ['Universitaire', 'au niveau universitaire'], ['Professeur', 'comme un professeur']];
const AS = { scope: null, mode: 'ask', persona: 'coach', level: 'simplement', concept: null, section: null, draft: '', busy: false, ctl: null, check: null, links: [] };

function chatKey(scope, mode) { return 'chat|' + scope + '|' + mode; }
function getChat(scope, mode) { return Store.get('chats', chatKey(scope, mode)) || { id: chatKey(scope, mode), docId: scope === 'all' ? null : scope, mode, messages: [], updatedAt: 0 }; }
function scopeDocIds(scope) { return scope && scope !== 'all' ? [scope].filter(id => Store.get('documents', id)) : activeDocIds(); }

const Assistant = {
  render({ docIds, embedded } = {}) {
    const docs = Store.where('documents', d => !d.archived);
    if (!docs.length) return emptyState({ ic: 'chat', title: 'Aucun cours pour l\'assistant', text: 'Importe un cours pour discuter avec lui.', actions: btn('Importer', 'open-import', { ic: 'upload' }) });
    if (embedded) { AS.scope = docIds[0]; if (AS.mode === 'links') AS.mode = 'ask'; }
    else if (!AS.scope || (AS.scope !== 'all' && !Store.get('documents', AS.scope))) AS.scope = docs.length === 1 ? docs[0].id : 'all';
    const mode = ASSIST_MODES.find(m => m.id === AS.mode) || ASSIST_MODES[0];
    const canAI = AI.canRemote();
    const modes = ASSIST_MODES.filter(m => !(embedded && m.id === 'links'));
    return `<div class="assist${embedded ? ' embedded' : ''}">
      <div class="assist-bar">
        ${!embedded ? `<label class="select-wrap"><span class="sr">Cours</span><select id="as-scope" data-change="as-scope"><option value="all"${AS.scope === 'all' ? ' selected' : ''}>Tous mes cours</option>${docs.map(d => `<option value="${d.id}"${AS.scope === d.id ? ' selected' : ''}>${esc(trunc(d.title, 50))}</option>`).join('')}</select></label>` : ''}
        <label class="select-wrap"><span class="sr">Personnalité</span><select id="as-persona" data-change="as-persona">${Object.entries(PERSONAS).map(([k, p]) => `<option value="${k}"${AS.persona === k ? ' selected' : ''}>${esc(p.label)}</option>`).join('')}</select></label>
      </div>
      <div class="chips mode-chips" role="tablist" aria-label="Mode de l'assistant">${modes.map(m => `<button class="chip${AS.mode === m.id ? ' active' : ''}" role="tab" aria-selected="${AS.mode === m.id}" data-act="as-mode" data-m="${m.id}">${icon(m.ic, 15)}${esc(m.label)}${!m.local && !canAI ? `<em class="lock">${icon('spark', 11)}</em>` : ''}</button>`).join('')}</div>
      <p class="muted sm">${esc(mode.hint)}</p>
      ${AS.mode === 'check' ? this.checkView(docs) : AS.mode === 'links' ? this.linksView(docs) : this.chatView(mode, canAI)}
    </div>`;
  },

  chatView(mode, canAI) {
    const needsAI = !mode.local;
    if (needsAI && !canAI) {
      return `<div class="card">${aiNote(AI.whyNot())}
        <p class="sm">En attendant, ces outils fonctionnent sur cet appareil :</p>
        <div class="row wrap">${btn('Question libre (recherche locale)', 'as-mode', { kind: 'outline', ic: 'chat', data: { m: 'ask' } })}${btn('Vérifie que j\'ai compris', 'as-mode', { kind: 'outline', ic: 'eye', data: { m: 'check' } })}${btn('Fiches', 'as-fiches', { kind: 'ghost', ic: 'book' })}</div></div>`;
    }
    const chat = getChat(AS.scope, AS.mode);
    const docIds = scopeDocIds(AS.scope);
    const secs = AS.scope !== 'all' ? Store.where('sections', s => s.docId === AS.scope).sort((a, b) => a.order - b.order) : [];
    const focusable = ['teach', 'oral', 'teachback', 'eli', 'socratic'].includes(AS.mode);
    const starters = {
      ask: ['Donne-moi les 5 notions les plus importantes', 'Explique le premier chapitre', 'Interroge-moi', 'Je ne comprends pas cette partie :'],
      teach: ['Apprends-moi ce chapitre', 'Commence par les bases'],
      socratic: ['Fais-moi réfléchir sur la notion principale'],
      eli: ['Explique-moi le chapitre choisi'],
      teachback: ['Je vais t\'expliquer une notion'],
      oral: ['Commence l\'interrogation orale']
    }[AS.mode] || [];
    return `
      ${focusable && secs.length ? `<div class="assist-bar"><label class="select-wrap"><span class="sr">Chapitre</span><select id="as-sec" data-change="as-sec"><option value="">Tout le cours</option>${secs.map(s => `<option value="${s.id}"${AS.section === s.id ? ' selected' : ''}>${esc(trunc(s.title, 60))}</option>`).join('')}</select></label>
      ${AS.mode === 'eli' ? `<label class="select-wrap"><span class="sr">Niveau</span><select id="as-level" data-change="as-level">${ELI_LEVELS.map(([l, v]) => `<option value="${attr(v)}"${AS.level === v ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select></label>` : ''}</div>`
        : AS.mode === 'eli' ? `<div class="assist-bar"><label class="select-wrap"><span class="sr">Niveau</span><select id="as-level" data-change="as-level">${ELI_LEVELS.map(([l, v]) => `<option value="${attr(v)}"${AS.level === v ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select></label></div>` : ''}
      ${AS.mode === 'ask' && !canAI ? `<div class="note info">${icon('shield', 15)}<span>Mode local : Revora cherche les passages de ton cours les plus proches de ta question, sans IA.</span></div>` : ''}
      <div class="thread" id="thread" aria-live="polite">
        ${chat.messages.length ? chat.messages.map(m => this.bubble(m)).join('') : `<div class="thread-empty">${logoSVG(44)}<p>${esc(AS.mode === 'ask' ? 'Pose ta question sur ' + (AS.scope === 'all' ? 'tes cours' : 'ce cours') + '.' : 'Choisis un point de départ :')}</p><div class="row wrap center">${starters.map(s => `<button class="chip" data-act="as-starter" data-t="${attr(s)}">${esc(s)}</button>`).join('')}</div></div>`}
      </div>
      <form class="composer" data-submit="as-send" id="as-form">
        <label class="sr" for="as-input">Ton message</label>
        <textarea id="as-input" rows="2" maxlength="3000" placeholder="${attr(AS.mode === 'teachback' ? 'Explique la notion comme à un élève…' : AS.mode === 'oral' ? 'Ta réponse orale (écrite ici)…' : 'Écris ta question…')}" ${AS.busy ? 'disabled' : ''}>${esc(AS.draft)}</textarea>
        <div class="composer-actions">
          ${chat.messages.length ? btn('', 'as-clear', { kind: 'ghost', ic: 'trash', size: 'sm', title: 'Effacer la conversation' }) : '<span></span>'}
          ${AS.busy ? btn('Arrêter', 'as-stop', { kind: 'ghost', size: 'sm' }) : ''}
          <button class="btn btn-primary" type="submit" ${AS.busy ? 'disabled' : ''}>${icon('arrow', 18)}<span>Envoyer</span></button>
        </div>
      </form>
      <p class="muted xs">${canAI ? `${icon('shield', 12)} Les extraits utiles de ton cours sont envoyés à Claude avec ton compte pour répondre. Les réponses indiquent leur base : document ou connaissances générales.` : ''}</p>`;
  },

  bubble(m) {
    if (m.role === 'user') return `<div class="msg user"><div class="msg-body">${esc(m.content).replace(/\n/g, '<br>')}</div></div>`;
    const text = String(m.content || '').replace(/\n?\s*Base\s*:\s*(document \+ connaissances générales|document|connaissances générales)\s*\.?\s*$/i, '');
    const basis = m.basis === 'source' ? badge('Basé sur ton document', 'blue', 'book') : m.basis === 'mixed' ? badge('Document + connaissances générales', 'orange', 'spark') : m.basis === 'external' ? badge('Connaissance générale', 'orange', 'spark') : m.basis === 'none' ? badge('Rien trouvé dans le document', 'neutral') : '';
    const srcs = (m.sources || []).slice(0, 5).map(s => { const d = Store.get('documents', s.docId); return `<span class="src-chip">${icon('book', 12)} ${esc(trunc(d ? d.title : s.title || '', 30))}${s.section ? ' · ' + esc(trunc(s.section, 34)) : ''}${s.page ? ` · ${d && d.unit === 'diapo' ? 'diapo' : 'p.'} ${s.page}` : ''}</span>`; }).join('');
    return `<div class="msg bot${m.error ? ' err' : ''}"><div class="msg-av">${logoSVG(28, { title: false })}</div><div class="msg-body">${m.error ? `<p>${esc(m.content)}</p>` : md(text)}${basis || srcs ? `<div class="msg-meta">${basis}${m.by === 'local' ? badge('Recherche locale', 'neutral') : ''}${srcs ? `<div class="src-row">${srcs}</div>` : ''}</div>` : ''}${m.partial ? '<p class="xs muted">Réponse interrompue.</p>' : ''}</div></div>`;
  },

  checkView(docs) {
    const scopeDocs = AS.scope === 'all' ? docs.map(d => d.id) : [AS.scope];
    const concepts = Store.where('concepts', c => scopeDocs.includes(c.docId)).sort((a, b) => b.importance - a.importance);
    if (!concepts.length) return emptyState({ ic: 'eye', title: 'Aucune notion repérée', text: 'Revora a besoin de notions identifiées dans ton cours.' });
    if (!AS.concept || !concepts.some(c => c.id === AS.concept)) AS.concept = concepts[0].id;
    const c = Store.get('concepts', AS.concept);
    const r = AS.check && AS.check.conceptId === c.id ? AS.check : null;
    return `<section class="card">
      <form class="form-grid" data-submit="as-check" id="check-form">
        <label class="field span2"><span>Notion à expliquer</span><select id="ck-concept" data-change="as-concept">${concepts.slice(0, 120).map(x => `<option value="${x.id}"${x.id === c.id ? ' selected' : ''}>${esc(trunc(x.name, 60))}</option>`).join('')}</select></label>
        <label class="field span2"><span>Explique « ${esc(c.name)} » avec tes propres mots, sans regarder le cours</span><textarea id="ck-text" rows="6" maxlength="3000" placeholder="Qu'est-ce que c'est ? À quoi ça sert ? Un exemple ?">${esc(AS.draft)}</textarea></label>
        <div class="row wrap form-actions span2"><button class="btn btn-primary" type="submit" ${AS.busy ? 'disabled' : ''}>${icon('eye', 18)}<span>Analyser mon explication</span></button>${!AI.canRemote() ? `<span class="muted xs">Analyse locale approximative (mots-clés du cours). ${esc(AI.whyNot())}</span>` : ''}</div>
      </form>
      <div id="ck-out">${AS.busy ? loadingState('Analyse de ton explication…') : r ? this.checkResult(r, c) : ''}</div>
    </section>`;
  },
  checkResult(r, c) {
    const lvl = { bonne: ['good', 'Compréhension : bonne'], partielle: ['warn', 'Compréhension : partielle'], 'à revoir': ['bad', 'Compréhension : à revoir'] }[r.level] || ['neutral', 'Compréhension'];
    const list = (title, arr, sym, cls) => arr && arr.length ? `<div class="ck-block ${cls}"><strong>${title}</strong><ul>${arr.map(x => `<li><span aria-hidden="true">${sym}</span> ${esc(x)}</li>`).join('')}</ul></div>` : '';
    return `<div class="ck-result">
      <div class="row wrap gap-s">${badge(lvl[1], lvl[0])}${r.by === 'ia' ? badge("Analyse de l'IA", 'orange', 'spark') : badge('Analyse locale approximative', 'neutral')}</div>
      ${list('Tu as correctement compris', r.understood, '✓', 'ok')}
      ${list('À améliorer', r.improve, '•', 'mid')}
      ${list('Tu as oublié', r.missing, '•', 'ko')}
      ${list('Confusions possibles', r.confusions, '!', 'ko')}
      ${r.reference ? `<div class="def-box"><strong>Rappel du cours :</strong> ${esc(r.reference)}</div>` : ''}
      ${sourceRef(c.docId, { excerpt: c.excerpt, page: c.page }, c.sectionId)}
      <div class="row wrap">${btn("S'entraîner sur cette notion", 'concept-train', { ic: 'play', data: { id: c.id } })}${btn('Réessayer', 'as-check-reset', { kind: 'ghost', ic: 'refresh' })}</div>
    </div>`;
  },

  linksView(docs) {
    if (docs.length < 2) return `<div class="card">${emptyState({ ic: 'link', title: 'Il faut au moins deux cours', text: 'Importe un deuxième cours pour découvrir les liens entre eux.', actions: btn('Importer', 'open-import', { ic: 'upload' }) })}</div>`;
    const a = AS.linkA && Store.get('documents', AS.linkA) ? AS.linkA : docs[0].id;
    const b = AS.linkB && Store.get('documents', AS.linkB) && AS.linkB !== a ? AS.linkB : (docs.find(d => d.id !== a) || docs[1]).id;
    AS.linkA = a; AS.linkB = b;
    const links = findLinks(a, b);
    const da = Store.get('documents', a), db = Store.get('documents', b);
    return `<section class="card">
      <div class="form-grid">
        <label class="field"><span>Premier cours</span><select id="lk-a" data-change="as-link">${docs.map(d => `<option value="${d.id}"${d.id === a ? ' selected' : ''}>${esc(trunc(d.title, 50))}</option>`).join('')}</select></label>
        <label class="field"><span>Deuxième cours</span><select id="lk-b" data-change="as-link">${docs.filter(d => d.id !== a).map(d => `<option value="${d.id}"${d.id === b ? ' selected' : ''}>${esc(trunc(d.title, 50))}</option>`).join('')}</select></label>
      </div>
      ${links.length ? `<p class="sm"><strong>${plural(links.length, 'notion commune', 'notions communes')}</strong> trouvée${links.length > 1 ? 's' : ''} dans le texte des deux cours :</p>
        <ul class="link-list">${links.slice(0, 12).map(l => `<li><div class="lk-row"><span class="lk-doc">${esc(trunc(da.title, 28))}</span>${icon('arrow', 14)}<strong>${esc(l.name)}</strong>${icon('arrow', 14)}<span class="lk-doc">${esc(trunc(db.title, 28))}</span></div>
          <div class="lk-ex"><blockquote>${esc(trunc(l.exA, 200))}</blockquote><blockquote>${esc(trunc(l.exB, 200))}</blockquote></div></li>`).join('')}</ul>`
        : `<p class="muted">Aucune notion commune n'a été trouvée mot pour mot dans les deux cours.</p>`}

      ta.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); const f = $('#as-form'); if (f) f.requestSubmit(); } });

function findLinks(a, b) {
  const ca = Store.where('concepts', c => c.docId === a), cb = Store.where('concepts', c => c.docId === b);
  const textOf = id => Store.where('sections', s => s.docId === id).map(s => s.text).join('\n');
  const ta = textOf(a), tb = textOf(b);
  const na = norm(ta), nb = norm(tb);
  const seen = new Set(), out = [];
  for (const c of [...ca, ...cb]) {
    const k = norm(c.name);
    if (k.length < 4 || seen.has(k)) continue;
    seen.add(k);
    if (!na.includes(k) || !nb.includes(k)) continue;
    const ex = t => TextKit.sentences(t).find(s => norm(s).includes(k)) || '';
    out.push({ name: c.name, exA: ex(ta), exB: ex(tb) });
  }
  return out;
}

async function sendAssistant(text) {
  if (AS.busy) return;
  const mode = AS.mode;
  const scope = AS.scope;
  const chat = getChat(scope, mode);
  const docIds = scopeDocIds(scope);
  if (!docIds.length) return toast('Aucun cours actif.', 'warn');
  let content = text;
  if (mode === 'eli') content = `Explique-moi ${AS.level} : ${text}`;
  chat.messages.push({ role: 'user', content, at: now() });
  chat.updatedAt = now();
  Store.put('chats', chat);
  AS.draft = ''; AS.busy = true;
  AS.ctl = new AbortController();
  rerenderAssistant();
  const th = $('#thread');
  if (th) { th.insertAdjacentHTML('beforeend', `<div class="msg bot" id="stream-msg"><div class="msg-av">${logoSVG(28, { title: false })}</div><div class="msg-body" id="stream">${loadingState(AI.canRemote() ? 'Réflexion…' : 'Recherche dans ton cours…')}</div></div>`); th.scrollTop = th.scrollHeight; }
  try {
    const r = await AI.chat({
      docIds, mode, persona: AS.persona, level: AS.level, focusSection: AS.section,
      messages: chat.messages.map(m => ({ role: m.role, content: m.content })), signal: AS.ctl.signal,
      onText: t => { const s = $('#stream'); if (s) { s.innerHTML = md(t); const th2 = $('#thread'); if (th2) th2.scrollTop = th2.scrollHeight; } }
    });
    chat.messages.push({ role: 'assistant', content: r.text, sources: r.sources, basis: r.basis, by: r.by, at: now() });
  } catch (e) {
    if (e && e.code === 'cancelled') { if (e.text) chat.messages.push({ role: 'assistant', content: e.text, partial: true, by: 'ia', at: now() }); }
    else chat.messages.push({ role: 'assistant', content: aiErrorMessage(e), error: true, at: now() });
  } finally {
    if (chat.messages.length > 60) chat.messages = chat.messages.slice(-60);
    chat.updatedAt = now();
    Store.put('chats', chat);
    AS.busy = false; AS.ctl = null;
    rerenderAssistant();
  }
}
function rerenderAssistant() {
  if (App.page !== 'assistant' && !(App.page === 'course' && App.params.tab === 'chat')) return;
  refresh();
  const ta = $('#as-input'); if (ta && !AS.busy) ta.focus({ preventScroll: true });
}

});

function applyTextScale() {
  const s = +prefs().textScale || 1;
  document.documentElement.style.setProperty('--scale', String(clamp(s, 0.9, 1.3)));
}

function remindIfDue() {
  const p = prefs();
  if (!p.onboarded || p.reminders === false) return;
  const today = dayKey();
  if (p.lastReminder === today) return;
  const due = dueCounts();
  const plan = Store.all('plans')[0];
  const todayTasks = plan ? ((plan.days.find(d => d.date === startOfDay()) || { tasks: [] }).tasks.filter(t => !t.done).length) : 0;
  let msg = '';
  if (due.total) msg = `Tu as ${plural(due.total, 'élément')} à revoir aujourd'hui.`;
  if (todayTasks) msg += (msg ? ' ' : '') + `${plural(todayTasks, 'tâche')} de ton programme t'attend${todayTasks > 1 ? 'ent' : ''}.`;
  if (!msg) return;
  setPrefs({ lastReminder: today });
  setTimeout(() => toast(msg, 'info', 6000), 900);
}

window.addEventListener('error', e => { console.error('[Revora]', e.error || e.message); });
window.addEventListener('unhandledrejection', e => {
  console.error('[Revora]', e.reason);
  if (e.reason && e.reason.code === 'cancelled') return;
  toast('Une opération n\'a pas abouti. Réessaie.', 'bad');
});

async function boot() {
  try {
    await Store.init();
  } catch (e) {
    console.error(e);
  }
  Net.init();
  Caps.init();
  Enrich.recover();
  applyTheme();
  applyTextScale();
  let lastStatus = Net.status();
  Net.onChange(() => {
    const s = Net.status();
    updateStatus();
    if (s !== lastStatus) {
      if (lastStatus !== 'offline' && s === 'offline') toast('Hors ligne — tes données restent disponibles sur cet appareil.', 'info');
      if (lastStatus === 'offline' && s !== 'offline') toast('Connexion retrouvée.', 'good');
      lastStatus = s;
      if (!AS.busy && !(App.page === 'session')) refreshSoon();
    }
  });
  // hash shortcuts: #cours, #reviser, #progression, #planning, #assistant, #parametres
  const H = { cours: 'library', reviser: 'review', progression: 'progress', planning: 'planning', assistant: 'assistant', parametres: 'settings', erreurs: 'mistakes', quiz: 'quiz', flashcards: 'flash' };
  let first = prefs().onboarded ? 'home' : 'onboarding';
  try { const h = (location.hash || '').slice(1); if (prefs().onboarded && H[h]) first = H[h]; } catch (e) { }
  go(first, {}, { replace: true });
  remindIfDue();
  Cloud.init();
  // keep "due" counters fresh when the day changes or items come due
  setInterval(() => { if (App.page === 'home' || App.page === 'review') refreshSoon(); }, 5 * 60 * 1000);
}
boot();
