/* ============================================================
   features/learning — spaced repetition, mastery, priorities,
   adaptive sessions, confusion detection, study planner
   ============================================================ */
const SRS = {
  /* q: 0..5 (0-2 = lapse). ctx: {ms, importance} */
  update(item, q, ctx = {}) {
    const s = item.srs ? { ...item.srs } : { ease: 2.5, interval: 0, reps: 0, lapses: 0, due: 0, last: 0 };
    if (q < 3) {
      s.lapses++; s.reps = 0; s.interval = 10 / 1440; // back in ~10 minutes
      s.ease = Math.max(1.3, s.ease - 0.2);
    } else {
      s.reps++;
      s.interval = s.reps === 1 ? 1 : s.reps === 2 ? 3 : Math.max(1, s.interval) * s.ease;
      s.ease = Math.max(1.3, s.ease + (0.1 - (5 - q) * (0.08 + (5 - q) * 0.02)));
      const imp = ctx.importance ?? 0.5;
      s.interval *= 1 - 0.25 * imp;                     // important notions come back sooner
      if (ctx.ms && ctx.ms > 25000) s.interval *= 0.8;  // slow answer → less solid
      if (s.lapses >= 3) s.interval = Math.min(s.interval, 7);
      s.interval = Math.min(s.interval, 180);
    }
    s.last = now(); s.due = now() + s.interval * DAY;
    item.srs = s;
    return s;
  },
  gradeQuestion(score, confidence, ms) {
    if (score >= 1) {
      if (confidence === 1) return 3;           // right but guessing → review soon
      if (confidence === 2) return 4;
      return ms && ms < 12000 ? 5 : 4;
    }
    if (score >= 0.5) return 3;
    return confidence >= 3 ? 0 : 1;
  },
  gradeFlash(g, ms) { return g === 'know' ? (ms > 15000 ? 4 : 5) : g === 'almost' ? 3 : 1; },
  isDue(item, t = now()) { return item.srs && item.srs.due <= t; }
};

const Mastery = {
  _cache: null, _stamp: -1,
  _version: 0,
  bump() { this._version++; },
  stats() {
    if (this._cache && this._stamp === this._version) return this._cache;
    const byConcept = new Map();
    const atts = Store.all('attempts').sort((a, b) => b.at - a.at);
    for (const a of atts) {
      if (!a.conceptId) continue;
      let s = byConcept.get(a.conceptId);
      if (!s) { s = { m: 0, w: 0, n: 0, errors: 0, recentErrors: 0, last: 0, highConfWrong: 0, lowConfRight: 0 }; byConcept.set(a.conceptId, s); }
      const weight = Math.pow(0.8, s.n);
      s.m += a.score * weight; s.w += weight; s.n++;
      if (a.score === 0) { s.errors++; if (now() - a.at < 14 * DAY) s.recentErrors++; }
      if (a.confidence >= 3 && a.score === 0) s.highConfWrong++;
      if (a.confidence && a.confidence <= 2 && a.score === 1) s.lowConfRight++;
      if (a.at > s.last) s.last = a.at;
    }
    for (const s of byConcept.values()) s.mastery = (s.m + 0.3) / (s.w + 1); // shrink toward a prior when few answers
    this._cache = byConcept; this._stamp = this._version;
    return byConcept;
  },
  of(conceptId) { const s = this.stats().get(conceptId); return s ? s.mastery : null; },
  info(conceptId) { return this.stats().get(conceptId) || null; },
  level(m) { return m == null ? 'none' : m >= 0.8 ? 'good' : m >= 0.5 ? 'mid' : 'low'; },
  label(m) { return m == null ? 'Pas encore évaluée' : m >= 0.8 ? 'Maîtrisée' : m >= 0.5 ? 'En cours' : 'À revoir'; },
  priority(c) {
    const s = this.info(c.id);
    const m = s ? s.mastery : 0.4;
    const overdue = s && s.last ? Math.min(1, (now() - s.last) / (14 * DAY)) : 0.5;
    const errFreq = s ? Math.min(1, s.recentErrors / 3) : 0;
    return (c.importance || 0.5) * 0.4 + (1 - m) * 0.4 + errFreq * 0.12 + overdue * 0.08;
  },
  priorityLabel(p) { return p >= 0.62 ? 'Élevée' : p >= 0.45 ? 'Moyenne' : 'Faible'; },
  reason(c) {
    const s = this.info(c.id);
    if (!s) return 'Pas encore travaillée' + (c.importance >= 0.6 ? ' et importante dans le cours' : '');
    if (s.recentErrors >= 2) return `Tu t'es trompé ${s.recentErrors} fois récemment`;
    if (s.highConfWrong >= 1) return 'Erreur alors que tu étais sûr de toi';
    if (s.mastery < 0.5) return `Maîtrise estimée à ${Math.round(s.mastery * 100)} %`;
    if (s.last && now() - s.last > 10 * DAY) return 'Pas revue depuis ' + Math.round((now() - s.last) / DAY) + ' jours';
    return 'À consolider';
  },
  docMastery(docId) {
    const cs = Store.where('concepts', c => c.docId === docId);
    if (!cs.length) return null;
    let sum = 0, n = 0;
    for (const c of cs) { const m = this.of(c.id); if (m != null) { sum += m; n++; } }
    return n ? { value: sum / n, evaluated: n, total: cs.length } : { value: null, evaluated: 0, total: cs.length };
  },
  sectionMastery(sectionId) {
    const cs = Store.where('concepts', c => c.sectionId === sectionId);
    let sum = 0, n = 0;
    for (const c of cs) { const m = this.of(c.id); if (m != null) { sum += m; n++; } }
    return n ? sum / n : null;
  },
  /* pedagogical indicators by skill (not a scientific measure) */
  dimensions(docId) {
    const atts = Store.where('attempts', a => (!docId || a.docId === docId) && now() - a.at < 90 * DAY);
    const dims = { comprehension: [0, 0], memorisation: [0, 0], application: [0, 0], raisonnement: [0, 0] };
    let calib = 0, calibN = 0;
    for (const a of atts) {
      const k = a.kind === 'f' ? 'memorisation' : a.skill;
      if (dims[k]) { dims[k][0] += a.score; dims[k][1]++; }
      if (a.confidence) { calibN++; if ((a.confidence >= 3 && a.score >= 1) || (a.confidence <= 2 && a.score < 1)) calib++; }
    }
    const out = {};
    for (const [k, [s, n]] of Object.entries(dims)) out[k] = n >= 3 ? { value: s / n, n } : { value: null, n };
    out.confiance = calibN >= 3 ? { value: calib / calibN, n: calibN } : { value: null, n: calibN };
    return out;
  },
  /* pairs of notions the learner mixes up (from wrong MCQ choices / swapped T/F) */
  confusions(docId) {
    const pairs = new Map();
    for (const a of Store.where('attempts', a => a.kind === 'q' && a.score === 0 && a.confusedWith && (!docId || a.docId === docId))) {
      const key = [a.conceptId, a.confusedWith].sort().join('|');
      const p = pairs.get(key) || { a: a.conceptId, b: a.confusedWith, count: 0, last: 0 };
      p.count++; p.last = Math.max(p.last, a.at);
      pairs.set(key, p);
    }
    return [...pairs.values()].filter(p => p.count >= 2 && Store.get('concepts', p.a) && Store.get('concepts', p.b)).sort((x, y) => y.count - x.count);
  }
};

/* ---------- Recording answers (saved immediately) ---------- */
function recordAttempt({ q, score, confidence, ms, hintsUsed, chosen, sessionId, mode }) {
  let confusedWith = null;
  if (score === 0 && q.type === 'mcq' && q.optionConcepts && typeof chosen === 'number') confusedWith = q.optionConcepts[chosen] !== q.conceptId ? q.optionConcepts[chosen] : null;
  if (score === 0 && q.type === 'tf' && q.distractorConcept && chosen === true) confusedWith = q.distractorConcept;
  const a = {
    id: uid('a'), kind: 'q', qid: q.id, docId: q.docId, conceptId: q.conceptId, sectionId: q.sectionId, sessionId,
    score, confidence: confidence || null, ms, hintsUsed: hintsUsed || 0, chosen: typeof chosen === 'object' ? null : chosen,
    skill: q.skill, difficulty: q.difficulty, mode, at: now(), confusedWith
  };
  Store.put('attempts', a);
  const c = q.conceptId ? Store.get('concepts', q.conceptId) : null;
  q.seen = (q.seen || 0) + 1; q.lastSeen = now();
  if (mode !== 'exam' || score < 1) SRS.update(q, SRS.gradeQuestion(score, confidence, ms), { ms, importance: c ? c.importance : 0.5 });
  Store.put('questions', q);
  Mastery.bump(); touchStreak();
  return a;
}
function recordFlash({ f, grade, ms, sessionId }) {
  const score = grade === 'know' ? 1 : grade === 'almost' ? 0.5 : 0;
  const a = { id: uid('a'), kind: 'f', fid: f.id, docId: f.docId, conceptId: f.conceptId, sectionId: f.sectionId, sessionId, score, ms, grade, skill: 'memorisation', at: now() };
  Store.put('attempts', a);
  const c = f.conceptId ? Store.get('concepts', f.conceptId) : null;
  SRS.update(f, SRS.gradeFlash(grade, ms), { ms, importance: c ? c.importance : 0.5 });
  Store.put('flashcards', f);
  Mastery.bump(); touchStreak();
}
function touchStreak() {
  const p = prefs();
  const today = dayKey();
  const st = p.streak || { count: 0, best: 0, last: null };
  if (st.last === today) return;
  const yesterday = dayKey(now() - DAY);
  st.count = st.last === yesterday ? st.count + 1 : 1;
  st.best = Math.max(st.best || 0, st.count);
  st.last = today;
  setPrefs({ streak: st });
}
function currentStreak() {
  const st = prefs().streak || {};
  if (!st.last) return 0;
  return st.last === dayKey() || st.last === dayKey(now() - DAY) ? st.count : 0;
}

/* ---------- Session builder ---------- */
function activeDocIds() { return Store.where('documents', d => !d.archived).map(d => d.id); }

function buildQuestionSet({ docIds, count = 10, sectionIds, conceptIds, types, difficulty, mode = 'practice', onlyErrors, excludeIds } = {}) {
  docIds = docIds && docIds.length ? docIds : activeDocIds();
  const allow = new Set(types && types.length ? types : prefs().qTypes);
  let pool = Store.where('questions', q => docIds.includes(q.docId) && allow.has(q.type) && !q.disabled);
  if (sectionIds && sectionIds.length) pool = pool.filter(q => sectionIds.includes(q.sectionId));
  if (conceptIds && conceptIds.length) pool = pool.filter(q => conceptIds.includes(q.conceptId));
  if (excludeIds) pool = pool.filter(q => !excludeIds.includes(q.id));
  if (onlyErrors) {
    const wrong = new Set(Store.where('attempts', a => a.kind === 'q' && a.score < 1).map(a => a.qid));
    const weakConcepts = new Set([...Mastery.stats()].filter(([, s]) => s.mastery < 0.6).map(([id]) => id));
    pool = pool.filter(q => wrong.has(q.id) || weakConcepts.has(q.conceptId));
  }
  if (difficulty && difficulty !== 'adaptive' && difficulty !== 'mixed') {
    const d = +difficulty;
    const near = pool.filter(q => Math.abs(q.difficulty - d) <= (d >= 3 ? 1 : 0));
    if (near.length >= Math.min(count, 4)) pool = near;
  }
  const t = now();
  const scored = pool.map(q => {
    const c = q.conceptId ? Store.get('concepts', q.conceptId) : null;
    const m = c ? Mastery.of(c.id) : null;
    let s = Math.random() * 0.6;
    if (mode === 'exam') s += Math.random();
    else {
      if (SRS.isDue(q, t)) s += 3;
      if (!q.seen) s += 1.1;
      s += (1 - (m ?? 0.45)) * 2 + (c ? c.importance : 0.4);
      s -= Math.min(2, (q.seen || 0) * 0.35);
      if (q.lastSeen && t - q.lastSeen < 10 * 60e3) s -= 3; // anti-repetition
    }
    return { q, s };
  }).sort((a, b) => b.s - a.s);
  // spread concepts and types
  const out = [], usedConcepts = new Map();
  for (const { q } of scored) {
    if (out.length >= count) break;
    const n = usedConcepts.get(q.conceptId) || 0;
    if (q.conceptId && n >= 2 && scored.length > count * 1.5) continue;
    usedConcepts.set(q.conceptId, n + 1);
    out.push(q);
  }
  if (out.length < count) for (const { q } of scored) { if (out.length >= count) break; if (!out.includes(q)) out.push(q); }
  // avoid the same concept twice in a row
  for (let i = 1; i < out.length; i++) {
    if (out[i].conceptId && out[i].conceptId === out[i - 1].conceptId) {
      const j = out.findIndex((x, k) => k > i && x.conceptId !== out[i].conceptId);
      if (j > 0) [out[i], out[j]] = [out[j], out[i]];
    }
  }
  return mode === 'exam' ? out : out;
}
function countForMinutes(min) { return clamp(Math.round(min * 60 / 40), 3, 60); }

function dueCounts(docIds) {
  docIds = docIds || activeDocIds();
  const t = now();
  const q = Store.count('questions', x => docIds.includes(x.docId) && SRS.isDue(x, t) && !x.disabled);
  const f = Store.count('flashcards', x => docIds.includes(x.docId) && SRS.isDue(x, t));
  return { q, f, total: q + f };
}

/* ---------- Badges (earned from real activity) ---------- */
function badges() {
  const atts = Store.count('attempts');
  const docs = Store.count('documents', d => !d.sample);
  const mastered = [...Mastery.stats().values()].filter(s => s.mastery >= 0.8).length;
  const exams = Store.count('sessions', s => s.kind === 'exam' && s.status === 'done');
  const best = (prefs().streak || {}).best || 0;
  return [
    { id: 'first', label: 'Premier cours importé', done: docs >= 1 },
    { id: 'a50', label: '50 réponses', done: atts >= 50, progress: Math.min(1, atts / 50) },
    { id: 'a250', label: '250 réponses', done: atts >= 250, progress: Math.min(1, atts / 250) },
    { id: 's3', label: 'Série de 3 jours', done: best >= 3, progress: Math.min(1, best / 3) },
    { id: 's7', label: 'Série de 7 jours', done: best >= 7, progress: Math.min(1, best / 7) },
    { id: 'm10', label: '10 notions maîtrisées', done: mastered >= 10, progress: Math.min(1, mastered / 10) },
    { id: 'exam', label: 'Premier examen terminé', done: exams >= 1 }
  ];
}

/* ---------- Study planner ("Urgence examen") ---------- */
const Planner = {
  build({ examDate, minutes, sectionIds, docIds, title }) {
    const start = startOfDay();
    const end = startOfDay(examDate);
    let days = Math.round((end - start) / DAY);
    if (days < 1) days = 1;
    days = Math.min(days, 60);
    const secs = sectionIds.map(id => Store.get('sections', id)).filter(Boolean)
      .sort((a, b) => (a.docId === b.docId ? a.order - b.order : 0))
      .sort((a, b) => (Mastery.sectionMastery(a.id) ?? 0.3) - (Mastery.sectionMastery(b.id) ?? 0.3) || 0);
    const plan = [];
    const learnDays = days <= 2 ? days : Math.max(1, Math.ceil(days * 0.55));
    const perDay = Math.ceil(secs.length / learnDays);
    let si = 0;
    for (let d = 0; d < days; d++) {
      const date = start + d * DAY;
      const tasks = [];
      const remainingDays = days - d;
      if (si < secs.length && (d < learnDays || remainingDays > 2)) {
        const chunk = secs.slice(si, si + perDay); si += chunk.length;
        for (const s of chunk) tasks.push({ id: uid('t'), type: 'learn', sectionIds: [s.id], docId: s.docId, label: `Comprendre « ${trunc(s.title, 50)} »`, minutes: Math.round(minutes * 0.6 / chunk.length), done: false });
        tasks.push({ id: uid('t'), type: 'flash', sectionIds: chunk.map(s => s.id), label: 'Flashcards de ces chapitres', minutes: Math.round(minutes * 0.4), done: false });
      } else if (remainingDays === 1 && days > 1) {
        tasks.push({ id: uid('t'), type: 'lastminute', sectionIds: secs.map(s => s.id), label: 'Révision finale : notions essentielles et erreurs', minutes, done: false });
      } else if (remainingDays === 2 && days > 3) {
        tasks.push({ id: uid('t'), type: 'errors', sectionIds: secs.map(s => s.id), label: 'Travailler mes lacunes', minutes, done: false });
      } else if (d === learnDays || (remainingDays === 3 && days > 4)) {
        tasks.push({ id: uid('t'), type: 'exam', sectionIds: secs.map(s => s.id), label: 'Examen blanc sur tous les chapitres', minutes, done: false });
      } else {
        const done = secs.slice(0, Math.max(si, 1));
        tasks.push({ id: uid('t'), type: 'quiz', sectionIds: done.map(s => s.id), label: 'Quiz mélangé + répétition espacée', minutes, done: false });
      }
      plan.push({ date, tasks });
    }
    return { id: uid('p'), title: title || 'Programme de révision', examDate: end, minutes, sectionIds, docIds, days: plan, createdAt: now() };
  },
  late(plan) {
    const today = startOfDay();
    return plan.days.filter(d => d.date < today).reduce((n, d) => n + d.tasks.filter(t => !t.done).length, 0);
  },
  recalc(plan) {
    const remaining = new Set();
    for (const d of plan.days) for (const t of d.tasks) if (!t.done && t.type === 'learn') t.sectionIds.forEach(id => remaining.add(id));
    const doneDays = plan.days.filter(d => d.date < startOfDay() || d.tasks.every(t => t.done));
    const ids = remaining.size ? [...remaining] : plan.sectionIds;
    const fresh = this.build({ examDate: plan.examDate, minutes: plan.minutes, sectionIds: ids, docIds: plan.docIds, title: plan.title });
    fresh.id = plan.id; fresh.createdAt = plan.createdAt;
    fresh.history = [...(plan.history || []), ...doneDays.filter(d => d.date < startOfDay())];
    fresh.recalculatedAt = now();
    return fresh;
  }
};

/* ---------- Toasts ---------- */
function toast(msg, kind = 'info', ms = 3800) {
  let host = $('#toasts');
  if (!host) { host = document.createElement('div'); host.id = 'toasts'; host.setAttribute('aria-live', 'polite'); document.body.appendChild(host); }
  const el = document.createElement('div');

  host.appendChild(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 300); }, ms);

/* ---------- Modals (in-page; alert/confirm are unavailable) ---------- */
const Modal = {
  stack: [],
  open({ title, body, footer = '', size = '', onClose, labelledBy } = {}) {
    const wrap = document.createElement('div');
    wrap.className = 'modal-wrap';
    const id = uid('m');
    wrap.innerHTML = `<div class="modal ${size}" role="dialog" aria-modal="true" aria-labelledby="${id}"><div class="modal-head"><h3 id="${id}">${esc(title)}</h3><button class="icon-btn" data-act="modal-close" aria-label="Fermer">${icon('x', 20)}</button></div><div class="modal-body">${body}</div>${footer ? `<div class="modal-foot">${footer}</div>` : ''}</div>`;
    wrap.addEventListener('mousedown', e => { if (e.target === wrap) this.close(); });
    document.body.appendChild(wrap);
    const prevFocus = document.activeElement;
    this.stack.push({ wrap, onClose, prevFocus });
    document.body.classList.add('modal-open');
    requestAnimationFrame(() => {
      const f = wrap.querySelector('input:not([type=hidden]),textarea,select,[autofocus]') || wrap.querySelector('.modal-foot .btn-primary') || wrap.querySelector('button');
      if (f) f.focus();
    });
    return wrap;
  },
  close(result) {
    const top = this.stack.pop();
    if (!top) return;
    top.wrap.remove();
    if (!this.stack.length) document.body.classList.remove('modal-open');
    if (top.onClose) top.onClose(result);
    if (top.prevFocus && top.prevFocus.focus) try { top.prevFocus.focus(); } catch (e) { }
  },
  top() { return this.stack.length ? this.stack[this.stack.length - 1].wrap : null; }
};
function confirmModal({ title, text, confirmLabel = 'Confirmer', danger = false }) {
  return new Promise(resolve => {
    let done = false;
    const w = Modal.open({
      title, body: `<p class="lead-sm">${esc(text)}</p>`,
      footer: btn('Annuler', 'modal-close', { kind: 'ghost' }) + btn(confirmLabel, null, { kind: danger ? 'danger' : 'primary', id: 'confirm-yes' }),
      onClose: () => { if (!done) resolve(false); }
    });
    $('#confirm-yes', w).addEventListener('click', () => { done = true; Modal.close(); resolve(true); });
  });
}

/* ---------- Event delegation ---------- */
const Actions = {};
function on(name, fn) { Actions[name] = fn; }
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = Actions[el.dataset.act];
  if (!fn) return;
  e.preventDefault();
  try { const r = fn(el, e); if (r && r.catch) r.catch(err => { console.error(err); toast("Une erreur est survenue. Réessaie.", 'bad'); }); }
  catch (err) { console.error(err); toast("Une erreur est survenue. Réessaie.", 'bad'); }
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-change]');
  if (el && Actions[el.dataset.change]) Actions[el.dataset.change](el, e);
});
document.addEventListener('input', e => {
  const el = e.target.closest('[data-input]');
  if (el && Actions[el.dataset.input]) Actions[el.dataset.input](el, e);
});
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-submit]');
  if (!f) return;
  e.preventDefault();
  const fn = Actions[f.dataset.submit];
  if (fn) { const r = fn(f, e); if (r && r.catch) r.catch(err => { console.error(err); toast('Une erreur est survenue. Réessaie.', 'bad'); }); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && Modal.stack.length) { Modal.close(); return; }
  if (Modal.stack.length) return;
  if (typeof Keys !== 'undefined' && Keys.handler) Keys.handler(e);
});
on('modal-close', () => Modal.close());
const Keys = { handler: null };

/* ---------- Router ---------- */
const Pages = {};
const App = { page: null, params: {}, stack: [] };
function go(page, params = {}, { replace = false } = {}) {
  if (App.page && !replace && !(App.page === page && JSON.stringify(App.params) === JSON.stringify(params))) {
    App.stack.push({ page: App.page, params: App.params });
    if (App.stack.length > 30) App.stack.shift();
  }
  if (App.cleanup) { try { App.cleanup(); } catch (e) { } App.cleanup = null; }
  App.page = page; App.params = params;
  Keys.handler = null;
  render();
  window.scrollTo(0, 0);
  const main = $('#main'); if (main) main.focus({ preventScroll: true });
}
function back(fallback = 'home') {
  if (App.cleanup) { try { App.cleanup(); } catch (e) { } App.cleanup = null; }
  const p = App.stack.pop();
  Keys.handler = null;
  if (p) { App.page = p.page; App.params = p.params; render(); window.scrollTo(0, 0); }
  else go(fallback, {}, { replace: true });
}
function refresh() {
  if (!App.page || App.page === 'session') return;
  const y = window.scrollY;
  const active = document.activeElement && document.activeElement.id;
  render();
  window.scrollTo(0, y);
  if (active) { const el = document.getElementById(active); if (el) el.focus({ preventScroll: true }); }
}
const refreshSoon = debounce(refresh, 250);
on('go', el => go(el.dataset.page, el.dataset.params ? JSON.parse(el.dataset.params) : {}));
on('back', () => back());

/* ============================================================
   core/cloud — optional private backup
   When Revora is opened inside Claude with a signed-in viewer,
   each collection is mirrored (chunked JSON) under the viewer's
   private path data/users/<id>/ — invisible to anyone else.
   Opened from disk (index.html), this module stays off and the
   app is purely local.
   ============================================================ */
const Cloud = {
  status: 'off',       // off | syncing | on | error
  col: null,
  dirty: new Set(),
  queue: Promise.resolve(),
  restoring: false,
  lastSync: 0,
  CHUNK: 60000,
  SYNCED: ['prefs', 'folders', 'documents', 'sections', 'concepts', 'questions', 'flashcards', 'attempts', 'sessions', 'plans', 'generated', 'chats'],

  async init() {
    try {
      if (!window.claude || typeof window.claude.use !== 'function') return;
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (!db || !user) return;
      const id = await user.id();
      if (!id || !/^[A-Za-z0-9_\-.~:@+]{1,190}$/.test(id)) return;
      this.col = db.collection('data/users/' + id);
      this.status = 'syncing'; this.emit();
      await this.reconcile();
      this.status = 'on'; this.lastSync = now(); this.emit();
      Store.onChange(c => { if (!this.restoring && this.SYNCED.includes(c)) { this.dirty.add(c); this.flushSoon(); } });
    } catch (e) {
      console.warn('[Revora] sauvegarde privée indisponible', e);
      this.status = e && (e.code === 'invalid_argument' || e.code === 'not_granted') ? 'off' : 'error';
      this.emit();
    }
  },
  emit() { if (App.page === 'settings') refreshSoon(); },
  flushSoon: debounce(() => Cloud.flush(), 4000),
  flush() {
    if (!this.col || this.status === 'off') return;
    const cols = [...this.dirty]; this.dirty.clear();
    if (!cols.length) return;
    this.queue = this.queue.then(async () => {
      for (const c of cols) await this.writeCollection(c);
      await this.col.doc('sync').set({ t: Store.stamp() || now(), v: 1 });
      this.status = 'on'; this.lastSync = now();
    }).catch(e => {
      console.warn('[Revora] synchro', e);
      cols.forEach(c => this.dirty.add(c));
      this.status = e && (e.code === 'invalid_argument' || e.code === 'revoked') ? 'off' : 'error';
      this.emit();
    });
  },
  async writeCollection(c) {
    const rows = Store.all(c).map(o => Store._clean(o));
    const s = JSON.stringify(rows);
    const n = Math.max(1, Math.ceil(s.length / this.CHUNK));
    for (let i = 0; i < n; i++) await this.col.doc('c-' + c + '~' + i).set({ s: s.slice(i * this.CHUNK, (i + 1) * this.CHUNK) });
    const prev = await this.col.doc('c-' + c).get();
    const oldN = prev.exists ? (prev.data().n || 0) : 0;
    await this.col.doc('c-' + c).set({ n, t: now() });
    for (let i = n; i < oldN; i++) await this.col.doc('c-' + c + '~' + i).delete();
  },
  async readCollection(c) {
    const head = await this.col.doc('c-' + c).get();
    if (!head.exists) return null;
    const n = head.data().n || 0;
    let s = '';
    for (let i = 0; i < n; i++) {
      const part = await this.col.doc('c-' + c + '~' + i).get();
      if (!part.exists) throw new Error('chunk');
      s += part.data().s;
    }
    const rows = JSON.parse(s || '[]');
    return Array.isArray(rows) ? rows : null;
  },
  async reconcile() {
    const sync = await this.col.doc('sync').get();
    const remoteT = sync.exists ? (sync.data().t || 0) : 0;
    const localT = Store.stamp();
    if (remoteT && (Store.isEmpty() || remoteT > localT)) {
      // restore: the private copy is newer (other device) or this browser lost its data
      const data = {};
      for (const c of this.SYNCED) data[c] = await this.readCollection(c);
      this.restoring = true;
      try {
        for (const c of this.SYNCED) if (data[c]) await Store.replaceCollection(c, data[c]);
        Store.put('meta', { id: 'sync', updatedAt: remoteT });
      } finally { this.restoring = false; }
      SearchIndex.invalidate(); Mastery.bump();
      applyTheme(); applyTextScale();
      if (App.page) { go(prefs().onboarded ? (App.page === 'onboarding' ? 'home' : App.page) : 'onboarding', App.params, { replace: true }); }
      toast('Tes données ont été restaurées depuis ta sauvegarde privée.', 'good', 5000);
    } else if (!Store.isEmpty() && localT > remoteT) {
      this.SYNCED.forEach(c => this.dirty.add(c));
      this.flush();
      await this.queue;
    }
  },
  async wipe() {
    if (!this.col) return;
    try {
      const all = await this.col.limit(1000).get();
      for (const d of all.docs) await this.col.doc(d.id).delete();
    } catch (e) { console.warn('[Revora] suppression de la sauvegarde', e); }
  },
  label() {
    return {
      off: window.claude ? 'Non disponible (connecte-toi à Claude pour l\'activer)' : 'Non disponible dans cette version : tes données restent dans ce navigateur. Pense à exporter une sauvegarde de temps en temps',
      syncing: 'Synchronisation en cours…',
      on: 'Active — dernière synchronisation ' + (this.lastSync ? fmtRelative(this.lastSync) : ''),
      error: 'Synchronisation interrompue — réessai à la prochaine modification'
    }[this.status];
  }
};

    const folders = Store.all('folders').sort((a, b) => a.name.localeCompare(b.name));
    let docs = Store.all('documents');
    const f = LibState.filter;
    if (f === 'fav') docs = docs.filter(d => d.favorite && !d.archived);
    else if (f === 'archived') docs = docs.filter(d => d.archived);
    else if (f.startsWith('folder:')) docs = docs.filter(d => d.folderId === f.slice(7) && !d.archived);
    else docs = docs.filter(d => !d.archived);
    const q = norm(LibState.q);
    if (q) docs = docs.filter(d => norm(d.title).includes(q));
    const mOf = d => { const m = Mastery.docMastery(d.id); return m && m.value != null ? m.value : -1; };

    const total = Store.count('documents');
    const passages = LibState.q.trim().length >= 3 ? SearchIndex.search(activeDocIds(), LibState.q, 6) : [];

    return `<div class="page">
      <div class="page-head row between wrap">
        <div><h1>Mes cours</h1><p class="muted">${plural(total, 'document')} sur cet appareil</p></div>

      <div class="toolbar">
        <label class="search"><span class="sr">Rechercher</span>${icon('search', 18)}<input id="lib-q" type="search" placeholder="Rechercher un cours ou un passage…" value="${attr(LibState.q)}" data-input="lib-search" autocomplete="off"></label>
        <label class="select-wrap"><span class="sr">Trier</span><select id="lib-sort" data-change="lib-sort">
          <option value="recent"${LibState.sort === 'recent' ? ' selected' : ''}>Récents</option>
          <option value="name"${LibState.sort === 'name' ? ' selected' : ''}>Nom</option>
          <option value="mastery"${LibState.sort === 'mastery' ? ' selected' : ''}>Maîtrise la plus faible</option></select></label>
      </div>
      <div class="chips" role="tablist">
        ${[['all', 'Tous'], ['fav', 'Favoris'], ...folders.map(fo => ['folder:' + fo.id, fo.name]), ['archived', 'Archivés']].map(([k, l]) => `<button class="chip${f === k ? ' active' : ''}" role="tab" aria-selected="${f === k}" data-act="lib-filter" data-k="${attr(k)}">${k.startsWith('folder:') ? icon('folder', 14) : ''}${esc(l)}</button>`).join('')}
        ${f.startsWith('folder:') ? btn('', 'folder-menu', { kind: 'ghost', ic: 'more', size: 'sm', data: { id: f.slice(7) }, title: 'Gérer le dossier' }) : ''}
      </div>
      ${passages.length ? `<section class="card passages"><h3>${icon('search', 16)} Passages trouvés dans tes cours</h3>
        <ul>${passages.map(h => { const d = Store.get('documents', h.docId); return `<li><button class="passage" data-act="open-passage" data-doc="${h.docId}" data-sec="${h.sectionId}">
          <span class="p-where"><strong>${esc(trunc(d ? d.title : '', 50))}</strong> · ${esc(trunc(h.title, 50))}${h.page ? ` · p. ${h.page}` : ''}</span>
          <span class="p-text">${highlight(trunc(h.text, 260), LibState.q)}</span></button></li>`; }).join('')}</ul></section>` : ''}
      ${docs.length ? `<div class="course-grid">${docs.map(d => `<div class="cg-item">${courseCard(d)}<button class="cg-menu icon-btn" data-act="doc-menu" data-id="${d.id}" aria-label="Actions pour ${attr(d.title)}">${icon('more', 20)}</button></div>`).join('')}</div>`
          : emptyState({ ic: 'search', title: 'Aucun cours ne correspond', text: f === 'archived' ? 'Aucun cours archivé.' : 'Essaie un autre mot ou un autre filtre.' })}
      ` : emptyState({ ic: 'book', title: 'Commence par importer ton premier cours', text: 'PDF, Word, PowerPoint, texte, CSV ou images de cours.', actions: btn('Importer un document', 'open-import', { ic: 'upload' }) + btn('Essayer avec un exemple', 'load-sample', { kind: 'outline', ic: 'play' }) })}
    </div>`;
  }
};

on('doc-fav', el => { const d = Store.get('documents', el.dataset.id); d.favorite = !d.favorite; Store.put('documents', d); Modal.close(); refresh(); });
on('doc-archive', el => { const d = Store.get('documents', el.dataset.id); d.archived = !d.archived; Store.put('documents', d); Modal.close(); toast(d.archived ? 'Cours archivé. Il n\'apparaît plus dans les révisions.' : 'Cours désarchivé.', 'good'); refresh(); });
on('doc-delete', async el => {
  const d = Store.get('documents', el.dataset.id);
  Modal.close();
  if (!d || !(await confirmModal({ title: 'Supprimer ce cours ?', text: `« ${trunc(d.title, 60)} », ses chapitres, questions, flashcards, fiches et l'historique de réponses associé seront supprimés de cet appareil. Cette action est définitive.`, confirmLabel: 'Supprimer', danger: true }))) return;
  deleteDocument(d.id);
  toast('Cours supprimé.', 'good');
  if (App.page === 'course') go('library', {}, { replace: true }); else refresh();
});
function deleteDocument(id) {
  Enrich.cancel(id);
  for (const c of ['sections', 'concepts', 'questions', 'flashcards', 'attempts', 'generated', 'chats']) Store.delWhere(c, x => x.docId === id);
  for (const p of Store.all('plans')) {
    if (!(p.docIds || []).includes(id)) continue;
    p.docIds = p.docIds.filter(x => x !== id);
    const valid = new Set(Store.all('sections').map(s => s.id));
    p.sectionIds = p.sectionIds.filter(s => valid.has(s));
    for (const day of p.days) day.tasks = day.tasks.filter(t => (t.sectionIds || []).some(s => valid.has(s)));
    if (!p.docIds.length) Store.del('plans', p.id); else Store.put('plans', p);
  }
  Store.del('documents', id);
  SearchIndex.invalidate(id); Mastery.bump();
}

/* ---------- Import modal ---------- */
const ImportUI = { busy: false, results: [] };
on('open-import', () => openImport());
function openImport() {
  if (ImportUI.busy) return toast('Un import est déjà en cours.', 'warn');
  const folders = Store.all('folders');
  const imgOk = Caps.canImages();
  const w = Modal.open({
    title: 'Importer un cours', size: 'lg',
    body: `
    <div class="tabs" role="tablist">
      <button class="tab active" role="tab" aria-selected="true" data-act="imp-tab" data-t="file">${icon('upload', 16)} Fichiers</button>
      <button class="tab" role="tab" aria-selected="false" data-act="imp-tab" data-t="paste">${icon('text', 16)} Coller du texte</button>
    </div>
    <div id="imp-file">
      <label class="drop" id="drop" tabindex="0">
        <input id="imp-input" type="file" multiple accept=".pdf,.docx,.pptx,.txt,.md,.markdown,.csv,.tsv,.json,.html,.htm,.rtf${imgOk ? ',.png,.jpg,.jpeg,.webp,.gif' : ''}" hidden>
        <span class="drop-ic">${icon('upload', 28)}</span>
        <strong>Glisse tes fichiers ici</strong>
        <span class="muted sm">ou <u>choisis sur ton appareil</u> · plusieurs fichiers possibles</span>
        <span class="muted xs">PDF, DOCX, PPTX, TXT, MD, CSV, HTML${imgOk ? ', images (OCR par l\'IA)' : ''} · 30 Mo max par fichier</span>
      </label>
      ${!imgOk ? `<p class="muted xs">Les images et PDF scannés demandent l'IA (lecture du texte). ${esc(Net.isOnline() ? '' : 'Tu es hors ligne.')}</p>` : ''}
    </div>
    <form id="imp-paste" hidden data-submit="imp-paste">
      <label class="field"><span>Titre</span><input id="paste-title" maxlength="120" placeholder="Ex. Chapitre 3 — La cellule"></label>
      <label class="field"><span>Contenu</span><textarea id="paste-text" rows="9" placeholder="Colle ici tes notes, un chapitre, un article…"></textarea></label>
      <p class="muted xs">Astuce : les lignes « Chapitre 1 », « I. », « 1. Titre » ou « # Titre » deviennent des chapitres.</p>
      <button class="btn btn-primary" type="submit">${icon('check', 18)}<span>Créer le cours</span></button>
    </form>
    ${folders.length ? `<label class="field inline"><span>Ranger dans</span><select id="imp-folder"><option value="">Aucun dossier</option>${folders.map(f => `<option value="${f.id}"${LibState.filter === 'folder:' + f.id ? ' selected' : ''}>${esc(f.name)}</option>`).join('')}</select></label>` : ''}
    <div id="imp-list" class="imp-list" aria-live="polite"></div>
    <p class="muted xs">${icon('shield', 12)} Tes documents sont enregistrés dans ce navigateur. ${AI.canRemote() ? "Avec l'IA active, les extraits nécessaires sont envoyés à Claude pour l'analyse approfondie." : 'Rien n\'est envoyé sur Internet en mode local.'}</p>`,
    onClose: () => { if (ImportUI.results.length === 1 && !ImportUI.busy && App.page !== 'course') { } }
  });
  ImportUI.results = [];
  const input = $('#imp-input', w), drop = $('#drop', w);
  input.addEventListener('change', () => { handleFiles([...input.files]); input.value = ''; });
  drop.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); input.click(); } });
  ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', e => { const files = [...(e.dataTransfer && e.dataTransfer.files || [])]; if (files.length) handleFiles(files); });
}
on('imp-tab', el => {
  const t = el.dataset.t;
  $$('.modal .tab').forEach(b => { b.classList.toggle('active', b.dataset.t === t); b.setAttribute('aria-selected', b.dataset.t === t); });
  $('#imp-file').hidden = t !== 'file'; $('#imp-paste').hidden = t !== 'paste';
  if (t === 'paste') $('#paste-title').focus();
});
on('imp-paste', async () => {
  if (ImportUI.busy) return;
  const title = $('#paste-title').value.trim(), text = $('#paste-text').value;
  await runImports([{ name: title || 'Notes collées', text, title }]);
});
function handleFiles(files) {
  if (ImportUI.busy) return toast('Patiente, un import est en cours.', 'warn');
  if (!files.length) return;
  if (files.length > 20) { toast('20 fichiers maximum à la fois.', 'warn'); files = files.slice(0, 20); }
  runImports(files.map(f => ({ name: f.name, file: f })));
}
async function runImports(items) {
  ImportUI.busy = true;
  const list = $('#imp-list');
  const folderSel = $('#imp-folder');
  const folderId = folderSel ? folderSel.value || null : null;
  const rows = items.map(it => {
    const id = uid('r');
    list.insertAdjacentHTML('beforeend', `<div class="imp-row" id="${id}"><div class="imp-name">${icon('book', 16)}<strong>${esc(trunc(it.name, 60))}</strong></div><div class="imp-status muted sm">En attente…</div><div class="imp-steps"></div></div>`);
    return { it, id };
  });
  const created = [];
  for (const { it, id } of rows) {
    const row = document.getElementById(id);
    const status = row && row.querySelector('.imp-status'), stepsEl = row && row.querySelector('.imp-steps');
    const setStep = (i, label) => {
      if (!row || !document.body.contains(row)) return;
      status.innerHTML = `<span class="spinner sm" aria-hidden="true"></span> ${esc(label)}`;
      stepsEl.innerHTML = Importer.STEPS.map((s, k) => `<span class="st ${k < i ? 'done' : k === i ? 'cur' : ''}" title="${attr(s)}"></span>`).join('');
    };
    try {
      const r = it.file ? await Importer.importFile(it.file, { folderId, progress: setStep }) : await Importer.importText(it.title, it.text, { folderId, progress: setStep });
      created.push(r.doc);
      if (row && document.body.contains(row)) {
        row.classList.add('ok');
        status.innerHTML = `${icon('check', 16)} ${plural(r.sections.length, 'chapitre')}, ${plural(r.concepts.length, 'notion')}, ${r.questions.length} questions, ${plural(r.flashcards.length, 'flashcard')}${r.doc.note ? ' · ' + esc(r.doc.note) : ''}`;
        stepsEl.innerHTML = `${btn('Ouvrir', 'open-course-modal', { kind: 'ghost', size: 'sm', data: { id: r.doc.id } })}`;
      }
      if (AI.canRemote()) Enrich.run(r.doc.id);
    } catch (e) {
      console.error(e);
      if (row && document.body.contains(row)) {
        row.classList.add('err');
        status.innerHTML = `${icon('alert', 16)} ${esc(e.userMessage || (e && e.code ? aiErrorMessage(e) : "Impossible d'analyser ce document pour le moment. Réessaie."))}`;
        stepsEl.innerHTML = '';
      }
    }
  }
  ImportUI.busy = false;
  if (created.length) {
    const p = $('#imp-paste'); if (p) p.reset && p.reset();
    toast(created.length === 1 ? `« ${trunc(created[0].title, 40)} » est prêt.` : `${created.length} cours importés.`, 'good');
    if (AI.canRemote()) toast("Analyse IA approfondie en arrière-plan : de nouvelles questions arrivent chapitre par chapitre.", 'info', 5000);
    if (!Modal.stack.length) refresh();
    else if (App.page === 'home' || App.page === 'library') refreshBehindModal();
  }
}
function refreshBehindModal() {
  const page = Pages[App.page];
  const main = $('#main');
  if (!page || !main || page.bare) return;
  try { const tmp = document.createElement('div'); tmp.innerHTML = shell(page.render(App.params)); const nm = tmp.querySelector('#main'); if (nm) main.innerHTML = nm.innerHTML; } catch (e) { }
}

/* ============================================================
   pages/course — one document: overview, content, fiches,
   flashcards, quiz, mind map, assistant

const COURSE_TABS = [
  ['overview', 'Aperçu', 'home'], ['content', 'Contenu', 'text'], ['fiches', 'Fiches', 'book'], ['flash', 'Flashcards', 'cards'],
  ['quiz', 'Quiz', 'quiz'], ['map', 'Carte mentale', 'map'], ['chat', 'Assistant', 'chat']
];
const CourseUI = { qbankLimit: 30, qbankFilter: 'all', ficheBusy: null, ficheSection: 'all' };

Pages.course = {
  render(p) {
    const d = Store.get('documents', p.id);
    if (!d) return `<div class="page">${emptyState({ ic: 'book', title: 'Ce cours est introuvable', text: 'Il a peut-être été supprimé.', actions: btn('Mes cours', 'go', { data: { page: 'library' } }) })}</div>`;
    const tab = p.tab || 'overview';
    const secs = Store.where('sections', s => s.docId === d.id).sort((a, b) => a.order - b.order);
    const body = { overview: this.overview, content: this.content, fiches: this.fiches, flash: this.flash, quiz: this.quiz, map: this.map, chat: this.chat }[tab] || this.overview;
    return `<div class="page course">
      <button class="crumb" data-act="go" data-page="library">${icon('left', 16)} Mes cours</button>
      <div class="course-head">
        ${docThumb(d, 'lg')}
        <div class="ch-main">
          <h1>${esc(d.title)}</h1>
          <div class="row wrap gap-s">${d.sample ? badge('Exemple', 'orange') : ''}${badge((d.kind || 'texte').toUpperCase(), 'neutral')}${badge(d.domain + (d.domain !== 'Général' ? ' · estimation' : ''), 'blue')}${d.pageCount ? badge(plural(d.pageCount, d.unit === 'diapo' ? 'diapo' : 'page'), 'neutral') : ''}${badge(d.lang === 'en' ? 'Anglais' : 'Français', 'neutral')}</div>
        </div>
        <button class="icon-btn" data-act="doc-menu" data-id="${d.id}" aria-label="Actions du cours">${icon('more', 22)}</button>
      </div>

      <div class="course-body">${body.call(this, d, secs, p)}</div>
    </div>`;
  },
  mount(p) {
    if (p.tab === 'content' && p.section) {
      const el = document.getElementById('sec-' + p.section);
      if (el) { el.open = true; setTimeout(() => el.scrollIntoView({ block: 'start' }), 30); }

    if (p.tab === 'chat') Assistant.mount();

  },

  /* ---------- Overview ---------- */
  overview(d, secs) {
    const concepts = Store.where('concepts', c => c.docId === d.id);
    const nQ = Store.count('questions', q => q.docId === d.id && !q.disabled);
    const nF = Store.count('flashcards', f => f.docId === d.id);
    const m = Mastery.docMastery(d.id);
    const due = dueCounts([d.id]);
    const key = concepts.slice().sort((a, b) => b.importance - a.importance).slice(0, 8);
    return `
      <div class="action-row">
        ${btn('Réviser ce cours', 'course-review', { ic: 'play', data: { id: d.id }, size: 'lg' })}
        ${btn('Apprends-moi', 'course-teach', { kind: 'outline', ic: 'bulb', data: { id: d.id } })}
        ${btn('Teste mon niveau', 'course-diag', { kind: 'outline', ic: 'target', data: { id: d.id } })}
        ${btn("J'ai mon examen bientôt", 'course-lastminute', { kind: 'outline', ic: 'clock', data: { id: d.id } })}
      </div>
      ${this.aiCard(d)}
      <div class="stat-tiles">
        <div class="tile"><span class="tile-v tnum">${secs.length}</span><span class="tile-l">chapitres</span></div>
        <div class="tile"><span class="tile-v tnum">${concepts.length}</span><span class="tile-l">notions</span></div>
        <div class="tile"><span class="tile-v tnum">${nQ}</span><span class="tile-l">questions</span></div>
        <div class="tile"><span class="tile-v tnum">${nF}</span><span class="tile-l">flashcards</span></div>
        <div class="tile accent"><span class="tile-v tnum">${m && m.value != null ? Math.round(m.value * 100) + ' %' : '—'}</span><span class="tile-l">maîtrise${m && m.value != null ? ` · ${m.evaluated}/${m.total} notions évaluées` : ''}</span></div>
      </div>
      ${due.total ? `<div class="due-strip">${icon('clock', 16)}<span>${plural(due.total, 'élément')} de ce cours à revoir aujourd'hui.</span>${btn('Réviser maintenant', 'course-due', { kind: 'ghost', size: 'sm', data: { id: d.id } })}</div>` : ''}
      <section class="card">
        ${sectionHead('À savoir absolument', `<span class="muted sm">${icon('star', 14)} ${key.length} notions essentielles</span>`)}
        ${key.length ? `<div class="key-grid">${key.map(c => `<button class="key-item" data-act="concept" data-id="${c.id}">
          <span class="ki-top"><strong>${esc(c.name)}</strong>${masteryBadge(Mastery.of(c.id))}</span>
          <span class="ki-def">${esc(trunc(c.aiBody || c.body || c.definition, 130))}</span>
          <span class="ki-why">${icon('bulb', 13)} ${esc(c.why || '')}${c.whySource === 'ai' ? ' (estimation IA)' : ''}</span></button>`).join('')}</div>`
        : `<p class="muted">Aucune notion n'a été repérée automatiquement. ${AI.canRemote() ? "Lance l'analyse IA pour les identifier." : 'Ajoute des définitions claires (« X est… ») ou utilise l\'IA en ligne.'}</p>`}
      </section>
      <section class="card">
        ${sectionHead('Chapitres', `<span class="muted sm">Structure modifiable</span>`)}
        <ol class="chap-list">${secs.map((s, i) => {
          const sm = Mastery.sectionMastery(s.id);
          const nq = Store.count('questions', q => q.sectionId === s.id && !q.disabled);
          const cs = concepts.filter(c => c.sectionId === s.id).sort((a, b) => b.importance - a.importance);
          const pages = s.pageFrom ? `${d.unit === 'diapo' ? 'diapos' : 'p.'} ${s.pageFrom}${s.pageTo && s.pageTo !== s.pageFrom ? '–' + s.pageTo : ''}` : '';
          return `<li class="chap">
            <details>
              <summary><span class="chap-n tnum">${i + 1}</span><span class="chap-t"><strong>${esc(s.title)}</strong><span class="muted xs">${pages ? pages + ' · ' : ''}${plural(cs.length, 'notion')} · ${nq} questions</span></span>
              <span class="chap-m">${progressBar(sm, masteryKind(sm))}<span class="tnum xs">${sm != null ? Math.round(sm * 100) + ' %' : '—'}</span></span></summary>
              <div class="chap-body">
                ${cs.length ? `<div class="concept-chips">${cs.map(c => `<button class="cchip lvl-${Mastery.level(Mastery.of(c.id))}" data-act="concept" data-id="${c.id}">${esc(c.name)}</button>`).join('')}</div>` : '<p class="muted sm">Aucune notion repérée dans ce chapitre.</p>'}
                <div class="row wrap">
                  ${btn("S'entraîner", 'chap-train', { kind: 'primary', size: 'sm', ic: 'play', data: { id: s.id } })}
                  ${btn('Lire', 'go', { kind: 'ghost', size: 'sm', ic: 'text', data: { page: 'course', params: JSON.stringify({ id: d.id, tab: 'content', section: s.id }) } })}
                  ${btn('Renommer', 'chap-rename', { kind: 'ghost', size: 'sm', ic: 'edit', data: { id: s.id } })}
                  ${i > 0 ? btn('Fusionner avec le précédent', 'chap-merge', { kind: 'ghost', size: 'sm', ic: 'up', data: { id: s.id } }) : ''}
                </div>
              </div>
            </details>
          </li>`;
        }).join('')}</ol>
      </section>`;
  },
  aiCard(d) {
    const ai = d.ai || { status: 'idle' };
    const running = Enrich.isRunning(d.id);
    if (running) return `<div class="ai-card running"><span class="spinner" aria-hidden="true"></span><div><strong>Analyse IA en cours</strong><span class="muted sm">Chapitre ${Math.min(ai.done.length + 1, ai.total)} / ${ai.total}${ai.current ? ' · ' + esc(trunc(ai.current, 50)) : ''} — les questions déjà créées sont enregistrées.</span></div>${btn('Arrêter', 'ai-stop', { kind: 'ghost', size: 'sm', data: { id: d.id } })}</div>`;
    if (Enrich.pending.includes(d.id)) return `<div class="ai-card running"><span class="spinner" aria-hidden="true"></span><div><strong>Analyse IA en attente</strong><span class="muted sm">Elle démarrera dès que l'analyse en cours sera terminée.</span></div></div>`;
    if (ai.status === 'done') return `<div class="ai-card done">${icon('check', 18)}<div><strong>Analyse IA terminée</strong><span class="muted sm">${plural(ai.questions || 0, 'question')} ajoutée${(ai.questions || 0) > 1 ? 's' : ''} · les éléments sont vérifiés contre le texte du cours.</span></div></div>`;
    if (ai.status === 'partial') return `<div class="ai-card partial">${icon('refresh', 18)}<div><strong>Analyse IA interrompue</strong><span class="muted sm">${ai.done.length} / ${ai.total} chapitres analysés et enregistrés.${ai.error ? ' ' + esc(ai.error) : ''}</span></div>${AI.canRemote() ? btn('Reprendre', 'ai-run', { kind: 'primary', size: 'sm', data: { id: d.id } }) : `<span class="muted xs">${esc(AI.whyNot())}</span>`}</div>`;
    if (AI.canRemote()) return `<div class="ai-card idle">${icon('spark', 18)}<div><strong>Analyse IA approfondie</strong><span class="muted sm">Questions plus variées (application, cas pratiques, raisonnement) vérifiées contre ton cours.</span></div>${btn('Lancer', 'ai-run', { kind: 'primary', size: 'sm', data: { id: d.id } })}</div>`;
    return `<div class="ai-card local">${icon('shield', 18)}<div><strong>Mode local</strong><span class="muted sm">Questions, flashcards et fiches ont été créées depuis le texte, sur ton appareil. ${esc(AI.whyNot())}</span></div></div>`;
  },

  /* ---------- Content ---------- */
  content(d, secs, p) {
    const q = p.q || '';
    const hits = q.trim().length >= 3 ? SearchIndex.search([d.id], q, 8) : [];
    return `
      <form class="toolbar" data-submit="content-search"><label class="search"><span class="sr">Rechercher dans ce cours</span>${icon('search', 18)}<input id="content-q" type="search" value="${attr(q)}" placeholder="Où parle-t-on de… ?" autocomplete="off"></label>${btn('Rechercher', null, { type: 'submit', kind: 'primary' })}</form>
      ${q.trim().length >= 3 ? `<section class="card passages"><h3>${hits.length ? plural(hits.length, 'passage') + ' pour « ' + esc(q) + ' »' : 'Aucun passage trouvé pour « ' + esc(q) + ' »'}</h3>
        <ul>${hits.map(h => `<li><button class="passage" data-act="goto-section" data-sec="${h.sectionId}"><span class="p-where"><strong>${esc(trunc(h.title, 60))}</strong>${h.page ? ` · ${d.unit === 'diapo' ? 'diapo' : 'p.'} ${h.page}` : ''}</span><span class="p-text">${highlight(trunc(h.text, 300), q)}</span></button></li>`).join('')}</ul></section>` : ''}
      <div class="reader">${secs.map((s, i) => `<details class="read-sec" id="sec-${s.id}"><summary><span class="chap-n tnum">${i + 1}</span><strong>${esc(s.title)}</strong>${s.pageFrom ? `<span class="muted xs">${d.unit === 'diapo' ? 'diapos' : 'p.'} ${s.pageFrom}${s.pageTo && s.pageTo !== s.pageFrom ? '–' + s.pageTo : ''}</span>` : ''}</summary><div class="read-text" data-sec="${s.id}"></div></details>`).join('')}</div>`;
  },

  /* ---------- Fiches ---------- */
  fiches(d, secs) {
    const sid = CourseUI.ficheSection;
    const secSel = `<label class="select-wrap"><span class="sr">Chapitre</span><select id="fiche-sec" data-change="fiche-sec"><option value="all">Tout le cours</option>${secs.map(s => `<option value="${s.id}"${sid === s.id ? ' selected' : ''}>${esc(trunc(s.title, 60))}</option>`).join('')}</select></label>`;
    const cur = CourseUI.ficheType || 'express';
    const cached = Store.get('generated', `${d.id}|${cur}|${sid}`);
    const canAI = AI.canRemote();
    const def = AI.FICHES[cur];
    return `
      <div class="toolbar">${secSel}</div>
      <div class="fiche-types">${Object.entries(AI.FICHES).map(([k, f]) => `<button class="ftype${cur === k ? ' active' : ''}" data-act="fiche-type" data-t="${k}" aria-pressed="${cur === k}">${esc(f.label)}${!f.local ? `<em>${icon('spark', 12)} IA</em>` : ''}</button>`).join('')}</div>
      <section class="card fiche">
        <div class="row between wrap"><h3>${esc(def.label)}</h3>
          <div class="row wrap gap-s">
            ${cached ? badge(cached.by === 'ia' ? 'Rédigé par l\'IA' : 'Extrait du cours (local)', cached.by === 'ia' ? 'orange' : 'blue', cached.by === 'ia' ? 'spark' : 'book') : ''}
            ${cached ? btn('', 'fiche-copy', { kind: 'ghost', ic: 'copy', size: 'sm', title: 'Copier' }) + btn('', 'fiche-export', { kind: 'ghost', ic: 'download', size: 'sm', title: 'Exporter' }) : ''}
          </div></div>
        <div id="fiche-out" class="md-out">${cached ? md(cached.text) : def.local ? '' : (canAI ? `<p class="muted">Cette fiche est rédigée par l'IA à partir de ton cours.</p>` : aiNote(AI.whyNot() + " Les fiches express, complète, examen, dernière minute et les résumés extractifs restent disponibles hors ligne."))}</div>
        <div class="row wrap">
          ${def.local ? btn(cached ? 'Régénérer' : 'Créer la fiche', 'fiche-gen', { kind: cached ? 'ghost' : 'primary', ic: cached ? 'refresh' : 'check', data: { id: d.id } }) : ''}
          ${def.local ? btn("Améliorer avec l'IA", 'fiche-gen-ai', { kind: 'outline', ic: 'spark', data: { id: d.id }, disabled: !canAI, title: canAI ? '' : AI.whyNot() }) : btn(cached ? 'Régénérer' : 'Générer avec l\'IA', 'fiche-gen-ai', { kind: 'primary', ic: 'spark', data: { id: d.id }, disabled: !canAI, title: canAI ? '' : AI.whyNot() })}
          ${CourseUI.ficheBusy ? btn('Arrêter', 'fiche-stop', { kind: 'ghost', size: 'sm' }) : ''}
        </div>
      </section>`;
  },

  /* ---------- Flashcards ---------- */
  flash(d) {
    const cards = Store.where('flashcards', f => f.docId === d.id).sort((a, b) => a.createdAt - b.createdAt);
    const t = now();
    const due = cards.filter(f => SRS.isDue(f, t));
    const fresh = cards.filter(f => !f.srs);
    const list = cards.slice(0, 60);
    return `
      <div class="stat-tiles three">
        <div class="tile"><span class="tile-v tnum">${cards.length}</span><span class="tile-l">flashcards</span></div>
        <div class="tile"><span class="tile-v tnum">${due.length}</span><span class="tile-l">à revoir</span></div>
        <div class="tile"><span class="tile-v tnum">${fresh.length}</span><span class="tile-l">jamais vues</span></div>
      </div>
      <div class="action-row">
        ${btn(due.length ? `Réviser les ${due.length} dues` : 'Réviser', 'flash-start', { ic: 'play', data: { id: d.id, mode: due.length ? 'due' : 'mix' }, disabled: !cards.length, size: 'lg' })}
        ${btn('Toutes les cartes', 'flash-start', { kind: 'outline', ic: 'cards', data: { id: d.id, mode: 'all' }, disabled: !cards.length })}
        ${btn('Ajouter', 'flash-add', { kind: 'ghost', ic: 'plus', data: { id: d.id } })}
        ${btn('Exporter (Anki)', 'flash-export', { kind: 'ghost', ic: 'download', data: { id: d.id }, disabled: !cards.length })}
      </div>
      ${cards.length ? `<ul class="fc-list">${list.map(f => `<li class="fc-item">
        <div class="fc-q">${richText(f.front)}</div><div class="fc-a">${richText(f.back)}</div>
        <div class="fc-meta">${f.srs ? `<span class="xs muted">${SRS.isDue(f, t) ? 'À revoir' : 'Prochaine révision ' + fmtDate(f.srs.due)}</span>` : '<span class="xs muted">Jamais vue</span>'}${f.generator === 'ia' ? badge('IA', 'orange') : f.generator === 'user' ? badge('Ajoutée', 'neutral') : ''}
        ${btn('', 'flash-del', { kind: 'ghost', ic: 'trash', size: 'sm', data: { id: f.id }, title: 'Supprimer la carte' })}</div></li>`).join('')}</ul>${cards.length > 60 ? `<p class="muted sm">+ ${cards.length - 60} autres cartes, toutes incluses dans les révisions.</p>` : ''}`
        : emptyState({ ic: 'cards', title: 'Aucune flashcard', text: 'Ajoute tes propres cartes ou lance l\'analyse IA.', actions: btn('Ajouter une flashcard', 'flash-add', { data: { id: d.id }, ic: 'plus' }) })}`;
  },

  /* ---------- Quiz ---------- */
  quiz(d, secs) {
    const qs = Store.where('questions', q => q.docId === d.id && !q.disabled);
    const byType = {};
    qs.forEach(q => byType[q.type] = (byType[q.type] || 0) + 1);
    const f = CourseUI.qbankFilter;
    const shown = qs.filter(q => f === 'all' || q.type === f || q.sectionId === f).slice(0, CourseUI.qbankLimit);
    const canAI = AI.canRemote();
    return `
      <section class="card">
        ${sectionHead('Lancer un quiz')}
        <form class="form-grid" data-submit="course-quiz" id="cq-form">
          <input type="hidden" id="cq-doc" value="${d.id}">
          <label class="field"><span>Chapitre</span><select id="cq-sec"><option value="">Tous les chapitres</option>${secs.map(s => `<option value="${s.id}">${esc(trunc(s.title, 60))}</option>`).join('')}</select></label>
          <label class="field"><span>Nombre de questions</span><select id="cq-n">${[5, 10, 15, 20, 30].map(n => `<option${n === 10 ? ' selected' : ''}>${n}</option>`).join('')}</select></label>
          <label class="field"><span>Difficulté</span><select id="cq-diff"><option value="adaptive">Adaptative</option><option value="1">Facile</option><option value="2">Intermédiaire</option><option value="3">Difficile</option><option value="4">Expert</option></select></label>
          <fieldset class="field types"><legend>Types</legend>${['mcq', 'tf', 'short', 'free', 'order'].map(t => `<label class="check"><input type="checkbox" name="cq-type" value="${t}" ${prefs().qTypes.includes(t) ? 'checked' : ''}><span>${typeLabel(t)} <em class="muted">${byType[t] || 0}</em></span></label>`).join('')}</fieldset>
          <div class="row wrap form-actions"><button class="btn btn-primary" type="submit">${icon('play', 18)}<span>Commencer</span></button>${btn('Mode examen', 'go', { kind: 'outline', ic: 'clock', data: { page: 'quiz', params: JSON.stringify({ doc: d.id }) } })}${btn('Examen blanc', 'mock-exam', { kind: 'outline', ic: 'flag', data: { id: d.id } })}</div>
        </form>
      </section>
      <section class="card">
        ${sectionHead('Questions personnalisées', canAI ? badge('IA active', 'orange', 'spark') : badge('Génération locale', 'blue'))}
        <form class="form-grid" data-submit="custom-gen" id="cg-form">
          <input type="hidden" id="cg-doc" value="${d.id}">
          <label class="field span2"><span>Ta demande</span><input id="cg-ins" maxlength="300" placeholder="Ex. « Fais-moi 10 questions difficiles sur l'élasticité » ou « Teste si j'ai vraiment compris »"></label>
          <label class="field"><span>Chapitre</span><select id="cg-sec"><option value="">Tous les chapitres</option>${secs.map(s => `<option value="${s.id}">${esc(trunc(s.title, 60))}</option>`).join('')}</select></label>
          <label class="field"><span>Nombre</span><select id="cg-n">${[5, 10, 20].map(n => `<option${n === 10 ? ' selected' : ''}>${n}</option>`).join('')}</select></label>
          <label class="field"><span>Difficulté</span><select id="cg-diff"><option value="">Mélangée</option><option value="1">Facile</option><option value="2">Intermédiaire</option><option value="3">Difficile</option><option value="4">Expert</option></select></label>
          <label class="field"><span>Cibler</span><select id="cg-focus"><option value="">Tout le contenu</option><option value="errors">Mes erreurs</option><option value="weak">Mes notions faibles</option></select></label>
          <div class="row wrap form-actions span2"><button class="btn btn-primary" type="submit" id="cg-btn">${icon('spark', 18)}<span>Générer et commencer</span></button>${!canAI ? `<span class="muted xs">${esc(AI.whyNot())} Revora complète avec les questions locales disponibles.</span>` : ''}</div>
        </form>
        <div id="cg-status"></div>
      </section>
      <section class="card">
        ${sectionHead('Banque de questions', `<span class="muted sm">${qs.length} au total</span>`)}
        <div class="chips">${[['all', 'Toutes'], ...Object.keys(byType).map(t => [t, typeLabel(t)])].map(([k, l]) => `<button class="chip${f === k ? ' active' : ''}" data-act="qbank-filter" data-k="${k}">${esc(l)}</button>`).join('')}</div>
        ${shown.length ? `<ul class="qbank">${shown.map(q => `<li><div class="qb-top">${badge(typeLabel(q.type), 'neutral')}${badge(diffLabel(q.difficulty), 'neutral')}${q.generator === 'ia' ? badge('IA', 'orange') : badge('Local', 'blue')}${q.origin !== 'source' ? badge(q.origin === 'external' ? 'Connaissance générale' : 'Déduction', 'neutral') : ''}<span class="xs muted">${q.seen ? plural(q.seen, 'fois') : 'jamais posée'}</span>${btn('', 'q-disable', { kind: 'ghost', ic: 'trash', size: 'sm', data: { id: q.id }, title: 'Retirer cette question' })}</div><p>${esc(trunc(q.prompt.replace(/```[\s\S]*?```/g, '[code]'), 180))}</p></li>`).join('')}</ul>
          ${qs.filter(q => f === 'all' || q.type === f).length > shown.length ? btn('Afficher plus', 'qbank-more', { kind: 'ghost' }) : ''}` : '<p class="muted">Aucune question.</p>'}
      </section>`;
  },

  /* ---------- Mind map ---------- */
  map(d, secs) {
    const concepts = Store.where('concepts', c => c.docId === d.id);
    if (!secs.length) return emptyState({ ic: 'map', title: 'Pas de structure à afficher' });
    const W = 1000, H = 700, cx = W / 2, cy = H / 2;
    const n = Math.min(secs.length, 12);
    const R1 = n > 6 ? 205 : 175, sx = 1.3;
    let nodes = '', lines = '';
    const lbl = (x, y, text, cls, anchor = 'middle') => `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="${anchor}" class="${cls}">${esc(text)}</text>`;
    secs.slice(0, n).forEach((s, i) => {
      const a = -Math.PI / 2 + i * 2 * Math.PI / n;
      const x = cx + Math.cos(a) * R1 * sx, y = cy + Math.sin(a) * R1;
      lines += `<path d="M${cx},${cy} Q${(cx + x) / 2 + 20},${(cy + y) / 2 - 20} ${x.toFixed(1)},${y.toFixed(1)}" class="mm-l1"/>`;
      const cs = concepts.filter(c => c.sectionId === s.id).sort((p, q) => q.importance - p.importance).slice(0, n > 8 ? 2 : 3);
      cs.forEach((c, j) => {
        const spread = cs.length === 1 ? 0 : (j - (cs.length - 1) / 2) * (n > 6 ? 0.2 : 0.3);
        const aa = a + spread;
        const R2 = R1 + (n > 6 ? 105 : 125);
        const x2 = clamp(cx + Math.cos(aa) * R2 * sx, 165, W - 165), y2 = clamp(cy + Math.sin(aa) * R2, 24, H - 24);
        const lvl = Mastery.level(Mastery.of(c.id));
        lines += `<line x1="${x.toFixed(1)}" y1="${y.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" class="mm-l2"/>`;
        const anchor = Math.abs(x2 - cx) < 60 ? 'middle' : x2 > cx ? 'start' : 'end';
        const tx = anchor === 'start' ? x2 + 9 : anchor === 'end' ? x2 - 9 : x2;
        const ty = anchor === 'middle' ? (y2 > cy ? y2 + 18 : y2 - 11) : y2 + 4;
        nodes += `<g class="mm-c" data-act="concept" data-id="${c.id}" tabindex="0" role="button" aria-label="${attr(c.name)}"><circle cx="${x2.toFixed(1)}" cy="${y2.toFixed(1)}" r="6.5" class="mm-dot lvl-${lvl}"/>${lbl(tx, ty, trunc(c.name, 22), 'mm-t2', anchor)}</g>`;
      });
      nodes += `<g class="mm-s" data-act="go" data-page="course" data-params="${attr(JSON.stringify({ id: d.id, tab: 'content', section: s.id }))}" tabindex="0" role="button" aria-label="${attr(s.title)}"><rect x="${(x - 78).toFixed(1)}" y="${(y - 19).toFixed(1)}" width="156" height="38" rx="19" class="mm-sbox"/>${lbl(x, y + 5, trunc(s.title.replace(/^(chapitre|chapter)\s*\d+\s*[—–:-]\s*/i, ''), 20), 'mm-t1')}</g>`;
    });
    const words = d.title.replace(/\s*\((exemple|example)\)\s*$/i, '').split(/\s+/);
    const tl = ['', ''];
    for (const w of words) { if ((tl[0] + ' ' + w).trim().length <= 13 && !tl[1]) tl[0] = (tl[0] + ' ' + w).trim(); else tl[1] = (tl[1] + ' ' + w).trim(); }
    if (!tl[0]) { tl[0] = trunc(words[0], 13); tl[1] = ''; }
    const center = `<g><circle cx="${cx}" cy="${cy}" r="66" class="mm-center"/>${lbl(cx, cy - (tl[1] ? 12 : 2), tl[0], 'mm-t0')}${tl[1] ? lbl(cx, cy + 5, trunc(tl[1], 14), 'mm-t0') : ''}${lbl(cx, cy + 25, plural(secs.length, 'chapitre'), 'mm-t0s')}</g>`;
    return `
      <p class="muted sm">Le cours au centre, ses chapitres autour, et leurs notions les plus importantes. Couleur des points : ${badge('maîtrisée', 'good')} ${badge('en cours', 'warn')} ${badge('à revoir', 'bad')} ${badge('non évaluée', 'neutral')}</p>
      <div class="mm-wrap"><svg class="mindmap" viewBox="0 0 ${W} ${H}" role="img" aria-label="Carte mentale de ${attr(d.title)}">${lines}${center}${nodes}</svg></div>
      ${secs.length > n ? `<p class="muted sm">Seuls les 12 premiers chapitres sont représentés.</p>` : ''}
      <details class="card"><summary><strong>Version texte de la carte</strong></summary><ul class="mm-text">${secs.map(s => `<li><strong>${esc(s.title)}</strong><ul>${concepts.filter(c => c.sectionId === s.id).sort((a, b) => b.importance - a.importance).slice(0, 6).map(c => `<li>${esc(c.name)}</li>`).join('')}</ul></li>`).join('')}</ul></details>`;
  },

  chat(d) { return Assistant.render({ docIds: [d.id], embedded: true }); }
};

/* lazy render of long section texts (performance) */
document.addEventListener('toggle', e => {
  const det = e.target;
  if (!det.classList || !det.classList.contains('read-sec') || !det.open) return;
  const box = det.querySelector('.read-text');
  if (!box || box.dataset.done) return;
  const s = Store.get('sections', box.dataset.sec);
  if (!s) return;
  const d = Store.get('documents', s.docId);
  const unit = d && d.unit === 'diapo' ? 'Diapo' : 'Page';
  const marks = (s.pageMap || []).slice();
  let offset = 0, html = '';
  for (const line of s.text.split('\n')) {
    while (marks.length && marks[0].at <= offset) { const m = marks.shift(); if (m.page != null) html += `<div class="page-mark">${unit} ${m.page}</div>`; }
    if (line.startsWith('## ')) html += `<h4>${esc(line.slice(3))}</h4>`;
    else if (line.trim()) html += `<p>${esc(line)}</p>`;
    offset += line.length + 1;
  }
  box.innerHTML = html || '<p class="muted">Section vide.</p>';
  box.dataset.done = '1';
}, true);

/* ---------- Course actions ---------- */
on('course-tab', el => go('course', { id: App.params.id, tab: el.dataset.t }, { replace: true }));
on('goto-section', el => go('course', { ...App.params, section: el.dataset.sec }, { replace: true }));
on('content-search', () => go('course', { id: App.params.id, tab: 'content', q: $('#content-q').value }, { replace: true }));
on('course-review', el => {

/* ---------- Export helpers ---------- */
function safeName(s) { return String(s || 'revora').replace(/[\\/:*?"<>|]+/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 60) || 'revora'; }
async function saveFile(filename, data, mime) {
  if (Caps.downloads) {
    try { await Caps.downloads.save({ filename, data }); toast('Fichier prêt : ' + filename, 'good'); return true; }
    catch (e) { if (e && e.code === 'cancelled') return false; if (e && e.code !== 'unavailable') { toast("Le fichier n'a pas pu être enregistré.", 'bad'); return false; } }
  }
  if (window.claude) { copyText(typeof data === 'string' ? data : ''); toast("Le téléchargement n'est pas disponible ici : le contenu a été copié.", 'info'); return false; }
  try {
    const blob = new Blob([data], { type: mime || 'application/octet-stream' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast('Fichier téléchargé : ' + filename, 'good');
    return true;
  } catch (e) { toast("Le fichier n'a pas pu être enregistré.", 'bad'); return false; }
}
function copyText(text) {
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (e) { }
    ta.remove();
    toast(ok ? 'Copié.' : 'Sélectionne le texte pour le copier.', ok ? 'good' : 'warn');
  };
  try { navigator.clipboard.writeText(text).then(() => toast('Copié.', 'good'), fallback); } catch (e) { fallback(); }
}

/* ---- 24-session.js ---- */
/* ============================================================
   features/session — practice runner (adaptive), exam runner,
   flashcard runner, results & recovery plan
   ============================================================ */
const Run = { sid: null, qid: null, phase: 'answer', selected: null, order: null, hint: 0, hidden: null, t0: 0, result: null, askConf: false, busy: false, submitted: false };

function newSession(o) {
  const s = {
    id: uid('ss'), kind: o.kind, title: o.title, status: 'active', startedAt: now(), updatedAt: now(),
    items: o.items, idx: 0, answers: {}, adaptive: !!o.adaptive, level: prefs().startLevel || 2, streak: 0,
    followups: {}, inserted: 0, docIds: o.docIds || [...new Set(o.docs || [])], duration: o.duration || 0, deadline: o.duration ? now() + o.duration * 60000 : 0,
    draft: {}, flags: {}, planTask: o.planTask || null
  };
  Store.put('sessions', s);
  return s;
}
function startSession({ kind, title, questions, adaptive, docIds, planTask }) {
  const s = newSession({ kind, title, items: questions.map(q => q.id), adaptive, docIds: docIds || [...new Set(questions.map(q => q.docId))], planTask });
  resetRun(s.id);
  go('session', { id: s.id });
}
function startExam({ kind = 'exam', title, questions, duration, docIds, mock, planTask }) {
  const s = newSession({ kind, title, items: questions.map(q => q.id), duration, docIds: docIds || [...new Set(questions.map(q => q.docId))], planTask });
  s.mock = !!mock; Store.put('sessions', s);
  resetRun(s.id);
  go('session', { id: s.id });
}
function startFlashSession({ cards, title, planTask }) {
  const s = newSession({ kind: 'flash', title, items: cards.map(f => f.id), docIds: [...new Set(cards.map(f => f.docId))], planTask });
  resetRun(s.id);
  go('session', { id: s.id });
}
function resumeSession(id) {
  const s = Store.get('sessions', id);
  if (!s) return toast('Session introuvable.', 'warn');
  resetRun(id);
  go('session', { id });
}

function shuffleOrder(items) { let o = shuffle(items); let tries = 0; while (o.every((x, i) => x === items[i]) && tries++ < 5) o = shuffle(items); return o; }

on('pick', el => {
  if (Run.phase !== 'answer' && App.page === 'session') {
    const s = Store.get('sessions', App.params.id);
    if (!s || !isExam(s)) return;
  }
  const v = el.dataset.v;
  Run.selected = v === 'true' ? true : v === 'false' ? false : +v;
  const s = Store.get('sessions', App.params.id);
  if (s && isExam(s)) { ExamRunner.saveDraft(s, Run.selected); }
  rerunSession();
});
on('ord-move', el => {
  const i = +el.dataset.i, d = +el.dataset.d;
  const o = Run.order; if (!o) return;
  const j = i + d; if (j < 0 || j >= o.length) return;
  [o[i], o[j]] = [o[j], o[i]];
  const s = Store.get('sessions', App.params.id);
  if (s && isExam(s)) ExamRunner.saveDraft(s, o.slice());
  rerunSession();
});
on('hint', () => {
  const s = Store.get('sessions', App.params.id);
  const q = Practice.current(s);
  if (!q || !q.hints || Run.hint >= q.hints.length) return;
  Run.hint++;
  if (q.type === 'mcq' && /retirées|removed/.test(q.hints[Run.hint - 1] || '')) {
    const wrong = shuffle(q.options.map((_, i) => i).filter(i => i !== q.answer)).slice(0, 2);
    Run.hidden = new Set(wrong);
    if (Run.hidden.has(Run.selected)) Run.selected = null;
  }
  rerunSession();
});
on('dont-know', () => { if (Run.submitted) return; Run.submitted = true; Run.selected = null; gradeCurrent({ skipped: true }); });
on('submit-q', () => {
  if (Run.submitted || Run.busy) return;
  const s = Store.get('sessions', App.params.id);
  const q = Practice.current(s);
  if (!q) return;
  const v = answerValue(q);
  if (v === null || v === undefined || (typeof v === 'string' && !v.trim())) return toast(q.type === 'mcq' || q.type === 'tf' ? 'Choisis une réponse.' : 'Écris une réponse, ou choisis « Je ne sais pas ».', 'warn', 2500);
  Run.selected = v;
  Run.submitted = true;
  Run.ms = now() - Run.t0;

});
on('conf', el => { if (Run.phase !== 'confidence') return; gradeCurrent({ confidence: +el.dataset.v }); });

async function gradeCurrent({ skipped, confidence }) {
  const s = Store.get('sessions', App.params.id);
  const q = Practice.current(s);
  if (!q) return;
  const ms = Run.ms || (now() - Run.t0);
  const value = skipped ? null : Run.selected;
  Run.phase = 'feedback';
  let r;
  if (skipped) r = { score: 0, skipped: true };
  else if (q.type === 'free' || q.type === 'short') {
    Run.result = { pending: true }; Run.busy = true; rerunSession();
    r = await AI.evaluate(q, value);
    Run.busy = false;
    if (App.page !== 'session' || Run.qid !== q.id) return;
  } else r = LocalAI.evaluate(q, value);
  r.confidence = confidence || null;
  if (Run.hint > 0 && r.score === 1 && Run.hint >= 2) r.feedback = (r.feedback ? r.feedback + ' ' : '') + 'Trouvé avec des indices : cette notion reviendra un peu plus tôt.';
  Run.result = r;
  const effective = Run.hint >= 2 && r.score === 1 ? 0.5 : r.score;
  recordAttempt({ q, score: effective, confidence, ms, hintsUsed: Run.hint, chosen: value, sessionId: s.id, mode: s.kind });
  s.answers[q.id] = { score: r.score, confidence: confidence || null, ms, at: now(), skipped: !!skipped };
  // adaptive difficulty & remediation
  if (s.adaptive) {
    if (r.score === 1) { s.streak = (s.streak || 0) + 1; if (s.streak >= 2) { s.level = Math.min(4, s.level + 1); s.streak = 0; } }
    else { s.streak = 0; s.level = Math.max(1, s.level - 1); }
  }
  if (r.score < 1 && q.conceptId && s.inserted < 8) insertFollowups(s, q);
  s.updatedAt = now();
  Store.put('sessions', s);
  rerunSession();
}
function insertFollowups(s, q) {
  const inSession = new Set(s.items);
  const pool = Store.where('questions', x => x.conceptId === q.conceptId && !inSession.has(x.id) && !x.disabled);
  const similar = pool.find(x => x.type === q.type) || null;
  const different = pool.find(x => x.type !== q.type && x !== similar) || null;
  const picks = [];
  if (similar) picks.push([similar, 'similar']);
  if (different) picks.push([different, 'verify']);
  let pos = s.idx + 2;
  for (const [x, label] of picks) {
    pos = Math.min(pos, s.items.length);
    s.items.splice(pos, 0, x.id);
    s.followups[x.id] = label; s.inserted++;
    pos += 2;
  }
}
on('next-q', () => {
  const s = Store.get('sessions', App.params.id);
  if (!s || Run.phase !== 'feedback' || Run.busy) return;
  s.idx++;
  if (s.adaptive && s.idx < s.items.length) {
    // pick among the next 3 the question closest to the current level
    let best = s.idx, bestD = 9;
    for (let k = s.idx; k < Math.min(s.items.length, s.idx + 3); k++) {
      const x = Store.get('questions', s.items[k]);
      if (!x || s.followups[x.id]) continue;
      const dd = Math.abs((x.difficulty || 2) - s.level);
      if (dd < bestD) { bestD = dd; best = k; }
    }
    if (best !== s.idx && !s.followups[s.items[s.idx]]) [s.items[s.idx], s.items[best]] = [s.items[best], s.items[s.idx]];
  }
  s.updatedAt = now();
  Store.put('sessions', s);
  Run.qid = null;
  if (s.idx >= s.items.length) return finishSession(s);
  rerunSession();
  window.scrollTo(0, 0);
});
on('report-q', async el => {

on('session-quit', async () => {
  const s = Store.get('sessions', App.params.id);
  if (!s) return go('home');
  const n = Object.keys(s.answers).length;
  if (isExam(s)) {
    if (!(await confirmModal({ title: "Quitter l'examen ?", text: "Tu pourras le reprendre depuis l'accueil tant que le temps n'est pas écoulé. Aucune réponse n'est corrigée avant la fin.", confirmLabel: 'Quitter' }))) return;
    ExamRunner.stop();

  if (n === 0) { s.status = 'abandoned'; Store.put('sessions', s); return back(); }
  const ok = await confirmModal({ title: 'Mettre en pause ?', text: `Tes ${plural(n, 'réponse')} sont enregistrées. Tu pourras reprendre depuis l'accueil.`, confirmLabel: 'Mettre en pause' });

});

function finishSession(s) {
  if (s.status === 'done') return go('results', { id: s.id }, { replace: true });
  s.status = 'done'; s.endedAt = now(); s.updatedAt = now();
  const vals = Object.values(s.answers);
  s.score = vals.length ? vals.reduce((a, x) => a + x.score, 0) / vals.length : 0;
  Store.put('sessions', s);
  if (s.planTask) markPlanTask(s.planTask);
  ExamRunner.stop();
  go('results', { id: s.id }, { replace: true });
}
function markPlanTask(taskId) {
  for (const p of Store.all('plans')) for (const d of p.days) for (const t of d.tasks) if (t.id === taskId) { t.done = true; t.doneAt = now(); Store.put('plans', p); }
}

        ${questionMeta(q)}

        ${btn('Terminer', 'exam-finish', { size: 'lg', ic: 'check' })}
